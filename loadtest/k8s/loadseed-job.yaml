apiVersion: batch/v1
kind: Job
metadata:
  name: loadseed
  namespace: loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app: loadseed }
    spec:
      restartPolicy: Never
      tolerations:
        - key: loadtest
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        pool: loadtest-generators
      containers:
        - name: loadseed
          image: "${LOADSEED_IMAGE}"
          args:
            - --organizations=${LT_ORGANIZATIONS}
            - --users-per-organization=${LT_USERS}
            # stdout, not a file. The image is distroless/static, so there is no way to get a
            # file back out of it: `kubectl cp` needs tar in the container, `kubectl exec`
            # needs a shell, and an ephemeral debug container cannot mount this volume.
            # run-k8s.sh reads the manifest from this Job's logs.
            - --output=/dev/stdout
          env:
            - name: HERMES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-loadtest-bootstrap
                  key: database_url
            - name: HERMES_API_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-loadtest-bootstrap
                  key: hmac_secret
