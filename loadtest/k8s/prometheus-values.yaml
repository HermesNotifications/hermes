# Helm values for prometheus-community/prometheus (standalone, not kube-prometheus-stack)
server:
  extraArgs:
    web.enable-remote-write-receiver: ""
  persistentVolume:
    enabled: true
    size: 20Gi
  retention: 24h
  tolerations:
    - key: loadtest
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    pool: loadtest-generators
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 2,    memory: 4Gi }

# Subchart toggles. The key must match the subchart's alias exactly -- Helm ignores an
# unrecognised top-level key rather than rejecting it, so a near-miss disables nothing and
# you only notice when the pod turns up. `pushgateway:` is such a near-miss; the alias is
# `prometheus-pushgateway`, and with the wrong key the pushgateway deployed happily onto
# whichever node the scheduler liked, including the one running the system under test.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
