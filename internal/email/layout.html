<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .wrapper { width: 100%; background-color: #f4f4f7; padding: 24px 0; }
  .content { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; }
  .body { padding: 32px 24px; color: #333333; font-size: 16px; line-height: 1.5; }
  .footer { padding: 16px 24px; text-align: center; color: #999999; font-size: 12px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="content">
    <div class="body">
      {{.Content}}
    </div>
    <div class="footer">
      Sent via Hermes
    </div>
  </div>
</div>
</body>
</html>
