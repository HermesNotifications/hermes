packages:
  - "sdks/typescript/packages/*"
  - "web/admin"
# Written deliberately, not by `pnpm install` -- pnpm scaffolds this key with the
# literal text "set this to true or false", which is not valid config and makes every
# subsequent `pnpm run` fail with ERR_PNPM_IGNORED_BUILDS. All three genuinely need
# their build scripts: protobufjs and unrs-resolver compile native bindings, sharp
# fetches its platform binary.
allowBuilds:
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - defu@6.1.5
  - hono@4.12.12 || 4.12.14 || 4.12.16 || 4.12.18 || 4.12.21 || 4.12.25 || 4.12.27
  - '@hono/node-server@1.19.13 || 2.0.5'
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - protobufjs@7.5.5 || 7.5.6 || 7.5.8 || 7.6.1 || 7.6.3 || 7.6.5
  - fast-uri@3.1.1 || 3.1.2 || 3.1.3 || 3.1.4
  - ip-address@10.1.1
  - '@protobufjs/utf8@1.1.1'
  - qs@6.15.2
  - brace-expansion@1.1.16 || 2.1.2 || 5.0.6 || 5.0.7 || 5.0.8
  - js-yaml@4.1.2 || 4.3.0
  - '@babel/core@7.29.1'
  - body-parser@2.3.0
  - sharp@0.35.0
  - next@16.2.11
  - better-auth@1.6.22
overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  # Scoped per major line, NOT `brace-expansion@<=5.0.7: ^5.0.8` as `pnpm audit
  # --fix=override` generates it. That form also catches 1.x and 2.x consumers and
  # drags them across two majors; minimatch v3 does `module.exports = expand`, which
  # v5 changed, so ESLint dies with "TypeError: expand is not a function". Each major
  # line has its own patched release, so pin within the line instead.
  brace-expansion@>=1.0.0 <1.1.16: ^1.1.16
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=5.0.0 <5.0.8: ^5.0.8
  ip-address@<=10.1.0: ^10.1.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <=4.1.1: ^4.1.2
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
