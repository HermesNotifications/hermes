openapi: 3.1.0
info:
  description: "Server-to-server API for managing subscription categories, templates,\
    \ and notifications."
  title: Hermes Admin API
  version: 1.0.0
servers:
- url: /
paths:
  /v1/apikeys:
    get:
      operationId: list-api-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all API keys
      tags:
      - API Keys
      x-accepts:
      - application/json
      - application/problem+json
    post:
      operationId: create-api-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new API key
      tags:
      - API Keys
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/apikeys/{id}:
    delete:
      operationId: delete-api-key
      parameters:
      - description: API key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: API key ID
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an API key
      tags:
      - API Keys
      x-accepts:
      - application/problem+json
  /v1/auth/token:
    post:
      operationId: exchange-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange credentials for a user JWT token
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/notifications:
    get:
      operationId: list-notifications
      parameters:
      - description: Max results (default 50)
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: Max results (default 50)
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NotificationItem"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List recent notifications
      tags:
      - Notifications
      x-accepts:
      - application/json
      - application/problem+json
  /v1/notifications/{id}:
    get:
      operationId: get-notification
      parameters:
      - description: Notification ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Notification ID
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get notification status and events
      tags:
      - Notifications
      x-accepts:
      - application/json
      - application/problem+json
  /v1/send:
    post:
      operationId: send-notification
      parameters:
      - description: Idempotency key for deduplication
        explode: false
        in: header
        name: X-Idempotency-Key
        required: false
        schema:
          description: Idempotency key for deduplication
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a notification
      tags:
      - Notifications
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/subscriptions/categories:
    get:
      operationId: list-subscription-categories
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SubscriptionCategory"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subscription categories
      tags:
      - Subscriptions
      x-accepts:
      - application/json
      - application/problem+json
    post:
      operationId: create-subscription-category
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCategory"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a subscription category
      tags:
      - Subscriptions
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/subscriptions/categories/{category_id}/subscriptions:
    get:
      operationId: list-subscriptions
      parameters:
      - description: Category ID
        explode: false
        in: path
        name: category_id
        required: true
        schema:
          description: Category ID
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Subscription"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subscriptions in a category
      tags:
      - Subscriptions
      x-accepts:
      - application/json
      - application/problem+json
    post:
      operationId: create-subscription
      parameters:
      - description: Category ID
        explode: false
        in: path
        name: category_id
        required: true
        schema:
          description: Category ID
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a subscription
      tags:
      - Subscriptions
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/subscriptions/categories/{id}:
    delete:
      operationId: delete-subscription-category
      parameters:
      - description: Category ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Category ID
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a subscription category
      tags:
      - Subscriptions
      x-accepts:
      - application/problem+json
    put:
      operationId: update-subscription-category
      parameters:
      - description: Category ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Category ID
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCategory"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a subscription category
      tags:
      - Subscriptions
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/subscriptions/{id}:
    delete:
      operationId: delete-subscription
      parameters:
      - description: Subscription ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Subscription ID
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a subscription
      tags:
      - Subscriptions
      x-accepts:
      - application/problem+json
    put:
      operationId: update-subscription
      parameters:
      - description: Subscription ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Subscription ID
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a subscription
      tags:
      - Subscriptions
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/templates:
    get:
      operationId: list-templates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NotificationTemplate"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List notification templates
      tags:
      - Templates
      x-accepts:
      - application/json
      - application/problem+json
    post:
      operationId: create-template
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplate"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a notification template
      tags:
      - Templates
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/templates/{id}:
    delete:
      operationId: delete-template
      parameters:
      - description: Template ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Template ID
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a notification template
      tags:
      - Templates
      x-accepts:
      - application/problem+json
    put:
      operationId: update-template
      parameters:
      - description: Template ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: Template ID
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplate"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a notification template
      tags:
      - Templates
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/tenants:
    get:
      operationId: list-tenants
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TenantItem"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List tenants
      tags:
      - Tenants
      x-accepts:
      - application/json
      - application/problem+json
    post:
      operationId: create-tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantItem"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a tenant
      tags:
      - Tenants
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/users:
    get:
      operationId: list-users
      parameters:
      - description: Filter by tenant ID
        explode: false
        in: query
        name: tenant_id
        required: false
        schema:
          description: Filter by tenant ID
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserItem"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users
      tags:
      - Users
      x-accepts:
      - application/json
      - application/problem+json
components:
  schemas:
    ApiKeyCreatedOutputBody:
      additionalProperties: false
      example:
        $schema: https://openapi-generator.tech
        permissions:
        - permissions
        - permissions
        name: name
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        raw_key: raw_key
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          nullable: true
          type: array
        raw_key:
          type: string
      required:
      - created_at
      - id
      - name
      - permissions
      - raw_key
    CreateAPIKeyInputBody:
      additionalProperties: false
      example:
        $schema: https://openapi-generator.tech
        permissions:
        - permissions
        - permissions
        name: name
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        name:
          description: Human-readable key name
          minLength: 1
          type: string
        permissions:
          description: Permission set (defaults to all except apikeys:manage)
          items:
            type: string
          nullable: true
          type: array
      required:
      - name
    CreateCategoryInputBody:
      additionalProperties: false
      example:
        $schema: https://openapi-generator.tech
        default_state: "on"
        default_channels:
        - default_channels
        - default_channels
        name: name
        sort_order: 0
        slug: slug
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        default_channels:
          description: Default delivery channels
          items:
            type: string
          nullable: true
          type: array
        default_state:
          description: Default subscription state
          enum:
          - "on"
          - "off"
          - required
          type: string
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        sort_order:
          description: Display order
          format: int64
          type: integer
      required:
      - default_state
      - name
      - slug
    CreateSubscriptionInputBody:
      additionalProperties: false
      example:
        $schema: https://openapi-generator.tech
        name: name
        sort_order: 0
        slug: slug
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        sort_order:
          description: Display order within category
          format: int64
          type: integer
      required:
      - name
      - slug
    CreateTemplateInputBody:
      additionalProperties: false
      example:
        subscription_id: subscription_id
        $schema: https://openapi-generator.tech
        default_channels:
        - default_channels
        - default_channels
        name: name
        content:
          key:
            key: content
        slug: slug
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        content:
          additionalProperties:
            additionalProperties:
              type: string
          description: "Per-channel content: channel slug -> field key -> template\
            \ string (e.g. {\"email\":{\"subject\":\"...\",\"body\":\"...\"}})"
        default_channels:
          description: Default channels (used when no subscription)
          items:
            type: string
          nullable: true
          type: array
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        subscription_id:
          description: Subscription ID (null for standalone)
          type: string
      required:
      - name
      - slug
    CreateTenantInputBody:
      additionalProperties: false
      example:
        $schema: https://openapi-generator.tech
        name: name
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        name:
          description: Tenant name
          minLength: 1
          type: string
      required:
      - name
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: "Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'"
          type: string
        message:
          description: Error message text
          type: string
        value: {}
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of
            the problem.
          format: uri
          type: string
        status:
          description: HTTP status code
          format: int64
          type: integer
        title:
          description: "A short, human-readable summary of the problem type. This\
            \ value should not change between occurrences of the error."
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          format: uri
          type: string
    Item:
      additionalProperties: false
      example:
        permissions:
        - permissions
        - permissions
        name: name
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          nullable: true
          type: array
      required:
      - created_at
      - id
      - name
      - permissions
    Notification:
      additionalProperties: false
      properties:
        action_label:
          type: string
        action_url:
          type: string
        archived_at:
          format: date-time
          type: string
        body:
          type: string
        category_id:
          type: string
        channels:
          items:
            type: string
          nullable: true
          type: array
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        delivered_at:
          format: date-time
          type: string
        id:
          type: string
        idempotency_key:
          type: string
        read_at:
          format: date-time
          type: string
        sent_at:
          format: date-time
          type: string
        status:
          type: string
        template_id:
          type: string
        tenant_id:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
      - body
      - category_id
      - channels
      - created_at
      - id
      - status
      - tenant_id
      - title
      - user_id
    NotificationEvent:
      additionalProperties: false
      example:
        severity: severity
        metadata: ""
        channel: channel
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        notification_id: notification_id
        event: event
      properties:
        channel:
          type: string
        created_at:
          format: date-time
          type: string
        event:
          type: string
        id:
          type: string
        metadata: {}
        notification_id:
          type: string
        severity:
          type: string
      required:
      - channel
      - created_at
      - event
      - id
      - notification_id
      - severity
    NotificationItem:
      additionalProperties: false
      example:
        tenant_id: tenant_id
        category_id: category_id
        channels:
        - channels
        - channels
        template_slug: template_slug
        user_id: user_id
        created_at: 2000-01-23T04:56:07.000+00:00
        template_id: template_id
        id: id
        body: body
        title: title
        status: status
      properties:
        body:
          type: string
        category_id:
          type: string
        channels:
          items:
            type: string
          nullable: true
          type: array
        created_at:
          format: date-time
          type: string
        id:
          type: string
        status:
          type: string
        template_id:
          type: string
        template_slug:
          type: string
        tenant_id:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
      - body
      - category_id
      - channels
      - created_at
      - id
      - status
      - tenant_id
      - title
      - user_id
    NotificationStatusOutputBody:
      additionalProperties: false
      example:
        notification: ""
        $schema: https://openapi-generator.tech
        events:
        - severity: severity
          metadata: ""
          channel: channel
          created_at: 2000-01-23T04:56:07.000+00:00
          id: id
          notification_id: notification_id
          event: event
        - severity: severity
          metadata: ""
          channel: channel
          created_at: 2000-01-23T04:56:07.000+00:00
          id: id
          notification_id: notification_id
          event: event
