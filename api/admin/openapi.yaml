components:
  schemas:
    ApiKeyCreatedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/ApiKeyCreatedOutputBody.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
        raw_key:
          type: string
      required:
        - id
        - name
        - raw_key
        - permissions
        - created_at
      type: object
    CreateAPIKeyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/CreateAPIKeyInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Human-readable key name
          minLength: 1
          type: string
        permissions:
          description: Permission set (defaults to all except apikeys:manage)
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
      type: object
    CreateCategoryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/CreateCategoryInputBody.json
          format: uri
          readOnly: true
          type: string
        default_channels:
          description: Default delivery channels
          items:
            type: string
          type:
            - array
            - "null"
        default_state:
          description: Default subscription state
          enum:
            - "on"
            - "off"
            - required
          type: string
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        sort_order:
          description: Display order
          format: int64
          type: integer
      required:
        - slug
        - name
        - default_state
      type: object
    CreateOrganizationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/CreateOrganizationInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Organization name
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateSubscriptionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/CreateSubscriptionInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        sort_order:
          description: Display order within category
          format: int64
          type: integer
      required:
        - slug
        - name
      type: object
    CreateTemplateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/CreateTemplateInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          description: "Per-channel content: channel slug -> field key -> template string (e.g. {\"email\":{\"subject\":\"...\",\"body\":\"...\"}})"
          type: object
        default_channels:
          description: Default channels (used when no subscription)
          items:
            type: string
          type:
            - array
            - "null"
        name:
          description: Human-readable name
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier
          minLength: 1
          type: string
        subscription_id:
          description: Subscription ID (null for standalone)
          type: string
      required:
        - slug
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Item:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - permissions
        - created_at
      type: object
    Notification:
      additionalProperties: false
      properties:
        action_label:
          type: string
        action_url:
          type: string
        archived_at:
          format: date-time
          type: string
        body:
          type: string
        category_id:
          type: string
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        delivered_at:
          format: date-time
          type: string
        id:
          type: string
        idempotency_key:
          type: string
        organization_id:
          type: string
        read_at:
          format: date-time
          type: string
        sent_at:
          format: date-time
          type: string
        status:
          type: string
        template_id:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
        - id
        - organization_id
        - user_id
        - category_id
        - title
        - body
        - channels
        - status
        - created_at
      type: object
    NotificationEvent:
      additionalProperties: false
      properties:
        channel:
          type: string
        created_at:
          format: date-time
          type: string
        event:
          type: string
        id:
          type: string
        metadata: {}
        notification_id:
          type: string
        severity:
          type: string
      required:
        - id
        - notification_id
        - channel
        - event
        - severity
        - created_at
      type: object
    NotificationItem:
      additionalProperties: false
      properties:
        body:
          type: string
        category_id:
          type: string
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
        organization_id:
          type: string
        status:
          type: string
        template_id:
          type: string
        template_slug:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
        - id
        - organization_id
        - user_id
        - category_id
        - title
        - body
        - channels
        - status
        - created_at
      type: object
    NotificationStatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/NotificationStatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        events:
          description: Timeline of notification events
          items:
            $ref: "#/components/schemas/NotificationEvent"
          type:
            - array
            - "null"
        notification:
          $ref: "#/components/schemas/Notification"
          description: The notification record
      required:
        - notification
        - events
      type: object
    NotificationTemplate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/NotificationTemplate.json
          format: uri
          readOnly: true
          type: string
        content:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
        created_at:
          format: date-time
          type: string
        default_channels:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        subscription_id:
          type: string
      required:
        - id
        - slug
        - name
        - default_channels
        - created_at
      type: object
    OrganizationItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/OrganizationItem.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        default_locale:
          type: string
        id:
          type: string
        name:
          type: string
        user_count:
          format: int64
          type: integer
      required:
        - id
        - name
        - default_locale
        - user_count
        - created_at
      type: object
    SendContent:
      additionalProperties: false
      properties:
        action_label:
          description: Optional action button label
          type: string
        action_url:
          description: Optional action URL
          type: string
        body:
          description: Notification body
          type: string
        title:
          description: Notification title
          type: string
      required:
        - title
        - body
      type: object
    SendInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/SendInputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          description: Explicit delivery channels
          items:
            type: string
          type:
            - array
            - "null"
        content:
          $ref: "#/components/schemas/SendContent"
          description: Direct content (mutually exclusive with template)
        data:
          additionalProperties: {}
          description: Template data for rendering
          type: object
        template:
          description: Notification template slug (mutually exclusive with content)
          type: string
        to:
          $ref: "#/components/schemas/SendRecipient"
          description: Notification recipient
      required:
        - to
      type: object
    SendOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/SendOutputBody.json
          format: uri
          readOnly: true
          type: string
        notification_id:
          description: ID of the created notification
          type: string
      required:
        - notification_id
      type: object
    SendRecipient:
      additionalProperties: false
      properties:
        contacts:
          additionalProperties:
            type: string
          description: "Per-channel address overrides: address key (\"email\",\"phone\") -> address"
          type: object
        organization_id:
          description: Organization identifier
          minLength: 1
          type: string
        user_id:
          description: External user identifier
          minLength: 1
          type: string
      required:
        - organization_id
        - user_id
      type: object
    Subscription:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/Subscription.json
          format: uri
          readOnly: true
          type: string
        category_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - category_id
        - slug
        - name
        - sort_order
        - created_at
      type: object
    SubscriptionCategory:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/SubscriptionCategory.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        default_channels:
          items:
            type: string
          type:
            - array
            - "null"
        default_state:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        sort_order:
          format: int64
          type: integer
      required:
        - id
        - slug
        - name
        - default_channels
        - default_state
        - sort_order
        - created_at
      type: object
    TokenInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/TokenInputBody.json
          format: uri
          readOnly: true
          type: string
        expires_in:
          description: Requested token lifetime in seconds (min 3600 = 1h, max 604800 = 7d, default 14400 = 4h). The actual expiry includes ±10% random jitter to prevent thundering-herd token refreshes.
          format: int64
          maximum: 604800
          minimum: 3600
          type: integer
        organization_id:
          description: Organization identifier
          minLength: 1
          type: string
        user_id:
          description: External user identifier
          minLength: 1
          type: string
      required:
        - user_id
        - organization_id
      type: object
    TokenOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/TokenOutputBody.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          description: Token expiration time in RFC3339 format
          type: string
        token:
          description: JWT token for user-facing API access
          type: string
      required:
        - token
        - expires_at
      type: object
    UpdateCategoryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/UpdateCategoryInputBody.json
          format: uri
          readOnly: true
          type: string
        default_channels:
          description: Default delivery channels
          items:
            type: string
          type:
            - array
            - "null"
        default_state:
          description: Default subscription state
          enum:
            - "on"
            - "off"
            - required
          type: string
        name:
          description: Human-readable name
          type: string
        sort_order:
          description: Display order
          format: int64
          type: integer
      required:
        - name
        - default_channels
        - default_state
        - sort_order
      type: object
    UpdateSubscriptionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/UpdateSubscriptionInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Human-readable name
          type: string
        sort_order:
          description: Display order within category
          format: int64
          type: integer
      required:
        - name
        - sort_order
      type: object
    UpdateTemplateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/UpdateTemplateInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          description: "Per-channel content: channel slug -> field key -> template string (e.g. {\"email\":{\"subject\":\"...\",\"body\":\"...\"}})"
          type: object
        default_channels:
          description: Default channels (used when no subscription)
          items:
            type: string
          type:
            - array
            - "null"
        name:
          description: Human-readable name
          type: string
        subscription_id:
          description: Subscription ID (null for standalone)
          type: string
      required:
        - name
      type: object
    UserItem:
      additionalProperties: false
      properties:
        contacts:
          additionalProperties:
            type: string
          type: object
        created_at:
          format: date-time
          type: string
        external_id:
          type: string
        id:
          type: string
        locale:
          type:
            - string
            - "null"
        organization_id:
          type: string
        organization_name:
          type: string
      required:
        - id
        - organization_id
        - external_id
        - locale
        - organization_name
        - created_at
      type: object
info:
  description: Server-to-server API for managing subscription categories, templates, and notifications.
  title: Hermes Admin API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/apikeys:
    get:
      operationId: list-api-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all API keys
      tags:
        - API Keys
    post:
      operationId: create-api-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new API key
      tags:
        - API Keys
  /v1/apikeys/{id}:
    delete:
      operationId: delete-api-key
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            description: API key ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an API key
      tags:
        - API Keys
  /v1/auth/token:
    post:
      operationId: exchange-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange credentials for a user JWT token
      tags:
        - Auth
  /v1/notifications:
    get:
      operationId: list-notifications
      parameters:
        - description: Max results (default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 50)
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NotificationItem"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List recent notifications
      tags:
        - Notifications
  /v1/notifications/{id}:
    get:
      operationId: get-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get notification status and events
      tags:
        - Notifications
  /v1/organizations:
    get:
      operationId: list-organizations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationItem"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List organizations
      tags:
        - Organizations
    post:
      operationId: create-organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationItem"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an organization
      tags:
        - Organizations
  /v1/send:
    post:
      operationId: send-notification
      parameters:
        - description: Idempotency key for deduplication
          in: header
          name: X-Idempotency-Key
          schema:
            description: Idempotency key for deduplication
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a notification
      tags:
        - Notifications
  /v1/subscriptions/categories:
    get:
      operationId: list-subscription-categories
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SubscriptionCategory"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subscription categories
      tags:
        - Subscriptions
    post:
      operationId: create-subscription-category
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCategory"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a subscription category
      tags:
        - Subscriptions
  /v1/subscriptions/categories/{category_id}/subscriptions:
    get:
      operationId: list-subscriptions
      parameters:
        - description: Category ID
          in: path
          name: category_id
          required: true
          schema:
            description: Category ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Subscription"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subscriptions in a category
      tags:
        - Subscriptions
    post:
      operationId: create-subscription
      parameters:
        - description: Category ID
          in: path
          name: category_id
          required: true
          schema:
            description: Category ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
