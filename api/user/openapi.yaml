components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    PreferenceListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PreferenceListOutputBody.json
          format: uri
          readOnly: true
          type: string
        data:
          description: List of notification preferences
          items:
            $ref: "#/components/schemas/UserPreference"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    SetPreferenceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetPreferenceInputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          description: Preferred delivery channels
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Operation result
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    UpdateContactsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateContactsInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          type: string
        phone:
          description: Phone number
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        external_id:
          type: string
        id:
          type: string
        locale:
          type: string
        phone:
          type: string
        tenant_id:
          type: string
      required:
        - id
        - tenant_id
        - external_id
        - created_at
      type: object
    UserPreference:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserPreference.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        group_id:
          type: string
        user_id:
          type: string
      required:
        - user_id
        - group_id
        - channels
      type: object
info:
  description: User-facing API for profile management and notification preferences.
  title: Hermes User API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/users/me:
    get:
      operationId: get-profile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get current user profile
      tags:
        - Users
  /v1/users/me/contacts:
    put:
      operationId: update-contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update user contact information
      tags:
        - Users
  /v1/users/me/preferences:
    get:
      operationId: list-preferences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List notification preferences
      tags:
        - Preferences
  /v1/users/me/preferences/{group_id}:
    delete:
      operationId: delete-preference
      parameters:
        - description: Group ID
          in: path
          name: group_id
          required: true
          schema:
            description: Group ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete notification preference for a group
      tags:
        - Preferences
    put:
      operationId: set-preference
      parameters:
        - description: Group ID
          in: path
          name: group_id
          required: true
          schema:
            description: Group ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPreferenceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set notification preference for a group
      tags:
        - Preferences
servers:
  - url: /
