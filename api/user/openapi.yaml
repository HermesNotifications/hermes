components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    PreferenceCategory:
      additionalProperties: false
      properties:
        default_channels:
          items:
            type: string
          type:
            - array
            - "null"
        default_state:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        subscriptions:
          items:
            $ref: "#/components/schemas/PreferenceSubscription"
          type:
            - array
            - "null"
      required:
        - id
        - slug
        - name
        - default_channels
        - default_state
        - subscriptions
      type: object
    PreferenceCenterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PreferenceCenterOutputBody.json
          format: uri
          readOnly: true
          type: string
        categories:
          items:
            $ref: "#/components/schemas/PreferenceCategory"
          type:
            - array
            - "null"
      required:
        - categories
      type: object
    PreferenceSubscription:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        opted_in:
          type: boolean
        slug:
          type: string
        toggleable:
          type: boolean
      required:
        - id
        - slug
        - name
        - opted_in
        - toggleable
      type: object
    SetPreferenceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetPreferenceInputBody.json
          format: uri
          readOnly: true
          type: string
        opted_in:
          description: Whether the user is subscribed
          type: boolean
      required:
        - opted_in
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Operation result
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    UpdateContactsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateContactsInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          type: string
        phone:
          description: Phone number
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        external_id:
          type: string
        id:
          type: string
        locale:
          type: string
        phone:
          type: string
        tenant_id:
          type: string
      required:
        - id
        - tenant_id
        - external_id
        - created_at
      type: object
info:
  description: User-facing API for profile management and notification preferences.
  title: Hermes User API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/users/me:
    get:
      operationId: get-profile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get current user profile
      tags:
        - Users
  /v1/users/me/contacts:
    put:
      operationId: update-contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update user contact information
      tags:
        - Users
  /v1/users/me/preferences:
    get:
      operationId: get-preference-center
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceCenterOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get notification preference center
      tags:
        - Preferences
  /v1/users/me/preferences/{subscription_id}:
    delete:
      operationId: delete-preference
      parameters:
        - description: Subscription ID
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete subscription preference (revert to default)
      tags:
        - Preferences
    put:
      operationId: set-preference
      parameters:
        - description: Subscription ID
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPreferenceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set subscription preference
      tags:
        - Preferences
servers:
  - url: /
