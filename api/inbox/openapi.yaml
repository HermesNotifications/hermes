components:
  schemas:
    ActionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ActionOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Operation result
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListInboxOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListInboxOutputBody.json
          format: uri
          readOnly: true
          type: string
        cursor:
          description: Cursor for next page
          type: string
        data:
          description: List of notifications
          items:
            $ref: "#/components/schemas/Notification"
          type:
            - array
            - "null"
        unread_count:
          description: Total unread notification count
          format: int64
          type: integer
      required:
        - data
        - unread_count
      type: object
    Notification:
      additionalProperties: false
      properties:
        action_label:
          type: string
        action_url:
          type: string
        archived_at:
          format: date-time
          type: string
        body:
          type: string
        category_id:
          type: string
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        delivered_at:
          format: date-time
          type: string
        id:
          type: string
        idempotency_key:
          type: string
        read_at:
          format: date-time
          type: string
        sent_at:
          format: date-time
          type: string
        status:
          type: string
        template_id:
          type: string
        tenant_id:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
        - id
        - tenant_id
        - user_id
        - category_id
        - title
        - body
        - channels
        - status
        - created_at
      type: object
info:
  description: User-facing API for inbox notification management.
  title: Hermes Inbox API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/inbox:
    get:
      operationId: list-inbox
      parameters:
        - description: Filter archived notifications
          explode: false
          in: query
          name: archived
          schema:
            default: false
            description: Filter archived notifications
            type: boolean
        - description: Pagination cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Pagination cursor
            type: string
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInboxOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List inbox notifications
      tags:
        - Inbox
  /v1/inbox/read-all:
    put:
      operationId: mark-all-read
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mark all notifications as read
      tags:
        - Inbox
  /v1/inbox/{id}:
    delete:
      operationId: delete-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a notification
      tags:
        - Inbox
  /v1/inbox/{id}/archive:
    delete:
      operationId: unarchive-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Unarchive a notification
      tags:
        - Inbox
    put:
      operationId: archive-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Archive a notification
      tags:
        - Inbox
  /v1/inbox/{id}/read:
    delete:
      operationId: mark-unread
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mark a notification as unread
      tags:
        - Inbox
    put:
      operationId: mark-read
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mark a notification as read
      tags:
        - Inbox
servers:
  - url: /
