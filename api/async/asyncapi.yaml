asyncapi: 3.0.0
info:
  title: Hermes Notification Platform
  version: 1.0.0
  description: |
    Async messaging contracts for the Hermes notification platform.
    Covers NATS JetStream streams (service-to-service) and real-time
    WebSocket events (server-to-client push).

servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS JetStream message broker
  realtime:
    host: realtime:8000
    protocol: ws
    description: WebSocket server for real-time client push

channels:
  # ---------------------------------------------------------------------------
  # NATS JetStream — NOTIFICATIONS stream
  # ---------------------------------------------------------------------------
  notificationSend:
    address: notification.send
    description: |
      Incoming notification requests. Published by the Admin Service after
      validating and persisting the notification. Consumed by the Dispatch service.
    servers:
      - $ref: '#/servers/nats'
    messages:
      sendMessage:
        $ref: '#/components/messages/SendMessage'
    bindings:
      nats:
        jetstream:
          stream: NOTIFICATIONS
          retention: workqueue
          storage: file
          maxAge: 604800000000000  # 7 days in nanoseconds

  # ---------------------------------------------------------------------------
  # NATS JetStream — DELIVERY stream
  # ---------------------------------------------------------------------------
  deliveryEmail:
    address: delivery.email
    description: Email delivery tasks dispatched by the Dispatch service.
    servers:
      - $ref: '#/servers/nats'
    messages:
      deliveryMessage:
        $ref: '#/components/messages/DeliveryMessage'
    bindings:
      nats:
        jetstream:
          stream: DELIVERY

  deliverySms:
    address: delivery.sms
    description: SMS delivery tasks dispatched by the Dispatch service.
    servers:
      - $ref: '#/servers/nats'
    messages:
      deliveryMessage:
        $ref: '#/components/messages/DeliveryMessage'
    bindings:
      nats:
        jetstream:
          stream: DELIVERY

  deliveryInbox:
    address: delivery.inbox
    description: In-app inbox delivery tasks dispatched by the Dispatch service.
    servers:
      - $ref: '#/servers/nats'
    messages:
      deliveryMessage:
        $ref: '#/components/messages/DeliveryMessage'
    bindings:
      nats:
        jetstream:
          stream: DELIVERY

  # ---------------------------------------------------------------------------
  # NATS JetStream — EVENTS stream
  # ---------------------------------------------------------------------------
  notificationEvents:
    address: notification.events
    description: |
      Delivery lifecycle events. Published by the Dispatch service (routing outcomes)
      and delivery workers (send/fail outcomes). Consumed by the Event Writer
      for batch insert and notification status rollup.
    servers:
      - $ref: '#/servers/nats'
    messages:
      eventMessage:
        $ref: '#/components/messages/EventMessage'
    bindings:
      nats:
        jetstream:
          stream: EVENTS
          retention: workqueue
          storage: file
          maxAge: 604800000000000

  # ---------------------------------------------------------------------------
  # NATS JetStream — DLQ stream
  # ---------------------------------------------------------------------------
  deadLetters:
    address: dlq.>
    description: |
      Dead-letter capture. When a consumer exhausts its delivery attempts or
      rejects a message as permanently unprocessable, the messaging layer
      publishes a DeadLetter envelope to dlq.<original subject> and removes
      the original. Consumed manually by operators (nats CLI) for inspection
      and replay — no in-process consumer. See
      docs/observability/runbooks/dead-letter-queue.md.
    servers:
      - $ref: '#/servers/nats'
    messages:
      deadLetter:
        $ref: '#/components/messages/DeadLetter'
    bindings:
      nats:
        jetstream:
          stream: DLQ
          retention: limits
          storage: file
          maxAge: 604800000000000  # 7 days in nanoseconds
          maxBytes: 1073741824     # 1 GiB

  # ---------------------------------------------------------------------------
  # Real-time WebSocket — user channels
  # ---------------------------------------------------------------------------
  userInboxUpdated:
    address: "user#{userId}"
    description: |
      Inbox status change events pushed to connected clients. Sent when a
      user reads, archives, unarchives, or deletes a notification via the
      Inbox Service API.
    servers:
      - $ref: '#/servers/realtime'
    parameters:
      userId:
        description: The user ID (matches the JWT sub claim)
    messages:
      inboxUpdated:
        $ref: '#/components/messages/InboxUpdatedEvent'
      notificationNew:
        $ref: '#/components/messages/NotificationNewEvent'

operations:
  # --- Publish operations ---
  publishNotification:
    action: send
    channel:
      $ref: '#/channels/notificationSend'
    summary: Admin Service publishes a notification for routing
    description: |
      After validating the request and persisting the notification to Postgres,
      the Admin Service publishes a SendMessage to the NOTIFICATIONS stream.

  dispatchToEmail:
    action: send
    channel:
      $ref: '#/channels/deliveryEmail'
    summary: Dispatch service dispatches email delivery

  dispatchToSms:
    action: send
    channel:
      $ref: '#/channels/deliverySms'
    summary: Dispatch service dispatches SMS delivery

  dispatchToInbox:
    action: send
    channel:
      $ref: '#/channels/deliveryInbox'
    summary: Dispatch service dispatches inbox delivery

  publishEvent:
    action: send
    channel:
      $ref: '#/channels/notificationEvents'
    summary: Dispatch service or worker publishes a delivery lifecycle event

  captureDeadLetter:
    action: send
    channel:
      $ref: '#/channels/deadLetters'
    summary: Messaging layer captures a terminally failed message
    description: |
      Published by internal/messaging in any service when a handler error is
      terminal (max deliveries exhausted, or a PermanentError). There is no
      in-process receive operation — operators consume the DLQ via the nats CLI.

  pushInboxUpdate:
    action: send
    channel:
      $ref: '#/channels/userInboxUpdated'
    summary: Inbox Service pushes status changes to connected clients

  # --- Receive operations ---
  consumeNotifications:
    action: receive
    channel:
      $ref: '#/channels/notificationSend'
    summary: Dispatch service consumes notifications for channel resolution and fan-out
    description: "NATS consumer: dispatch"

  consumeEmailDelivery:
    action: receive
    channel:
      $ref: '#/channels/deliveryEmail'
    summary: Email Worker consumes email delivery tasks
    description: "NATS consumer: worker-email"

  consumeSmsDelivery:
    action: receive
    channel:
      $ref: '#/channels/deliverySms'
    summary: SMS Worker consumes SMS delivery tasks
    description: "NATS consumer: worker-sms"

  consumeInboxDelivery:
    action: receive
    channel:
      $ref: '#/channels/deliveryInbox'
    summary: Inbox Worker consumes inbox delivery tasks
    description: "NATS consumer: worker-inbox"

  consumeEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationEvents'
    summary: Event Writer batch-inserts events and updates notification status
    description: "NATS consumer: event-writer"

  receiveInboxUpdates:
    action: receive
    channel:
      $ref: '#/channels/userInboxUpdated'
    summary: Client receives real-time inbox updates via WebSocket

components:
  messages:
    SendMessage:
      name: SendMessage
      contentType: application/json
      summary: Notification send request
      payload:
        $ref: '#/components/schemas/SendMessage'

    DeliveryMessage:
      name: DeliveryMessage
      contentType: application/json
      summary: Channel-specific delivery task
      payload:
        $ref: '#/components/schemas/DeliveryMessage'

    EventMessage:
      name: EventMessage
      contentType: application/json
      summary: Delivery lifecycle event
      payload:
        $ref: '#/components/schemas/EventMessage'

    DeadLetter:
      name: DeadLetter
      contentType: application/json
      summary: Terminally failed message captured for inspection and replay
      payload:
        $ref: '#/components/schemas/DeadLetter'

    InboxUpdatedEvent:
      name: InboxUpdatedEvent
      contentType: application/json
      summary: Inbox status change pushed to clients via WebSocket
      payload:
        $ref: '#/components/schemas/InboxUpdatedEvent'

    NotificationNewEvent:
      name: NotificationNewEvent
      contentType: application/json
      summary: New notification pushed to clients via WebSocket
      payload:
        $ref: '#/components/schemas/NotificationNewEvent'

  schemas:
    SendMessage:
      type: object
      required:
        - notification_id
        - organization_id
        - external_user_id
        - metadata
        - attempt
      properties:
        notification_id:
          type: string
          description: Base62 time-sortable ID (internal/id/v2)
        organization_id:
          type: string
          format: uuid
        external_user_id:
          type: string
          description: The caller's own identifier for the user, not the internal Hermes id.
        content:
          $ref: '#/components/schemas/MessageContent'
          description: Direct content. Absent when the send names a template instead.
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        client_metadata:
          $ref: '#/components/schemas/NotificationMetadata'
          description: >-
            The sender's opaque object, bound for the recipient's client.

            Deliberately a separate field from `metadata` above, which is Hermes's own routing
            information about the template. The two are unrelated despite the shared word, and
            merging them would not be wire-safe across a rolling deploy.
        data:
          type: object
          additionalProperties: true
          description: Template variables for rendering notification content. Never persisted, and never sent to a client.
        channels:
          type: array
          items:
            type: string
            enum: [email, sms, inbox]
          description: Explicit channel override. If omitted, resolved from user preferences or category defaults.
        contacts:
          type: object
          additionalProperties:
            type: string
          description: Per-send recipient address overrides, keyed by address key (e.g. email, phone).
        idempotency_key:
          type: string
          description: Caller-supplied deduplication key, scoped to the organization.
        attempt:
          type: integer
          minimum: 1

    DeliveryMessage:
      type: object
      required:
        - notification_id
        - organization_id
        - user_id
        - channel
        - content
        - metadata
        - attempt
      properties:
        notification_id:
          type: string
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
        channel:
          type: string
          enum: [email, sms, inbox]
        content:
          $ref: '#/components/schemas/MessageContent'
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        client_metadata:
          $ref: '#/components/schemas/NotificationMetadata'
          description: >-
            Carried on the message rather than looked up, because cmd/worker-inbox wires NATS,
            Redis and Centrifugo and no database -- the process that publishes the realtime
            event has no way to read it back.
        recipient:
          type: object
          additionalProperties:
            type: string
          description: Resolved recipient addresses, keyed by address key (e.g. email, phone).
        attempt:
          type: integer
          minimum: 1

    EventMessage:
      type: object
      required:
        - notification_id
        - channel
        - event
        - severity
      properties:
        notification_id:
          type: string
        channel:
          type: string
          description: |
            The channel the event is about. Empty for events scoped to the whole
            notification rather than one delivery — notification.sent,
            routing.no_channels, routing.failed, render.failed, template.not_found.
          enum: ["", email, sms, inbox]
        event:
          type: string
          description: |
            Event type. Dispatch events: notification.sent, routing.dispatched,
            routing.failed, routing.no_channels, routing.no_contact,
            delivery.publish_failed, render.failed, template.not_found.
            Worker events: {channel}.sent, {channel}.failed.

            Only two of these move the notification's status: notification.sent
            advances it to "sent", and {channel}.sent advances it to "delivered".
          examples:
            - notification.sent
            - routing.dispatched
            - email.sent
            - sms.failed
        severity:
          type: string
          enum: [info, warn, error]
        metadata:
          type: object
          additionalProperties: true
          description: |
            Event-specific metadata. Successful deliveries include provider_name
            and provider_id. Failures include error message.

    DeadLetter:
      type: object
      required:
        - subject
        - stream
        - consumer
        - reason
        - attempts
        - error
        - failed_at
        - payload
      properties:
        subject:
          type: string
          description: Original subject; republish the payload here to replay.
          examples:
            - delivery.email
        stream:
          type: string
          enum: [NOTIFICATIONS, DELIVERY, EVENTS]
        consumer:
          type: string
          description: Durable consumer that gave up on the message.
        reason:
          type: string
          enum: [max_deliveries, terminated]
        attempts:
          type: integer
          minimum: 1
          description: Delivery attempts consumed before dead-lettering.
        error:
          type: string
          description: Handler error from the final attempt.
        failed_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Original message body, verbatim.

    MessageContent:
      type: object
      required:
        - title
        - body
      properties:
        title:
          type: string
        body:
          type: string
        action_url:
          type: string
          format: uri
        action_label:
          type: string

    MessageMetadata:
      type: object
      description: >-
        Hermes's own routing information about the send. Not to be confused with
        `client_metadata`, which is the sender's opaque object for the recipient's client.

        Badly named, and known to be: it predates there being any other kind of metadata on
        these messages. Renaming it to `template` is wanted but is not a safe single step,
        because an old Send's `{"metadata": {...}}` would still be on a retained WorkQueue
        stream when a new Dispatch started reading.
      properties:
        template:
          type: string
          description: Template slug. Absent when the send supplied direct content instead.

    InboxUpdatedEvent:
      type: object
      required:
        - type
        - notification_id
        - action
        - unread_count
        - timestamp
      properties:
        type:
          type: string
          const: inbox.updated
        notification_id:
          type: string
        action:
          type: string
          enum: [read, unread, archive, unarchive, delete, read-all]
        unread_count:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            Unread count after this action. Exact below 1000; a value of 1000 means at least
            1000. Served from the Redis cache, recomputed from the database periodically.
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds. Clients use this to resolve out-of-order updates.

    NotificationNewEvent:
      type: object
      required:
        - type
        - id
        - title
        - body
        - created_at
        - timestamp
      properties:
        type:
          type: string
          const: notification.new
        id:
          type: string
          description: Notification ID
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds
        unread_count:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            Unread count after this arrival. Exact below 1000; a value of 1000 means at least
            1000.

            Optional, and absent more often than you might expect. The inbox worker publishing
            this event has no database connection -- it wires NATS, Redis and Centrifugo and
            nothing else -- so when the Redis count has expired it genuinely does not know the
            number, and omits the field rather than inventing one. A client that sees it absent
            should increment its local count by one and let the next inbox.updated, or the next
            list, correct it.
        action:
          type: object
          properties:
            url:
              type: string
              format: uri
            label:
              type: string
        metadata:
          $ref: '#/components/schemas/NotificationMetadata'

    NotificationMetadata:
      type: object
      description: >-
        Opaque metadata supplied by the sender, stored with the notification and echoed back
        here and on the REST inbox row.

        Hermes reads exactly two keys from it and never interprets anything else. That is a
        commitment rather than an implementation detail: reserving a further bare top-level name
        later would break any caller already using it for their own purposes.

        Omitted entirely when the sender supplied none, so a send without metadata produces the
        same frame clients see today.
      additionalProperties: true
      properties:
        level:
          type: string
          enum: [info, success, warning, error]
          description: >-
            How a client should present this notification.

            Distinct from the `severity` on a delivery event, which is the operational log and
            uses `info`/`warn`/`error`. A client meeting a value it does not recognise should
            treat the notification as having no level, not reject it -- levels may be added.
        toast:
          type: boolean
          description: >-
            Whether a client should surface this transiently -- a toast on the web, a heads-up
            banner on mobile -- rather than waiting for the user to open their inbox.

            A hint, not a delivery channel: it does not affect routing, and a client with no
            such surface is free to ignore it.
