pre-commit:
  parallel: true
  commands:
    vet:
      glob: "*.go"
      run: go vet ./...
    lint:
      glob: "*.go"
      run: golangci-lint run
    build:
      glob: "*.go"
      run: go build ./...
    license-header:
      glob: "*.{go,ts,tsx,js,jsx,mjs,py,sh,tf}"
      run: make license-check

pre-push:
  commands:
    test:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "*.go"
      run: make test
    kustomize:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "deploy/k8s/**/*"
      run: |
        kubectl kustomize deploy/k8s/overlays/local > /dev/null &&
        kubectl kustomize deploy/k8s/overlays/staging > /dev/null &&
        kubectl kustomize deploy/k8s/overlays/production > /dev/null
    terraform:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "infra/terraform/**/*"
      run: |
        cd infra/terraform &&
        terraform fmt -check -recursive &&
        terraform init -backend=false -input=false -no-color > /dev/null &&
        terraform validate
