pre-commit:
  parallel: true
  commands:
    vet:
      glob: "*.go"
      run: go vet ./...
    lint:
      glob: "*.go"
      run: golangci-lint run
    build:
      glob: "*.go"
      run: go build ./...
    copyright-header:
      run: |
        files=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(go|ts|tsx|js|jsx|sh)$' | grep -vE 'node_modules|vendor/|\.d\.ts$')
        [ -z "$files" ] && exit 0
        missing=""
        while IFS= read -r f; do
          [ -f "$f" ] && head -5 "$f" | grep -qF "Copyright 2026 Hermes Notifications" || missing="$missing\n  $f"
        done <<< "$files"
        [ -z "$missing" ] && exit 0
        printf "Files missing copyright header:%b\nRun: head -2 <any-existing-source-file> to see the required format.\n" "$missing"
        exit 1

pre-push:
  commands:
    test:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "*.go"
      run: make test
    kustomize:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "deploy/k8s/**/*"
      run: |
        kubectl kustomize deploy/k8s/overlays/local > /dev/null &&
        kubectl kustomize deploy/k8s/overlays/staging > /dev/null &&
        kubectl kustomize deploy/k8s/overlays/production > /dev/null
    terraform:
      files: git diff --name-only HEAD $(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
      glob: "infra/terraform/**/*"
      run: |
        cd infra/terraform &&
        terraform fmt -check -recursive &&
        terraform init -backend=false -input=false -no-color > /dev/null &&
        terraform validate
