apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: hermessecretsbundle-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: hermes.io/v1alpha1
    kind: HermesSecretsBundle
  mode: Pipeline
  pipeline:
    - step: pull-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: hermes-vpc-context

    - step: render-templates
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $composite := $.observed.composite.resource }}
            {{ $env := index .context "apiextensions.crossplane.io/environment" }}

            ---
            apiVersion: secretsmanager.aws.upbound.io/v1beta1
            kind: Secret
            metadata:
              annotations:
                crossplane.io/composition-resource-name: aws-secret
                gotemplating.fn.crossplane.io/composition-resource-name: aws-secret
            spec:
              forProvider:
                name: hermes/{{ $env.environment }}
                recoveryWindowInDays: {{ $composite.spec.recoveryWindowDays | default 0 }}
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
            ---
            apiVersion: ssm.aws.upbound.io/v1beta1
            kind: Parameter
            metadata:
              annotations:
                crossplane.io/composition-resource-name: ssm-email-webhook
                gotemplating.fn.crossplane.io/composition-resource-name: ssm-email-webhook
                crossplane.io/external-name: /hermes/{{ $env.environment }}/email_webhook_url
            spec:
              forProvider:
                type: String
                insecureValue: "https://REPLACE_ME/email"
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
            ---
            apiVersion: ssm.aws.upbound.io/v1beta1
            kind: Parameter
            metadata:
              annotations:
                crossplane.io/composition-resource-name: ssm-sms-webhook
                gotemplating.fn.crossplane.io/composition-resource-name: ssm-sms-webhook
                crossplane.io/external-name: /hermes/{{ $env.environment }}/sms_webhook_url
            spec:
              forProvider:
                type: String
                insecureValue: "https://REPLACE_ME/sms"
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
  writeConnectionSecretsToNamespace: crossplane-system
