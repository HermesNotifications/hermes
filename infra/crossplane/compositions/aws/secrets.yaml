apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: hermessecretsbundle-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: hermes.io/v1alpha1
    kind: HermesSecretsBundle
  mode: Pipeline
  pipeline:
    - step: pull-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: hermes-vpc-context

    - step: pull-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: Secret
              apiVersion: v1
              into: databaseSecret
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: hermes.io/claim-name
                    type: Value
                    value: hermes-database
            - kind: Secret
              apiVersion: v1
              into: cacheSecret
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: hermes.io/claim-name
                    type: Value
                    value: hermes-cache

    - step: render-templates
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $composite := $.observed.composite.resource }}
            {{ $env := index .context "apiextensions.crossplane.io/environment" }}
            {{ $uid := $composite.metadata.uid }}

            {{/* Read database connection details */}}
            {{ $dbSecretName := $composite.spec.databaseSecretRef }}
            {{ $cacheSecretName := $composite.spec.cacheSecretRef }}

            {{/* Generate random passwords for application secrets */}}
            ---
            apiVersion: random.crossplane.io/v1alpha1
            kind: Password
            metadata:
              annotations:
                crossplane.io/composition-resource-name: jwt-secret
                gotemplating.fn.crossplane.io/composition-resource-name: jwt-secret
            spec:
              forProvider:
                length: 32
                special: false
              writeConnectionSecretToRef:
                name: {{ $uid }}-jwt
                namespace: crossplane-system
            ---
            apiVersion: random.crossplane.io/v1alpha1
            kind: Password
            metadata:
              annotations:
                crossplane.io/composition-resource-name: centrifugo-token-secret
                gotemplating.fn.crossplane.io/composition-resource-name: centrifugo-token-secret
            spec:
              forProvider:
                length: 32
                special: false
              writeConnectionSecretToRef:
                name: {{ $uid }}-centrifugo-token
                namespace: crossplane-system
            ---
            apiVersion: random.crossplane.io/v1alpha1
            kind: Password
            metadata:
              annotations:
                crossplane.io/composition-resource-name: centrifugo-api-key
                gotemplating.fn.crossplane.io/composition-resource-name: centrifugo-api-key
            spec:
              forProvider:
                length: 32
                special: false
              writeConnectionSecretToRef:
                name: {{ $uid }}-centrifugo-api
                namespace: crossplane-system
            ---
            apiVersion: secretsmanager.aws.upbound.io/v1beta1
            kind: Secret
            metadata:
              annotations:
                crossplane.io/composition-resource-name: aws-secret
                gotemplating.fn.crossplane.io/composition-resource-name: aws-secret
            spec:
              forProvider:
                name: hermes/{{ $env.environment }}
                recoveryWindowInDays: {{ $composite.spec.recoveryWindowDays | default 0 }}
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
            ---
            apiVersion: ssm.aws.upbound.io/v1beta1
            kind: Parameter
            metadata:
              annotations:
                crossplane.io/composition-resource-name: ssm-email-webhook
                gotemplating.fn.crossplane.io/composition-resource-name: ssm-email-webhook
            spec:
              forProvider:
                name: /hermes/{{ $env.environment }}/email_webhook_url
                type: String
                value: "https://REPLACE_ME/email"
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
            ---
            apiVersion: ssm.aws.upbound.io/v1beta1
            kind: Parameter
            metadata:
              annotations:
                crossplane.io/composition-resource-name: ssm-sms-webhook
                gotemplating.fn.crossplane.io/composition-resource-name: ssm-sms-webhook
            spec:
              forProvider:
                name: /hermes/{{ $env.environment }}/sms_webhook_url
                type: String
                value: "https://REPLACE_ME/sms"
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane

    # Assemble connection details from the generated passwords and
    # the database/cache connection secrets into the composite's
    # connection secret. This is what services actually consume.
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: jwt-secret
            base:
              apiVersion: random.crossplane.io/v1alpha1
              kind: Password
            connectionDetails:
              - name: jwt_secret
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password
          - name: centrifugo-token-secret
            base:
              apiVersion: random.crossplane.io/v1alpha1
              kind: Password
            connectionDetails:
              - name: centrifugo_token_secret
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password
          - name: centrifugo-api-key
            base:
              apiVersion: random.crossplane.io/v1alpha1
              kind: Password
            connectionDetails:
              - name: centrifugo_api_key
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password
  writeConnectionSecretsToNamespace: crossplane-system
