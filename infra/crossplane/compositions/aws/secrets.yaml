apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: hermessecretsbundle-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: hermes.io/v1alpha1
    kind: HermesSecretsBundle
  mode: Pipeline
  pipeline:
    - step: pull-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: hermes-vpc-context

    - step: render-templates
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $composite := $.observed.composite.resource }}
            {{ $env := index .context "apiextensions.crossplane.io/environment" }}

            {{/*
              Finding 12. This composition previously created ONE secret, hermes/<env>,
              with no SecretVersion — so it was created empty and every remoteRef in
              deploy/k8s/overlays/*/external-secrets.yaml read a property nothing wrote.
              The composition satisfied its XRD, reconciled successfully, and delivered
              nothing.

              It is now split by OWNERSHIP, because a Secrets Manager secret has a single
              secretString and whoever writes it owns all of it. Mixing Crossplane-derived
              and operator-supplied values in one secret is the trap finding 28 describes
              for the database password: the guide tells you to update a value, and the
              next reconcile reverts it.

                hermes/<env>/connection  — Crossplane-owned. Derived from the Aurora and
                                           ElastiCache claims. Reconciled freely; never
                                           hand-edit it, the change will not survive.
                hermes/<env>/app         — Operator-owned. Crossplane creates the empty
                                           shell and never writes a version, so seeding
                                           it by hand is safe and permanent.
            */}}
            ---
            apiVersion: secretsmanager.aws.upbound.io/v1beta1
            kind: Secret
            metadata:
              annotations:
                crossplane.io/composition-resource-name: aws-secret-connection
                gotemplating.fn.crossplane.io/composition-resource-name: aws-secret-connection
            spec:
              forProvider:
                name: hermes/{{ $env.environment }}/connection
                recoveryWindowInDays: {{ $composite.spec.recoveryWindowDays | default 7 }}
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
                  hermes.io/ownership: crossplane
            ---
            {{/*
              Operator-owned. Deliberately has NO SecretVersion: Crossplane creates the
              container and never writes to it, so an operator-seeded value is not
              reverted on the next reconcile. See docs/deployment-guide.md for what goes
              in it — jwt_secret, api_key_hmac_secret, centrifugo_token_secret and
              centrifugo_api_key, none of which are derivable from infrastructure.
            */}}
            apiVersion: secretsmanager.aws.upbound.io/v1beta1
            kind: Secret
            metadata:
              annotations:
                crossplane.io/composition-resource-name: aws-secret-app
                gotemplating.fn.crossplane.io/composition-resource-name: aws-secret-app
            spec:
              forProvider:
                name: hermes/{{ $env.environment }}/app
                recoveryWindowInDays: {{ $composite.spec.recoveryWindowDays | default 7 }}
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
                  hermes.io/ownership: operator
            ---
            {{/*
              ADR 0005 phase 3/4. Operator-owned, and previously ABSENT entirely: the
              overlays' nats-nkeys ExternalSecret reads fourteen properties out of
              hermes/<env>/nats-nkeys, and nothing created even the container. The shell
              is created here for the same reason as /app — so the operator has somewhere
              to put the output of `go run ./cmd/natskeys -format json` — and, like /app,
              deliberately carries no SecretVersion so a seeded value is never reverted.
            */}}
            apiVersion: secretsmanager.aws.upbound.io/v1beta1
            kind: Secret
            metadata:
              annotations:
                crossplane.io/composition-resource-name: aws-secret-nats-nkeys
                gotemplating.fn.crossplane.io/composition-resource-name: aws-secret-nats-nkeys
            spec:
              forProvider:
                name: hermes/{{ $env.environment }}/nats-nkeys
                recoveryWindowInDays: {{ $composite.spec.recoveryWindowDays | default 7 }}
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
                  hermes.io/ownership: operator
            ---
            {{/*
              There was an email_webhook_url parameter here. It was dead config from a
              webhook email provider that never existed — no Go code has ever read it —
              and it is removed along with the ExternalSecret entry that consumed it.
              sms_webhook_url below is genuinely used; do not remove it by symmetry.
            */}}
            apiVersion: ssm.aws.upbound.io/v1beta1
            kind: Parameter
            metadata:
              annotations:
                crossplane.io/composition-resource-name: ssm-sms-webhook
                gotemplating.fn.crossplane.io/composition-resource-name: ssm-sms-webhook
                crossplane.io/external-name: /hermes/{{ $env.environment }}/sms_webhook_url
            spec:
              forProvider:
                type: String
                insecureValue: "https://REPLACE_ME/sms"
                region: {{ $env.region }}
                tags:
                  managed-by: crossplane
  # ---------------------------------------------------------------------------------
  # FINDING 12, AND THE PART OF IT THAT IS STILL OPEN. READ THIS BEFORE DEPLOYING.
  # ---------------------------------------------------------------------------------
  #
  # This composition creates three EMPTY Secrets Manager containers and two SSM
  # parameters. It writes NO VALUE into any of the three secrets, and it emits NO
  # connectionDetails, despite the XRD declaring seven connectionSecretKeys.
  #
  # Consequence, stated plainly because nothing else in this repository states it: on a
  # fresh environment every ExternalSecret in deploy/k8s/overlays/<env>/ fails to
  # resolve, the hermes-secrets Secret is never created, and every pod sits in
  # CreateContainerConfigError. The composition itself reports healthy throughout. That
  # combination — reconciles green, delivers nothing — is the actual defect in finding
  # 12, and it is why this comment is this long.
  #
  # THE MANUAL STEP THAT CLOSES IT
  #
  #   ./infra/scripts/seed-connection-secret.sh <env> <region>
  #
  # It derives database_url, redis_url, centrifugo_redis_address and
  # centrifugo_redis_password from the connection Secrets the Aurora and ElastiCache
  # claims write, and MERGES them into hermes/<env>/connection. It is idempotent, and
  # re-running it after a password rotation is the supported path.
  # infra/scripts/bootstrap-cluster.sh prints it as a required step at the end of a
  # bootstrap. The remaining values — hermes/<env>/app, hermes/<env>/nats-nkeys and
  # centrifugo_nats_url — are not derivable from infrastructure at all and are seeded by
  # hand; `go run ./cmd/natskeys -format json` produces the nkey set.
  #
  # WHY THIS IS NOT AUTOMATED HERE, GIVEN IT COULD BE
  #
  # The route exists and was checked against pinned upstream source rather than guessed
  # at, so the next person does not have to redo that work:
  #
  #   1. function-extra-resources v0.3.0 CAN fetch a core v1/Secret by name+namespace
  #      (Input kind under extra-resources.fn.crossplane.io/v1beta1, type: Reference,
  #      results land in context key "apiextensions.crossplane.io/extra-resources" as a
  #      LIST even for a single reference, with .data values still base64).
  #      Crossplane's own ClusterRole already grants secrets get/list/watch, so no extra
  #      RBAC is needed.
  #   2. function-go-templating v0.7.0 CAN set XR connection details from a template, by
  #      emitting kind CompositeConnectionDetails under
  #      meta.gotemplating.fn.crossplane.io/v1alpha1 with a top-level base64 `data` map.
  #   3. provider-aws-secretsmanager v1.18.0 SecretVersion has NO literal secretString
  #      field at all — only secretStringSecretRef{name,namespace,key}. So the password
  #      physically cannot be written into a managed-resource spec in etcd. That was the
  #      objection that blocked the obvious implementation, and it turns out not to apply.
  #
  # Three things stop it being done in this change, and each is a real blocker rather
  # than a preference:
  #
  #   a. It cannot be verified here. There is no cluster and no container runtime, so
  #      `crossplane render` cannot be run. Shipping unrendered pipeline YAML would
  #      reproduce exactly the failure mode above: green, and empty.
  #   b. bootstrap-cluster.sh installs Crossplane UNPINNED. On anything older than 1.20
  #      function-extra-resources v0.3.0 returns nothing AT ALL, silently. Pin the chart
  #      before relying on it.
  #   c. Once Crossplane owns hermes/<env>/connection it will revert hand-edits on the
  #      next reconcile — including centrifugo_nats_url, which it cannot derive. Splitting
  #      that secret, or teaching the composition to preserve foreign keys, has to be
  #      settled first.
  #
  # Also known, and cheap to get wrong: the assembled database_url MUST carry
  # sslmode=require and redis_url MUST use rediss:// (ADR 0005, enforced by
  # config.Validate), and both passwords must be percent-encoded before being placed in
  # URL userinfo. infra/scripts/lib.sh implements all three and infra/scripts/test-lib.sh
  # pins them.
  writeConnectionSecretsToNamespace: crossplane-system
