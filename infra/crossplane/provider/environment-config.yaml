# EnvironmentConfig providing VPC context to Crossplane compositions.
# Values are populated by the bootstrap script from Terraform outputs.
# This resource is NOT managed by ArgoCD — it contains cluster-specific
# values that come from Terraform outputs at bootstrap time.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: hermes-vpc-context
data:
  vpcId: "PLACEHOLDER"
  privateSubnetIdA: "PLACEHOLDER"
  privateSubnetIdB: "PLACEHOLDER"
  privateSubnetIdC: "PLACEHOLDER"
  nodeSecurityGroupId: "PLACEHOLDER"
  environment: "PLACEHOLDER"
  region: "PLACEHOLDER"
