apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: hermescaches.hermes.io
spec:
  group: hermes.io
  names:
    kind: HermesCache
    plural: hermescaches
  claimNames:
    kind: HermesCacheClaim
    plural: hermescacheclaims
  connectionSecretKeys:
    - endpoint
    - auth_token
    - port
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                engineVersion:
                  type: string
                  default: "7.2"
                  description: "Cache engine version (e.g., 7.2 for Valkey)."
                nodeType:
                  type: string
                  description: "Node type for cache instances (e.g., cache.r7g.large)."
                nodeCount:
                  type: integer
                  default: 1
                  minimum: 1
                  description: "Number of cache nodes. 2+ enables automatic failover."
                transitEncryption:
                  type: boolean
                  default: true
                  description: "Whether to encrypt data in transit (TLS)."
                snapshotRetentionDays:
                  type: integer
                  default: 1
                  minimum: 0
                  description: "Number of days to retain automatic snapshots. 0 disables."
                # Deliberately has no default. An absent field makes the composition's
                # patch a no-op (Crossplane skips an Optional fromFieldPath it cannot
                # resolve), so staging and production keep letting ElastiCache choose
                # and stay spread. Only an environment that names an AZ gets pinned.
                availabilityZone:
                  type: string
                  description: >-
                    Pin cache nodes to one AZ, to avoid cross-AZ transfer charges between
                    the EKS nodes and the cache. Omit for normal environments. When set it
                    MUST match the AZ the nodes are in — Terraform's
                    `workload_availability_zone` output. Wrong value costs more than no
                    value: the cache lands in an AZ nothing runs in and every read crosses.
              required:
                - nodeType
