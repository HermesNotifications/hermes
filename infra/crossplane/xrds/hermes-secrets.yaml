apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: hermessecretsbundles.hermes.io
spec:
  group: hermes.io
  names:
    kind: HermesSecretsBundle
    plural: hermessecretsbundles
  claimNames:
    kind: HermesSecretsBundleClaim
    plural: hermessecretsbundleclaims
  connectionSecretKeys:
    - database_url
    - redis_url
    - jwt_secret
    - centrifugo_token_secret
    - centrifugo_api_key
    - centrifugo_redis_address
    - centrifugo_redis_password
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                databaseSecretRef:
                  type: string
                  description: "Name of the K8s Secret containing database connection details."
                cacheSecretRef:
                  type: string
                  description: "Name of the K8s Secret containing cache connection details."
                recoveryWindowDays:
                  type: integer
                  # Finding 21. Defaulted to 0, meaning a deleted secret was destroyed
                  # immediately and unrecoverably. A default should be the safe choice a
                  # claim gets when its author has not thought about it, and 0 is the
                  # least recoverable value available. 7 gives a week to notice.
                  # Environments that genuinely want immediate deletion set 0 explicitly,
                  # as staging does.
                  default: 7
                  minimum: 0
                  description: "Days before a deleted secret is permanently removed. 0 means immediate and unrecoverable; 30 for production."
              required:
                - databaseSecretRef
                - cacheSecretRef
