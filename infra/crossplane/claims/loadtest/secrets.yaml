# Loadtest secrets bundle — assembles database and cache connection details
# with generated application secrets (JWT, Centrifugo).
#
# recoveryWindowDays 0 matches staging: a load-test environment gets torn down and stood
# back up, and Secrets Manager's recovery window blocks re-creating a secret of the same
# name until it expires. Zero means the delete is immediate and the next apply works.
apiVersion: hermes.io/v1alpha1
kind: HermesSecretsBundleClaim
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  databaseSecretRef: hermes-database-conn
  cacheSecretRef: hermes-cache-conn
  recoveryWindowDays: 0
  compositionRef:
    name: hermessecretsbundle-aws
  writeConnectionSecretToRef:
    name: hermes-secrets
