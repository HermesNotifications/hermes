# Production secrets bundle — 30-day recovery window on deletion.
apiVersion: hermes.io/v1alpha1
kind: HermesSecretsBundleClaim
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  databaseSecretRef: hermes-database-conn
  cacheSecretRef: hermes-cache-conn
  recoveryWindowDays: 30
  compositionRef:
    name: hermessecretsbundle-aws
  writeConnectionSecretToRef:
    name: hermes-secrets
