# Production Aurora PostgreSQL — 2 instances (writer + read replica),
# deletion protection enabled, 30-day backup retention.
apiVersion: hermes.io/v1alpha1
kind: HermesDatabaseClaim
metadata:
  name: hermes-database
  namespace: hermes
spec:
  engineVersion: "16.4"
  instanceClass: db.r7g.large
  instanceCount: 2
  backupRetentionDays: 30
  storageEncrypted: true
  deletionProtection: true
  compositionRef:
    name: hermesdatabase-aws
  writeConnectionSecretToRef:
    name: hermes-database-conn
