apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-collector-signoz
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: otel-collector-signoz
    creationPolicy: Owner
  data:
    - secretKey: SIGNOZ_OTLP_ENDPOINT
      remoteRef:
        key: hermes/production/signoz
        property: otlp-endpoint
    - secretKey: SIGNOZ_INGESTION_KEY
      remoteRef:
        key: hermes/production/signoz
        property: ingestion-key
