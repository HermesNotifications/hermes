apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
