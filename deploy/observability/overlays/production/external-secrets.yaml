apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-collector-dd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: otel-collector-dd
    creationPolicy: Owner
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: hermes/production/datadog
        property: api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-exporter-dsn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: postgres-exporter-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: hermes/production/postgres
        property: exporter-dsn
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: hermes/production/grafana
        property: admin-password
