apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - external-secrets.yaml
  - pdb.yaml

patches:
  - path: patches/otel-collector-dd-exporter.yaml
    target:
      kind: Deployment
      name: otel-collector-opentelemetry-collector
  - path: patches/grafana-admin.yaml
    target:
      kind: Deployment
      name: kube-prometheus-stack-grafana
