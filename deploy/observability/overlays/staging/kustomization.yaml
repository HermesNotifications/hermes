apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - external-secrets.yaml

patches:
  # Enable DD exporter in OTel Collector pipelines (parity during dual-emit).
  - path: patches/otel-collector-dd-exporter.yaml
    target:
      kind: Deployment
      name: otel-collector-opentelemetry-collector
