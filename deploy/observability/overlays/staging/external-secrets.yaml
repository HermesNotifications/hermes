# ExternalSecret pulls the Datadog API key from AWS Secrets Manager and projects it
# into a Kubernetes Secret that the OTel Collector reads via envFrom.
#
# Also pulls the Postgres DSN for postgres-exporter.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-collector-dd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: otel-collector-dd
    creationPolicy: Owner
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: hermes/staging/datadog
        property: api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-exporter-dsn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: postgres-exporter-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: hermes/staging/postgres
        property: exporter-dsn
