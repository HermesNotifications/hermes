apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
spec:
  template:
    spec:
      containers:
        - name: tempo
          resources:
            requests:
              cpu: 100m
              # 256Mi/512Mi OOMKilled tempo (exit 137) once traces actually flow —
              # the ingester WAL + in-memory blocks exceed it. Bump to give headroom
              # while staying modest for k3d.
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
