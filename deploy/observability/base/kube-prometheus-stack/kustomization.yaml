apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Requires `kustomize build --enable-helm` (ArgoCD must have `kustomize.buildOptions: --enable-helm`
# set in argocd-cm, and Kargo's rendering step must pass --enable-helm).
# See docs/observability/operations.md for details.

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 58.7.2
    releaseName: kube-prometheus-stack
    namespace: observability
    valuesFile: values.yaml
    includeCRDs: true
