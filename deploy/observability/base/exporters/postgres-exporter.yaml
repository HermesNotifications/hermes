# postgres_exporter — reads pg_stat_* views and exposes Prometheus metrics.
#
# Connection string comes from a Secret named `postgres-exporter-dsn`.
#   - local overlay creates it inline from the dev DB URL
#   - staging/production use ExternalSecret → AWS Secrets Manager

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  labels:
    app.kubernetes.io/name: postgres-exporter
data:
  # Custom queries on top of the built-in collectors. These exist because the write path's
  # central open question -- "is the storage the bottleneck?" -- was answerable only by
  # shelling into the pod and running pg_test_fsync, which is a single-threaded synthetic
  # tool. It reported 1,933 fsync/s at 517µs, and that number was then read as a throughput
  # ceiling for months. It is not: it is the reciprocal of the latency, measured with no
  # concurrency, and the pipeline was later measured at 7,907 msg/s over it.
  #
  # pg_stat_wal gives the same measurement continuously, under real concurrent load, where
  # the difference is visible.
  # Every query is namespaced `hermes_*` rather than `pg_stat_*`. postgres_exporter ships
  # built-in collectors under the `pg_` prefix and enables more of them with each release, so
  # an unprefixed custom query is a name collision waiting for an upgrade to happen.
  queries.yaml: |
    hermes_wal:
      query: |
        SELECT
          wal_records,
          wal_fpi,
          wal_bytes,
          wal_buffers_full,
          wal_write,
          wal_sync,
          wal_write_time,
          wal_sync_time
        FROM pg_stat_wal
      master: true
      metrics:
        - wal_records:
            usage: "COUNTER"
            description: "WAL records generated"
        # wal_fpi / wal_records is the full-page-image ratio. A high ratio means checkpoints
        # are frequent enough that most commits are carrying whole 8KiB pages into WAL --
        # which is WAL bytes per flush, on storage where bytes are the expensive part. That
        # is a max_wal_size / checkpoint_timeout problem, not a disk problem, and the two
        # are indistinguishable without this number.
        - wal_fpi:
            usage: "COUNTER"
            description: "Full page images written to WAL"
        - wal_bytes:
            usage: "COUNTER"
            description: "Bytes written to WAL"
        - wal_buffers_full:
            usage: "COUNTER"
            description: "Times WAL buffers filled and forced a write"
        - wal_write:
            usage: "COUNTER"
            description: "WAL buffer writes to disk"
        # rate(wal_sync_time) / rate(wal_sync) is mean fsync latency as a live series -- the
        # 517µs figure, continuously, under whatever concurrency is actually running.
        # Requires track_wal_io_timing = on; without it both time columns stay at zero and
        # the ratio is 0/0, which is the signal that the setting is off rather than that the
        # disk is fast.
        - wal_sync:
            usage: "COUNTER"
            description: "WAL fsyncs issued"
        - wal_write_time:
            usage: "COUNTER"
            description: "Milliseconds spent writing WAL"
        - wal_sync_time:
            usage: "COUNTER"
            description: "Milliseconds spent syncing WAL"

    # What backends are blocked on, which is the direct answer to "is it the disk". A
    # dispatch pool waiting on WALSync is commit-bound; the same pool waiting on
    # DataFileRead or a Lock is not, and the fix is entirely different. Bounded cardinality:
    # wait_event_type and wait_event are both closed enumerations in Postgres.
    hermes_activity_waiting:
      query: |
        SELECT
          COALESCE(wait_event_type, 'none') AS wait_event_type,
          COALESCE(wait_event, 'none')      AS wait_event,
          count(*)                          AS backends
        FROM pg_stat_activity
        WHERE backend_type = 'client backend'
        GROUP BY 1, 2
      master: true
      metrics:
        - wait_event_type:
            usage: "LABEL"
            description: "Class of thing the backend is waiting on"
        - wait_event:
            usage: "LABEL"
            description: "Specific wait event"
        - backends:
            usage: "GAUGE"
            description: "Client backends in this wait state"

    # Checkpoint cause matters: a checkpoint forced by max_wal_size ('req') rather than by
    # checkpoint_timeout ('timed') means WAL is filling faster than the interval, and that is
    # what drives the full-page-image ratio above. buffers_backend_fsync is the sharper
    # signal -- a backend fsyncing on its own behalf means the checkpointer could not keep up,
    # and it lands directly in commit latency.
    #
    # pg_stat_bgwriter, not pg_stat_checkpointer: the bundled server is Postgres 16
    # (postgresql.image.tag "16-alpine"), and the checkpointer view was split out in 17.
    hermes_checkpoint:
      query: |
        SELECT
          checkpoints_timed,
          checkpoints_req,
          checkpoint_write_time,
          checkpoint_sync_time,
          buffers_backend_fsync
        FROM pg_stat_bgwriter
      master: true
      metrics:
        - checkpoints_timed:
            usage: "COUNTER"
            description: "Scheduled checkpoints"
        - checkpoints_req:
            usage: "COUNTER"
            description: "Checkpoints forced by max_wal_size"
        - checkpoint_write_time:
            usage: "COUNTER"
            description: "Milliseconds spent writing checkpoint files"
        - checkpoint_sync_time:
            usage: "COUNTER"
            description: "Milliseconds spent syncing checkpoint files"
        - buffers_backend_fsync:
            usage: "COUNTER"
            description: "Times a backend had to fsync a block itself"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-dsn
                  key: dsn
            # Adds the queries in the ConfigMap alongside the built-in collectors rather than
            # replacing them.
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres-exporter/queries.yaml
          ports:
            - name: metrics
              containerPort: 9187
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-queries
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics
      interval: 30s
