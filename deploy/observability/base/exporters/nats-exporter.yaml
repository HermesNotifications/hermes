# Prometheus NATS exporter — scrapes NATS /varz, /connz, /jsz, /subsz from the NATS
# monitoring port (8222) and exposes Prometheus metrics.
#
# NATS lives in the `hermes` namespace (see deploy/k8s/base/infra/nats.yaml).
# This exporter sits in the `observability` namespace and scrapes cross-namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-exporter
  labels:
    app.kubernetes.io/name: nats-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-exporter
    spec:
      containers:
        - name: exporter
          image: natsio/prometheus-nats-exporter:0.15.0
          args:
            - "-port=7777"
            - "-varz"
            - "-jsz=all"
            - "-connz"
            - "-subz"
            - "http://nats.hermes.svc:8222"
          ports:
            - name: metrics
              containerPort: 7777
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats-exporter
  labels:
    app.kubernetes.io/name: nats-exporter
spec:
  selector:
    app.kubernetes.io/name: nats-exporter
  ports:
    - name: metrics
      port: 7777
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nats-exporter
  labels:
    app.kubernetes.io/name: nats-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-exporter
  endpoints:
    - port: metrics
      interval: 30s
