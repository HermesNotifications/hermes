apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-router
  namespace: hermes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes-router
  template:
    metadata:
      labels:
        app: hermes-router
    spec:
      containers:
        - name: router
          image: hermes-router:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-router
  namespace: hermes
spec:
  selector:
    app: hermes-router
  ports:
    - port: 8081
      targetPort: 8081
