apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Per-IP shielding, which the in-process limiter structurally cannot provide:
    # it runs *after* authentication, so an unauthenticated flood is rejected by
    # APIKeyMiddleware — after an HMAC and a Redis lookup per request — and never
    # reaches a bucket. This bounds that work per source address.
    #
    # The rate is deliberately set at send's per-credential sustained ceiling
    # (2000/s) rather than below it. nginx cannot tell an authenticated request
    # from an unauthenticated one, so anything lower would make the documented
    # per-credential limit unreachable for a legitimate caller behind a single
    # egress IP and would contradict our own API contract. This is a flood
    # bound, not a quota — the quota is the app's job.
    #
    # Like the app limiter, this is per nginx replica, so the effective ceiling
    # scales with the ingress controller's replica count.
    nginx.ingress.kubernetes.io/limit-rps: "2000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "500"
    # Both default to 503, which tells a client the service is broken when in
    # fact it was told to slow down. 429 is the honest answer and is what the
    # app limiter returns, so a caller sees one status for one condition.
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    nginx.ingress.kubernetes.io/limit-conn-status-code: "429"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/send
            pathType: Prefix
            backend:
              service:
                name: hermes-send
                port:
                  number: 8088
          # /v1/types and /v1/groups used to live here. They were removed when the
          # group/type rename landed: no Go handler has served either since, so the rules
          # only turned an ingress-level 404 into a service-level one. The replacements
          # are /v1/subscriptions/categories and /v1/subscriptions.
          - path: /v1/notifications
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/organizations
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/templates
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/apikeys
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/subscriptions
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/inbox
            pathType: Prefix
            backend:
              service:
                name: hermes-inbox
                port:
                  number: 8086
          # Longest-prefix match: /v1/users/me (self-service, JWT) beats /v1/users (admin listing, API key)
          - path: /v1/users/me
            pathType: Prefix
            backend:
              service:
                name: hermes-user
                port:
                  number: 8087
          - path: /v1/users
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-realtime-ingress
  namespace: hermes
  annotations:
    # No limit-connections here, deliberately. These are long-lived WebSockets:
    # one browser tab holds one connection open for its whole session, so a
    # per-IP connection cap counts concurrent *users* behind a shared egress
    # address, not abuse. An office or campus NAT would hit it during normal
    # use. Per-IP request limits are on hermes-ingress, where requests are
    # short-lived and the count means what it looks like it means.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Load-bearing for the http_stream and sse fallback transports, and pinned rather than
    # left to the default for the same reason use-regex is spelled out above: its absence is
    # silent. Both rungs are a single response the server never finishes writing. With
    # buffering on, nginx holds each publication waiting for a complete response that is not
    # coming, so the socket connects, the widget reports itself healthy, and notifications
    # simply arrive late or not at all. ingress-nginx happens to default this to "off", so
    # today it works by luck — a cluster-wide ConfigMap turning buffering on would break
    # realtime with nothing in any log to say why.
    #
    # Websockets are unaffected either way: they are not a proxied HTTP response body.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Matches /realtime/connection/websocket, /connection/http_stream, /connection/sse
          # and /emulation alike — the ladder needs no route of its own.
          - path: /realtime(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000
