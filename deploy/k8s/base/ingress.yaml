apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/send
            pathType: Prefix
            backend:
              service:
                name: hermes-send
                port:
                  number: 8088
          - path: /v1/types
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/groups
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/notifications
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/tenants
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/templates
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/apikeys
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/subscriptions
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
          - path: /v1/inbox
            pathType: Prefix
            backend:
              service:
                name: hermes-inbox
                port:
                  number: 8086
          # Longest-prefix match: /v1/users/me (self-service, JWT) beats /v1/users (admin listing, API key)
          - path: /v1/users/me
            pathType: Prefix
            backend:
              service:
                name: hermes-user
                port:
                  number: 8087
          - path: /v1/users
            pathType: Prefix
            backend:
              service:
                name: hermes-admin
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-realtime-ingress
  namespace: hermes
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /realtime(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000
