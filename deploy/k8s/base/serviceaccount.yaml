apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
# Finding 21. No Hermes service talks to the Kubernetes API, so mounting a token into
# every pod hands an attacker with code execution a cluster credential for nothing in
# return. Setting it here covers every pod using this ServiceAccount; a workload that
# genuinely needs API access should opt back in on its own pod spec rather than have
# this default loosened.
automountServiceAccountToken: false
