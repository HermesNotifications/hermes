# NATS server configuration — ADR 0005 phase 2.
#
# This file replaces the command-line flags the StatefulSet used to pass. Flags cannot
# express a `tls` block, which is the whole reason the server now reads a configuration
# file: with no `tls` block NATS advertises tls_required:false and accepts plaintext
# clients, and anyone with network reach can subscribe to delivery.* and read every
# recipient address in flight.
#
# The certificates are issued by the private cert-manager CA in nats-certificates.yaml.
# The public Let's Encrypt ClusterIssuer cannot sign for nats.hermes.svc.

port: 4222

# ADR 0005 phase 3. Accounts, users and per-service subject permissions. Kept in its own
# file because staging replaces this one wholesale (it runs a single node and cannot use the
# cluster block below) and the authorisation model must not fork with it — both
# configurations include the same accounts.conf, which arrives as a second key of the same
# generated Secret.
include "accounts.conf"

# Monitoring is served over TLS with the same certificate. The probes use
# `scheme: HTTPS`, which kubelet does not certificate-verify — that is fine here, the
# point is that /varz (which lists subjects, cluster peers and connection details) is
# not readable in the clear by anything that can reach the pod.
https: 8222

jetstream {
  store_dir: /data
}

# Client connections. Declaring `tls` makes TLS mandatory, not merely available: the
# server's INFO carries tls_required:true and a client that will not upgrade gets no
# response to its CONNECT. `verify` is deliberately absent — client certificates are not
# how services will authenticate. ADR 0005 phase 3 does that with NKey accounts, which
# also carry the per-subject permissions mTLS alone cannot express.
tls {
  cert_file: "/etc/nats-certs/tls.crt"
  key_file:  "/etc/nats-certs/tls.key"
  ca_file:   "/etc/nats-certs/ca.crt"
  timeout: 5
}

cluster {
  name: hermes-nats
  port: 6222
  routes = [
    nats://nats-0.nats:6222
    nats://nats-1.nats:6222
    nats://nats-2.nats:6222
  ]
  # Route TLS is mutual in NATS regardless of `verify`: each side presents this
  # certificate and validates the peer against ca_file. The wildcard SANs on the
  # certificate are what make the per-pod route hostnames (nats-0.nats, …) verify.
  tls {
    cert_file: "/etc/nats-certs/tls.crt"
    key_file:  "/etc/nats-certs/tls.key"
    ca_file:   "/etc/nats-certs/ca.crt"
    timeout: 5
  }
}
