# NATS accounts and per-service subject permissions — ADR 0005 phase 3.
#
# Phase 2 encrypted the bus and authorised nothing: any client holding the CA could still
# publish notification.send to forge notifications, or read every recipient address and
# rendered body out of delivery.*. This file is where that stops. Each service gets its own
# NKey user, scoped to the subjects it actually uses.
#
# ---------------------------------------------------------------------------------------
# The subject lists below are NOT a guess. They are the exact protocol a service emits,
# read off a nats-server trace of internal/messaging driving a real JetStream server:
#
#   publish to a stream subject   PUB <subject>            (+ reply on the client's inbox)
#   SetupStreams                  PUB $JS.API.STREAM.UPDATE.<S> then ….CREATE.<S>
#                                 — CreateOrUpdateStream tries UPDATE first and falls back
#                                   to CREATE on "stream not found", so both are required
#   Subscribe (pull consumer)     PUB $JS.API.CONSUMER.CREATE.<S>.<consumer>.<filter…>
#                                 PUB $JS.API.CONSUMER.MSG.NEXT.<S>.<consumer>
#   ack / nak / term              PUB $JS.ACK.<S>.<consumer>.…
#   every request's reply         SUB _INBOX.<service>.>
#
# Two consequences that are easy to get wrong:
#
#   * A pull consumer needs NO core `subscribe` permission on the stream subject. Messages
#     arrive on the client's own inbox, not on delivery.email. So nothing here grants
#     subscribe on a pipeline subject, and nothing needs to.
#   * Which makes the inbox the real boundary. `subscribe: _INBOX.>` would let any service
#     receive copies of every other service's pulled messages — delivery.email payloads to
#     a client with no permission on delivery.email at all. internal/messaging.WithIdentity
#     confines each connection to _INBOX.<service>, and that is what these narrow
#     subscribe lists depend on. Change one without the other and the scheme breaks.
#
# ---------------------------------------------------------------------------------------
# The nkey values are $VARIABLES resolved from the nats-server process environment, so the
# permissions are reviewable in git while the identities stay per-environment: the public
# keys arrive as env vars from the nats-nkeys Secret, the matching seeds reach each service
# pod from the same Secret. An unset variable is a parse error, so a half-provisioned
# cluster fails to start rather than starting without the account.
#
# Generate a matched set with:  go run ./cmd/natskeys
#
# NOTE ON DELIBERATE OVER-GRANT: every service calls SetupStreams at boot, so every user
# below can create or update all four streams. That is more than least privilege wants —
# see the ADR 0005 amendment. Deletion and purge are NOT granted, so the residual is
# stream-config tampering, not reading or forging traffic.

accounts {
  HERMES: {
    jetstream: enabled
    users: [
      # -------------------------------------------------------------------------------
      # send — the ingestion layer. Publishes notification.send and nothing else. It has
      # no consumer of its own, so it also has no dlq.* right: internal/messaging only
      # dead-letters on behalf of a subscriber.
      {
        nkey: $HERMES_NKEY_SEND
        permissions: {
          publish: {
            allow: [
              "notification.send"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-send.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # dispatch — consumes notification.send, fans out to delivery.*, emits events.
      #
      # Deliberately absent: publish on notification.send (dispatch must not be able to
      # forge an ingestion) and any consumer right on DELIVERY (it must not be able to
      # read back the rendered bodies it fanned out).
      {
        nkey: $HERMES_NKEY_DISPATCH
        permissions: {
          publish: {
            allow: [
              "delivery.email"
              "delivery.sms"
              "delivery.inbox"
              "notification.events"
              "dlq.notification.send"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.CONSUMER.CREATE.NOTIFICATIONS.dispatch.>"
              "$JS.API.CONSUMER.MSG.NEXT.NOTIFICATIONS.dispatch"
              "$JS.ACK.NOTIFICATIONS.dispatch.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-dispatch.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-email — consumes delivery.email as the `worker-email` consumer, reports
      # outcomes as events, dead-letters its own subject.
      #
      # Deliberately absent: publish on any delivery.* subject (a delivery worker must not
      # be able to inject deliveries) and any consumer right on delivery.sms or
      # delivery.inbox (one channel's worker must not read another channel's recipients).
      {
        nkey: $HERMES_NKEY_WORKER_EMAIL
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.email"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-email.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-email"
              "$JS.ACK.DELIVERY.worker-email.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-email.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-sms — same shape, delivery.sms only.
      {
        nkey: $HERMES_NKEY_WORKER_SMS
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.sms"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-sms.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-sms"
              "$JS.ACK.DELIVERY.worker-sms.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-sms.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-inbox — same shape, delivery.inbox only. It pushes to Centrifugo over
      # HTTP, not NATS, so it needs nothing extra here.
      {
        nkey: $HERMES_NKEY_WORKER_INBOX
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.inbox"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-inbox.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-inbox"
              "$JS.ACK.DELIVERY.worker-inbox.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-inbox.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-events — the event writer. The one service that consumes and never
      # publishes to a pipeline subject: it batches notification.events into the store.
      # Its JetStream consumer is named `event-writer` while its deployment is
      # hermes-worker-events, so the two names differ on purpose below.
      #
      # Deliberately absent: publish on notification.events. A component that only reads
      # events must not be able to manufacture them, which is what would let it drive a
      # notification's status rollup.
      {
        nkey: $HERMES_NKEY_WORKER_EVENTS
        permissions: {
          publish: {
            allow: [
              "dlq.notification.events"
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.CONSUMER.CREATE.EVENTS.event-writer.>"
              "$JS.API.CONSUMER.MSG.NEXT.EVENTS.event-writer"
              "$JS.ACK.EVENTS.event-writer.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-events.>"] }
        }
      }
    ]
  }
}
