# NATS accounts and per-service subject permissions — ADR 0005 phase 3.
#
# Phase 2 encrypted the bus and authorised nothing: any client holding the CA could still
# publish notification.send to forge notifications, or read every recipient address and
# rendered body out of delivery.*. This file is where that stops. Each service gets its own
# NKey user, scoped to the subjects it actually uses.
#
# ---------------------------------------------------------------------------------------
# The subject lists below are NOT a guess. They are the exact protocol a service emits,
# read off a nats-server trace of internal/messaging driving a real JetStream server:
#
#   publish to a stream subject   PUB <subject>            (+ reply on the client's inbox)
#   SetupStreams                  PUB $JS.API.STREAM.UPDATE.<S> then ….CREATE.<S>
#                                 — CreateOrUpdateStream tries UPDATE first and falls back
#                                   to CREATE on "stream not found", so both are required
#   Subscribe (pull consumer)     PUB $JS.API.CONSUMER.CREATE.<S>.<consumer>.<filter…>
#                                 PUB $JS.API.CONSUMER.MSG.NEXT.<S>.<consumer>
#                                 PUB $JS.API.CONSUMER.INFO.<S>.<consumer>
#                                 — the stall monitor's poll (internal/messaging/stall.go), on
#                                   its OWN consumer only. Read-only, no payload, and the
#                                   narrowest grant that can answer "is work waiting for me".
#                                   Without it a service still runs: an unanswerable poll is
#                                   treated as no evidence, so stall detection switches itself
#                                   off silently. It logs a warning when that happens.
#   ack / nak / term              PUB $JS.ACK.<S>.<consumer>.…
#   every request's reply         SUB _INBOX.<service>.>
#
# Two consequences that are easy to get wrong:
#
#   * A pull consumer needs NO core `subscribe` permission on the stream subject. Messages
#     arrive on the client's own inbox, not on delivery.email. So nothing here grants
#     subscribe on a pipeline subject, and nothing needs to.
#   * Which makes the inbox the real boundary. `subscribe: _INBOX.>` would let any service
#     receive copies of every other service's pulled messages — delivery.email payloads to
#     a client with no permission on delivery.email at all. internal/messaging.WithIdentity
#     confines each connection to _INBOX.<service>, and that is what these narrow
#     subscribe lists depend on. Change one without the other and the scheme breaks.
#
# ---------------------------------------------------------------------------------------
# The nkey values are $VARIABLES resolved from the nats-server process environment, so the
# permissions are reviewable in git while the identities stay per-environment: the public
# keys arrive as env vars from the nats-nkeys Secret, the matching seeds reach each service
# pod from the same Secret.
#
# An UNSET variable is a parse error, so a cluster missing the Secret entirely fails to
# start rather than starting without the account. An EMPTY one is not, and this file used
# to claim otherwise — the previous wording here said a half-provisioned cluster fails to
# start, full stop, which is true for unset and false for empty. The difference is not
# academic: `HERMES_CENTRIFUGO_NATS_PASSWORD=""` parses cleanly, the server starts, the
# centrifugo user exists with an empty password, and a client connecting as `centrifugo`
# with no credential at all is ACCEPTED — verified on the wire against an embedded server,
# not inferred (internal/messaging, finding 53 — filed as 39, renumbered 2026-08-05 because
# that number was already the rate-limiter finding). So a half-provisioned cluster can come up
# looking healthy while accepting an unauthenticated Centrifugo connection.
#
# The conf language cannot express "must be non-empty", so this is not closed HERE — it is
# closed by an initContainer on the StatefulSet in ../nats.yaml, which runs before nats-server
# and fails the pod. See the note above the centrifugo user below for why that is the only
# place it can work.
#
# Generate a matched set with:  go run ./cmd/natskeys
#
# ---------------------------------------------------------------------------------------
# ADR 0005 phase 4 closed phase 3's named over-grant. Phase 3 gave every service
# STREAM.CREATE and STREAM.UPDATE on all four streams, because every service called
# SetupStreams at boot — so any compromised worker could rewrite the configuration of a
# stream it never touched (MaxAge down to a second discards everything in flight; removing
# a subject makes publishes to it fail).
#
# Now exactly one user holds those rights — `provisioner`, used only by cmd/natsprovision,
# which runs as a Job and exits. Services hold STREAM.INFO on the streams they actually
# depend on, which is what messaging.EnsureStreams reads to refuse to start against a bus
# that has not been provisioned. The startup guarantee phase 3 wanted to keep is therefore
# kept; what is given up is self-healing, and streams are provisioned the same way the
# database schema already is.
#
# STREAM.DELETE, STREAM.PURGE, CONSUMER.DELETE, DIRECT.GET, STREAM.MSG.GET, STREAM.LIST and
# $JS.API.INFO are granted to NOBODY, provisioner included.

accounts {
  HERMES: {
    jetstream: enabled
    users: [
      # -------------------------------------------------------------------------------
      # send — the ingestion layer. Publishes notification.send and nothing else. It has
      # no consumer of its own, so it also has no dlq.* right: internal/messaging only
      # dead-letters on behalf of a subscriber.
      {
        nkey: $HERMES_NKEY_SEND
        permissions: {
          publish: {
            allow: [
              "notification.send"
              # ADR 0005 phase 4. Read-only, and only the one stream send depends on:
              # messaging.EnsureStreams uses it to refuse to start before provisioning.
              "$JS.API.STREAM.INFO.NOTIFICATIONS"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-send.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # provisioner — ADR 0005 phase 4. cmd/natsprovision, run as a Job, and the ONLY
      # identity on this bus that can create or update a stream.
      #
      # It is deliberately not a service and holds nothing else: no pipeline subject, no
      # consumer, no dlq. It cannot publish notification.send or read delivery.*, so a
      # leaked provisioner seed buys stream configuration and nothing else — and still not
      # deletion or purge, which nobody has.
      {
        nkey: $HERMES_NKEY_PROVISION
        permissions: {
          publish: {
            allow: [
              "$JS.API.STREAM.CREATE.NOTIFICATIONS"
              "$JS.API.STREAM.UPDATE.NOTIFICATIONS"
              "$JS.API.STREAM.INFO.NOTIFICATIONS"
              "$JS.API.STREAM.CREATE.DELIVERY"
              "$JS.API.STREAM.UPDATE.DELIVERY"
              "$JS.API.STREAM.INFO.DELIVERY"
              "$JS.API.STREAM.CREATE.EVENTS"
              "$JS.API.STREAM.UPDATE.EVENTS"
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.CREATE.DLQ"
              "$JS.API.STREAM.UPDATE.DLQ"
              "$JS.API.STREAM.INFO.DLQ"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-natsprovision.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # dispatch — consumes notification.send, fans out to delivery.*, emits events.
      #
      # Deliberately absent: publish on notification.send (dispatch must not be able to
      # forge an ingestion) and any consumer right on DELIVERY (it must not be able to
      # read back the rendered bodies it fanned out).
      {
        nkey: $HERMES_NKEY_DISPATCH
        permissions: {
          publish: {
            allow: [
              "delivery.email"
              "delivery.sms"
              "delivery.inbox"
              "notification.events"
              "dlq.notification.send"
              # ADR 0005 phase 4. Read-only, and only the four streams dispatch touches.
              "$JS.API.STREAM.INFO.NOTIFICATIONS"
              "$JS.API.STREAM.INFO.DELIVERY"
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.INFO.DLQ"
              "$JS.API.CONSUMER.CREATE.NOTIFICATIONS.dispatch.>"
              "$JS.API.CONSUMER.MSG.NEXT.NOTIFICATIONS.dispatch"
              "$JS.API.CONSUMER.INFO.NOTIFICATIONS.dispatch"
              "$JS.ACK.NOTIFICATIONS.dispatch.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-dispatch.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-email — consumes delivery.email as the `worker-email` consumer, reports
      # outcomes as events, dead-letters its own subject.
      #
      # Deliberately absent: publish on any delivery.* subject (a delivery worker must not
      # be able to inject deliveries) and any consumer right on delivery.sms or
      # delivery.inbox (one channel's worker must not read another channel's recipients).
      {
        nkey: $HERMES_NKEY_WORKER_EMAIL
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.email"
              # ADR 0005 phase 4. Read-only, and only the streams this worker touches.
              "$JS.API.STREAM.INFO.DELIVERY"
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.INFO.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-email.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-email"
              "$JS.API.CONSUMER.INFO.DELIVERY.worker-email"
              "$JS.ACK.DELIVERY.worker-email.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-email.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-sms — same shape, delivery.sms only.
      {
        nkey: $HERMES_NKEY_WORKER_SMS
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.sms"
              # ADR 0005 phase 4. Read-only, and only the streams this worker touches.
              "$JS.API.STREAM.INFO.DELIVERY"
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.INFO.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-sms.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-sms"
              "$JS.API.CONSUMER.INFO.DELIVERY.worker-sms"
              "$JS.ACK.DELIVERY.worker-sms.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-sms.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-inbox — same shape, delivery.inbox only. It pushes to Centrifugo over
      # HTTP, not NATS, so it needs nothing extra here.
      {
        nkey: $HERMES_NKEY_WORKER_INBOX
        permissions: {
          publish: {
            allow: [
              "notification.events"
              "dlq.delivery.inbox"
              # ADR 0005 phase 4. Read-only, and only the streams this worker touches.
              "$JS.API.STREAM.INFO.DELIVERY"
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.INFO.DLQ"
              "$JS.API.CONSUMER.CREATE.DELIVERY.worker-inbox.>"
              "$JS.API.CONSUMER.MSG.NEXT.DELIVERY.worker-inbox"
              "$JS.API.CONSUMER.INFO.DELIVERY.worker-inbox"
              "$JS.ACK.DELIVERY.worker-inbox.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-inbox.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # centrifugo — ADR 0005 phase 4. The only password user on this bus, and the only
      # one that is not a Hermes service.
      #
      # Why a password and not an NKey: centrifugo:v5 (5.4.9) exposes no NKey option in any
      # form — no flag, no config key, no environment variable. Verified by reading the
      # binary's registered configuration keys and its full --help. The credential can only
      # travel in nats_url's userinfo, so it is a password. NATS accounts take password and
      # NKey users side by side, so this costs the other six users nothing.
      #
      # The subject space is Centrifugo's own and disjoint from the pipeline's: no user here
      # can publish or subscribe notification.*/delivery.*, and centrifugo can touch nothing
      # else. The three subjects it uses were read off a nats-server trace of a real
      # two-node fan-out, and all three are needed in BOTH directions:
      #
      #   centrifugo.control              node presence and survey (pub + sub)
      #   centrifugo.node.<nodeID>        per-node replies — a node publishes to ANOTHER
      #                                   node's subject, so publish is required too
      #   centrifugo.client.<channel>     the publications themselves (pub + sub)
      #
      # Granted as the prefix rather than the three patterns on purpose. Spelling them out
      # would restrict nothing — all three are needed both ways — while adding a trap: a
      # subject added by a future Centrifugo version fails SILENTLY. Observed, with the
      # subscribe grant removed: the server logs `Permissions Violation for Subscription`,
      # Centrifugo logs it too, and the client stays connected and simply never receives a
      # publication. There is no error surfaced to the subscriber.
      #
      # -------------------------------------------------------------------------------
      # DO NOT QUOTE the password reference below, however wrong that looks.
      #
      # nats-server only treats an UNQUOTED token as a variable (conf/lex.go isVariable, which
      # is reachable from lexString alone). `password: "$HERMES_CENTRIFUGO_NATS_PASSWORD"`
      # therefore does not escape the value — it stops the lookup happening at all and sets
      # Centrifugo's password to that literal 32-character string, with no parse error and no
      # log line. The bus would come up with a credential this file publishes to anyone who can
      # read the repository. Observed, both spellings; see
      # internal/messaging/centrifugopassword_test.go.
      #
      # Quoting could not help in any case. A variable reference is resolved by RE-PARSING the
      # environment value as its own document (conf/parse.go lookupVariable feeds it back
      # through the lexer as `pk=<value>`), so it is the VALUE that must lex as a bare conf
      # value — a constraint the reference site cannot express. Values that do not lex:
      #
      #   -Xyz…          a leading '-' starts a negative number and demands a digit next
      #   12-Xyz…        a leading digit starts a number, and a later '-' makes it an ISO8601
      #                  date that almost nothing satisfies
      #   2p2Xyz…        a size suffix (kKmMgGtTpPeE) followed by a digit ends the number
      #                  early, leaving the rest as trailing junk
      #   1234567890     all digits, or exactly "true"/"false": no parse error at all, the
      #                  value reaches the server as an int64 or a bool instead of a string
      #
      # About 2.3% of unconstrained 43-character base64url draws hit one of these, which is
      # why this looked like an intermittent test failure rather than a bug. cmd/natskeys now
      # guarantees the one shape that is always safe — the first character is an ASCII letter,
      # which sends the lexer straight to its string state — and the failing shapes are pinned
      # against this file by centrifugopassword_test.go so neither half can drift.
      #
      # The $HERMES_NKEY_* references above are resolved the same way and are exposed to the
      # same rule. They are safe because an nkeys user public key is 'U' followed by base32
      # [A-Z2-7]: always a leading letter, never a '-'. That is a property of nkeys, not
      # something this file arranged, so it is asserted rather than assumed —
      # TestAccounts_NKeyVariablesCannotHitTheFailingShapes.
      #
      # The gap this file cannot close, and where it IS closed (finding 53).
      #
      # An UNSET variable is a parse error, but an EMPTY one is not.
      # HERMES_CENTRIFUGO_NATS_PASSWORD="" starts the server and lets anyone connect as this
      # user with no credential. The conf language cannot require non-emptiness, so the
      # guarantee the header above promises — a half-provisioned cluster failing to START —
      # has to be delivered somewhere that runs BEFORE nats-server.
      #
      # It is: `require-centrifugo-password`, an initContainer on the StatefulSet in
      # ../nats.yaml. It rejects an empty or unset value, a first character that is not an
      # ASCII letter, and `true`/`false` — the two values a leading letter does not save,
      # because they lex as a conf boolean and reach the server as the wrong type. The local
      # overlay deletes that container by name (../../overlays/local/patches/nats-local.yaml):
      # it drops `-c nats.conf`, never reads this file, and legitimately has no password.
      # scripts/check_nats_password_guard.py fails the build if a render that DOES read this
      # file loses the guard.
      #
      # Two other candidates were evaluated and rejected, and the reasoning is kept because it
      # is the argument for why the initContainer is the only place this works:
      #   * internal/config — no Hermes Go process reads this variable at all. nats-server
      #     consumes it directly from its own environment (../nats.yaml). A check there would
      #     sit in a process that never sees the value and would pass forever.
      #   * cmd/natsprovision — it runs as a Job on every deploy and already fails the sync,
      #     but it would have to open a second connection deliberately impersonating
      #     `centrifugo` with an empty credential. That emits an authorization-violation event
      #     on every single deploy, permanently degrading the one signal that would show a real
      #     intrusion; a rejection is also weak evidence, being indistinguishable from a server
      #     not yet ready, a TLS failure, or the account being absent entirely; and it races
      #     NATS startup inside a backoffLimit budget that ADR 0006's amendment measured.
      {
        user: centrifugo
        password: $HERMES_CENTRIFUGO_NATS_PASSWORD
        permissions: {
          publish:   { allow: ["centrifugo.>"] }
          subscribe: { allow: ["centrifugo.>"] }
        }
      }

      # -------------------------------------------------------------------------------
      # worker-events — the event writer. The one service that consumes and never
      # publishes to a pipeline subject: it batches notification.events into the store.
      # Its JetStream consumer is named `event-writer` while its deployment is
      # hermes-worker-events, so the two names differ on purpose below.
      #
      # Deliberately absent: publish on notification.events. A component that only reads
      # events must not be able to manufacture them, which is what would let it drive a
      # notification's status rollup.
      {
        nkey: $HERMES_NKEY_WORKER_EVENTS
        permissions: {
          publish: {
            allow: [
              "dlq.notification.events"
              # ADR 0005 phase 4. Read-only, and only the two streams it touches.
              "$JS.API.STREAM.INFO.EVENTS"
              "$JS.API.STREAM.INFO.DLQ"
              "$JS.API.CONSUMER.CREATE.EVENTS.event-writer.>"
              "$JS.API.CONSUMER.MSG.NEXT.EVENTS.event-writer"
              "$JS.API.CONSUMER.INFO.EVENTS.event-writer"
              "$JS.ACK.EVENTS.event-writer.>"
            ]
          }
          subscribe: { allow: ["_INBOX.hermes-worker-events.>"] }
        }
      }
    ]
  }
}
