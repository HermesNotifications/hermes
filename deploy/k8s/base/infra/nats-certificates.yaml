# ADR 0005 phase 2 — a private cert-manager issuer for in-cluster certificates.
#
# The Let's Encrypt ClusterIssuer created by infra/scripts/bootstrap-cluster.sh is a
# public ACME issuer: it proves control of a public domain and cannot sign for
# nats.hermes.svc. It stays for ingress and is not reused here.
#
# ADR 0005 phase 4 moved the CA itself out of this file and out of this namespace. It used
# to be a namespaced Issuer here, which put the CA private key in the Secret
# hermes-internal-ca-tls in `hermes` — so anything that could read Secrets in the
# application namespace could mint a certificate every Hermes service trusts. The CA is now
# a ClusterIssuer whose signing Secret lives in cert-manager's cluster-resource namespace;
# see deploy/k8s/pki/hermes-internal-ca.yaml for the manifests, the verification and the
# trade-off, including why this departs from phase 2's preference for a namespaced Issuer.
#
# What stays here is the leaf certificate, because its Secret has to be mounted by the NATS
# pods in this namespace.
---
# The NATS server certificate. cert-manager renews it in place and the kubelet
# propagates the updated Secret into the mounted volume; NATS reloads certificates on
# SIGHUP but not on file change, so a renewal is picked up at the next restart. The
# 90d/15d window leaves ample room for a routine roll.
#
# The SAN list is not decoration. `nats` and `nats.hermes.svc*` cover clients dialling
# the headless Service; the wildcards cover the per-pod names (nats-0.nats, …) that the
# cluster routes use, which is what makes route mTLS verify. The namespace is spelled out
# because kustomize's `namespace:` transformer does not rewrite strings inside dnsNames —
# renaming the namespace means editing this list.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-server-tls
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  secretName: nats-server-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  dnsNames:
    - nats
    - nats.hermes
    - nats.hermes.svc
    - nats.hermes.svc.cluster.local
    - "*.nats"
    - "*.nats.hermes"
    - "*.nats.hermes.svc"
    - "*.nats.hermes.svc.cluster.local"
  # ADR 0005 phase 4. A ClusterIssuer, not a namespaced Issuer: that is what keeps the CA
  # private key in cert-manager's namespace instead of this one. The name is cluster-scoped,
  # so it resolves without a namespace here.
  issuerRef:
    name: hermes-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
