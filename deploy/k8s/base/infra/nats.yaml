apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  serviceName: nats
  # Ordered startup deadlocks a JetStream cluster: the readiness probe cannot pass until
  # the meta layer has a leader, the meta layer cannot elect one until a quorum of peers
  # is up, and OrderedReady will not create nats-1 until nats-0 is Ready. Verified in a
  # live cluster — with OrderedReady nats-0 sat at 503 "JetStream is still recovering
  # meta layer" and was killed by its liveness probe on a loop.
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
    spec:
      # Finding 19. The image runs as root by default (verified: `id` in nats:2-alpine
      # reports uid=0), and nothing about nats-server needs it — it binds 4222/6222/8222,
      # all above 1024. fsGroup is what makes /data writable by the non-root user; the
      # JetStream store is the only thing this container writes, so the root filesystem
      # can be read-only.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # Finding 53 / ADR 0005 amendment 2026-07-31. nats-server treats an UNSET $VARIABLE as a
      # parse error and refuses to start, which is the fail-closed behaviour the accounts file
      # documents. An EMPTY one is not: `HERMES_CENTRIFUGO_NATS_PASSWORD=""` parses cleanly, the
      # server starts, and a client connecting as `centrifugo` with no credential at all is
      # accepted — verified on the wire, and pinned by
      # internal/messaging/centrifugopassword_test.go. The conf language cannot express
      # "must be non-empty", so the guarantee has to be delivered here.
      #
      # This is the only place that can deliver what nats-accounts.conf promises — a
      # half-provisioned cluster failing to START rather than serving while unauthenticated.
      # internal/config cannot (no Hermes Go process reads this variable; nats-server consumes
      # it from its own environment) and cmd/natsprovision should not (it would have to
      # impersonate `centrifugo` with an empty credential on every deploy, permanently poisoning
      # the authorization-violation signal). Both alternatives are recorded in nats-accounts.conf.
      #
      # The second check is the cross-component contract from the same ADR amendment: a variable
      # reference is resolved by RE-PARSING the value as its own conf document, so the password
      # must lex as a bare conf value. A leading ASCII letter is the one shape that is always
      # safe. cmd/natskeys already guarantees it; this catches the human who ran
      # `kubectl create secret` by hand, who has no other way to learn the rule. Without it the
      # failure is nats-server rejecting its own configuration with a message that names a parse
      # error, not a password.
      #
      # The local overlay deletes this container by name — it drops `-c nats.conf`, never reads
      # the accounts file, and legitimately has no password. See
      # ../../overlays/local/patches/nats-local.yaml; renaming this container without renaming it
      # there breaks `make dev-up`.
      initContainers:
        - name: require-centrifugo-password
          # Reuses the server image rather than adding one: it is already pulled on this node,
          # and the check needs nothing but a shell.
          image: nats:2-alpine
          command: ["/bin/sh", "-euc"]
          args:
            - |
              if [ -z "${HERMES_CENTRIFUGO_NATS_PASSWORD:-}" ]; then
                echo "FATAL: HERMES_CENTRIFUGO_NATS_PASSWORD is empty or unset." >&2
                echo "nats-accounts.conf would start with a 'centrifugo' user that accepts any" >&2
                echo "client presenting no credential. Populate the nats-nkeys Secret from" >&2
                echo "'go run ./cmd/natskeys' before starting the cluster." >&2
                exit 1
              fi
              case "${HERMES_CENTRIFUGO_NATS_PASSWORD}" in
                true|false)
                  # The one pair a leading letter does NOT save. These lex cleanly and reach
                  # nats-server as a Go bool rather than a string, so there is no parse error
                  # to notice. cmd/natskeys cannot emit them (43 base64url characters), but the
                  # hand-set Secret this container exists for can.
                  echo "FATAL: HERMES_CENTRIFUGO_NATS_PASSWORD must not be exactly 'true' or 'false'." >&2
                  echo "Both lex as a conf boolean, so nats-server receives the wrong type with" >&2
                  echo "no parse error. See ADR 0005, amendment 2026-07-31." >&2
                  exit 1
                  ;;
                [A-Za-z]*) ;;
                *)
                  echo "FATAL: HERMES_CENTRIFUGO_NATS_PASSWORD must begin with an ASCII letter." >&2
                  echo "nats-server resolves \$VARIABLE references by re-parsing the value as a" >&2
                  echo "conf document, so other shapes fail to lex or arrive as the wrong type." >&2
                  echo "See ADR 0005, amendment 2026-07-31. Regenerate with 'go run ./cmd/natskeys'." >&2
                  exit 1
                  ;;
              esac
          env:
            # optional: true for the same reason the server container uses it — the local
            # overlay has no such Secret. Absent therefore reaches the check as empty, and the
            # check is what turns empty into a refusal.
            - name: HERMES_CENTRIFUGO_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_CENTRIFUGO_NATS_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: nats
          image: nats:2-alpine
          # A JetStream cluster requires a unique server_name per node and refuses to
          # start without one. The pod name is already unique and stable across restarts.
          args:
            - "-c"
            - "/etc/nats-config/nats.conf"
            - "--name"
            - "$(POD_NAME)"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # ADR 0005 phase 3. nats-accounts.conf names its users as $VARIABLES so the
            # permissions stay reviewable in git while the identities stay per-environment.
            # These are PUBLIC keys — the matching seeds go to the service pods and are
            # deliberately not injected here, which is why this is six explicit entries
            # rather than an envFrom over the whole Secret.
            #
            # optional: true is what keeps the local overlay working: it replaces args to
            # drop `-c nats.conf`, so the server never reads the accounts block and needs
            # none of these. Everywhere else an unset variable is a parse error and the
            # server refuses to start, which is the intended fail-closed behaviour for a
            # cluster whose nats-nkeys Secret did not land.
            - name: HERMES_NKEY_SEND
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_SEND
                  optional: true
            - name: HERMES_NKEY_DISPATCH
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_DISPATCH
                  optional: true
            - name: HERMES_NKEY_WORKER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_WORKER_EMAIL
                  optional: true
            - name: HERMES_NKEY_WORKER_SMS
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_WORKER_SMS
                  optional: true
            - name: HERMES_NKEY_WORKER_INBOX
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_WORKER_INBOX
                  optional: true
            - name: HERMES_NKEY_WORKER_EVENTS
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_NKEY_WORKER_EVENTS
                  optional: true
            # ADR 0005 phase 4. Centrifugo's credential. Unlike the six above this is a
            # PASSWORD, not a public key, because centrifugo:v5 can present nothing else —
            # so this one variable is a secret the server holds in plaintext in its process
            # environment. It lives in the same Secret and follows the same fail-closed
            # rule: unset is a configuration parse error, not a server without accounts.
            - name: HERMES_CENTRIFUGO_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-nkeys
                  key: HERMES_CENTRIFUGO_NATS_PASSWORD
                  optional: true
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
            - name: certs
              mountPath: /etc/nats-certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Split on purpose, and both halves were checked against a live cluster.
          #
          # Readiness uses the full /healthz, which reports unavailable until the
          # JetStream meta layer has a leader. That is only safe because startup is
          # Parallel: the narrower js-server-only=true variant returns 200 on a server
          # whose JetStream is unusable — observed on a single-node deployment that was
          # Ready while every stream create failed with "JetStream system temporarily
          # unavailable". Readiness has to mean "can serve", or it gates nothing.
          #
          # Liveness deliberately asks less: only whether this is still a working NATS
          # process with JetStream enabled. Pointing liveness at the full /healthz turns
          # every meta-layer election into a restart storm, which is how a recoverable
          # blip becomes an outage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          secret:
            secretName: nats-server-config
        # optional: the local overlay runs NATS in plaintext and has no cert-manager, so
        # this Secret does not exist there. It is not a silent downgrade: the server only
        # accepts plaintext when the local overlay also replaces the args to drop the
        # `tls` block, and a client whose CA bundle is missing fails to connect rather
        # than falling back — see internal/messaging.WithCABundle.
        - name: certs
          secret:
            secretName: nats-server-tls
            optional: true
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  clusterIP: None
  # Without this the cluster cannot form. A headless Service publishes DNS records only
  # for Ready endpoints, the readiness probe is not Ready until JetStream has a meta
  # leader, and the meta layer cannot elect one until the routes — which are the per-pod
  # DNS names nats-0.nats, … — resolve. Verified: all three pods sat at 0/1 for three
  # minutes logging `lookup nats-1.nats: no such host` on a loop.
  #
  # The cost is that this Service, which clients also reach as tls://nats:4222, can hand
  # out a pod that is not ready yet. That is tolerable — nats.go reconnects, and services
  # already fail closed and restart if the bus is unreachable — whereas a cluster that
  # cannot form is not. What readiness still buys is rollout safety: updateStrategy is
  # RollingUpdate regardless of podManagementPolicy, so a restart waits for real JetStream
  # health before taking the next pod down.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
    - port: 4222
      name: client
    - port: 6222
      name: cluster
    - port: 8222
      name: monitor
