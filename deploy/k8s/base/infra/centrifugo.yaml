apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-config
data:
  # Finding 17. token_hmac_secret_key and api_key are deliberately EMPTY here.
  #
  # They previously carried the literal placeholders "CHANGE-ME-must-match-HERMES_JWT_SECRET"
  # and "CHANGE-ME-centrifugo-api-key", which are committed to a public repository. A
  # deployment that applied this base unmodified came up fully working with a secret
  # anyone can read — the failure mode is silent, because everything functions.
  #
  # Empty fails closed instead: Centrifugo cannot verify a JWT without a secret, so
  # tokens are rejected rather than forged. Every real environment supplies both via
  # the CENTRIFUGO_TOKEN_HMAC_SECRET_KEY and CENTRIFUGO_API_KEY environment variables
  # (see overlays/*/patches/centrifugo-env.yaml), which take precedence over this file.
  #
  # token_hmac_secret_key must equal HERMES_JWT_SECRET: Centrifugo validates the same
  # Hermes-issued tokens the services do, and it accepts exactly one such key.
  #
  # ADR 0005 phase 4. nats_url and nats_tls are how Centrifugo reaches a bus that requires
  # TLS and a credential. `--help` lists only --nats_url, which is why phase 3 recorded this
  # as unsolved; `nats_tls` is a real configuration key with no flag equivalent, found by
  # reading the binary and verified against a TLS-required nats-server. Three details are
  # load-bearing and each was observed rather than assumed:
  #
  #   * nats_tls is a MAP, not a bool. `"nats_tls": true` is rejected with
  #     `error configuring nats tls: extract TLS config: '' expected a map, got 'bool'`.
  #     Note redis_tls in the overlays IS a bool — Centrifugo is inconsistent here, so the
  #     obvious guess by analogy is the wrong one.
  #   * "enabled": true is required. With it false the CA below is ignored and the
  #     connection fails `x509: certificate signed by unknown authority`.
  #   * The credential can only travel in the URL's userinfo. Centrifugo exposes no NKey
  #     option at all, so Centrifugo is the one bus client that is a password user rather
  #     than an NKey user — see nats-accounts.conf.
  #
  # nats_url carries no password here because this file is world-readable in git. The real
  # URL arrives as CENTRIFUGO_NATS_URL from a Secret (overlays/*/patches/centrifugo-env.yaml).
  # Leaving it out fails closed: a credential-less CONNECT to a server with accounts is
  # answered with an authorization violation and Centrifugo exits non-zero.
  #
  # http_stream and sse are the fallback rungs of the client's transport ladder
  # (websocket -> http_stream -> sse). Both are bidirectional: the server->client half is
  # the stream, and the client->server half is a POST to /emulation, which enabling either
  # option also turns on. Because each command is an independent POST it can land on any
  # replica, so this needs NO session affinity — the reason we use these rather than SockJS,
  # whose long-polling did require it and which Centrifugo removed in v6 anyway.
  #
  # The key shape is version-specific and getting it wrong fails silently: v5 takes flat
  # booleans (`--sse`), v6 takes `sse.enabled`. An unrecognised key is ignored, the server
  # starts healthy, and only the fallback endpoints 404 — which nobody notices until a user
  # on a websocket-hostile network gets a permanently stale inbox. This file is the v5 image
  # (see the Deployment below); charts/hermes/values.yaml is v6 and nests them.
  config.json: |
    {
      "engine": "redis",
      "redis_address": "redis://redis:6379/0",
      "broker": "nats",
      "nats_url": "tls://nats:4222",
      "nats_tls": {
        "enabled": true,
        "server_ca_pem_file": "/etc/nats-certs/ca.crt"
      },
      "token_hmac_secret_key": "",
      "api_key": "",
      "admin": false,
      "http_stream": true,
      "sse": true,
      "presence": true,
      "history_size": 50,
      "history_ttl": "1h",
      "user_subscribe_to_personal": true,
      "allow_user_limited_channels": true,
      "health": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  labels:
    app.kubernetes.io/name: centrifugo
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: centrifugo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centrifugo
        app.kubernetes.io/component: realtime
    spec:
      enableServiceLinks: false
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v5
          args: ["centrifugo", "--config", "/centrifugo/config.json"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /centrifugo
            # ADR 0005 phase 4. The private CA that signs the NATS server certificate, the
            # same ca.crt every Hermes service mounts. Only ca.crt is projected; Centrifugo
            # presents no client certificate. optional: true keeps the pod startable in the
            # local overlay, where NATS is plaintext, this Secret does not exist, and the
            # replaced config.json sets no nats_tls.
            - name: nats-ca
              mountPath: /etc/nats-certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: centrifugo-config
        - name: nats-ca
          secret:
            secretName: nats-server-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
spec:
  selector:
    app.kubernetes.io/name: centrifugo
  ports:
    - name: http
      port: 8000
      targetPort: http
