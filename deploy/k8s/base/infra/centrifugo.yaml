apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-config
data:
  config.json: |
    {
      "engine": "redis",
      "redis_address": "redis://redis:6379/0",
      "broker": "nats",
      "nats_url": "nats://nats:4222",
      "token_hmac_secret_key": "CHANGE-ME-must-match-HERMES_JWT_SECRET",
      "api_key": "CHANGE-ME-centrifugo-api-key",
      "admin": false,
      "presence": true,
      "history_size": 50,
      "history_ttl": "1h",
      "user_subscribe_to_personal": true,
      "allow_user_limited_channels": true,
      "health": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  labels:
    app.kubernetes.io/name: centrifugo
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: centrifugo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centrifugo
        app.kubernetes.io/component: realtime
    spec:
      enableServiceLinks: false
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v5
          args: ["centrifugo", "--config", "/centrifugo/config.json"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /centrifugo
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: centrifugo-config
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
spec:
  selector:
    app.kubernetes.io/name: centrifugo
  ports:
    - name: http
      port: 8000
      targetPort: http
