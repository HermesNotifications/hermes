apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
  - apiGroups: [""]
    # Finding 21. nodes/proxy removed: it permits arbitrary requests through the
    # kubelet API on every node, which is a far larger grant than metrics collection
    # needs. The remaining four subresources are what the Agent actually reads.
    resources: ["nodes", "nodes/metrics", "nodes/spec", "nodes/stats"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/healthz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: hermes
