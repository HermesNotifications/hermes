apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-dispatch
  annotations:
    # ADR 0006, amended 2026-07-31. This service calls bootstrap.MustEnsureStreams and
    # exits non-zero when the JetStream streams are missing (ADR 0005 phase 4), so at the
    # default wave it crash-loops through every first sync until hermes-natsprovision
    # happens to finish. Wave 1 makes ArgoCD apply it only after wave 0 — NATS and the
    # provisioning Job — is healthy. Verified on a virgin namespace: zero restarts, where
    # the same bootstrap without the wave produced five each and counting. The six
    # services that fail closed on streams carry this; admin, inbox and user do not.
    #
    # The cost is a real one: anything else at wave 0 that cannot go healthy now blocks
    # this Deployment too, so the blast radius of a stuck NATS or Centrifugo is wider than
    # it was. That is the trade — a deploy that always shows crash-looping pods teaches
    # operators to ignore crash-looping pods.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: hermes-dispatch
    app.kubernetes.io/component: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-dispatch
        app.kubernetes.io/component: dispatch
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatch
          image: hermes-dispatch
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8081"
            - name: DD_SERVICE
              value: hermes-dispatch
            - name: OTEL_SERVICE_NAME
              value: hermes-dispatch
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # ADR 0005 phase 2. The private CA that signs the NATS server certificate; no
            # system trust store has it. Only ca.crt is projected — the server's key and
            # certificate stay out of client pods. optional: true keeps the pod startable
            # in the local overlay, where NATS runs plaintext and this Secret does not
            # exist; HERMES_NATS_CA_BUNDLE is empty there, so nothing looks for the file.
            - name: nats-ca
              mountPath: /etc/nats-certs
              readOnly: true
            # ADR 0005 phase 3. Only this service's NKey seed is projected — see send.yaml.
            - name: nats-nkey
              mountPath: /etc/nats-nkey
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
        - name: nats-ca
          secret:
            secretName: nats-server-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: nats-nkey
          secret:
            secretName: nats-nkeys
            optional: true
            defaultMode: 0400
            items:
              - key: hermes-dispatch.nk
                path: seed.nk
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dispatch
spec:
  selector:
    app.kubernetes.io/name: hermes-dispatch
  ports:
    - name: http
      port: 8081
      targetPort: http
