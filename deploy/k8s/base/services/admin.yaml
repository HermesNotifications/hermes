apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-admin
  labels:
    app.kubernetes.io/name: hermes-admin
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-admin
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: hermes-admin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8080"
            # No NATS client in this service, so there is nothing to drain. Stated rather than
            # defaulted, so check_shutdown_budget.py measures the sequence that actually runs.
            - name: HERMES_NATS_DRAIN_TIMEOUT
              value: "0s"
            - name: DD_SERVICE
              value: hermes-admin
            - name: OTEL_SERVICE_NAME
              value: hermes-admin
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-admin
spec:
  selector:
    app.kubernetes.io/name: hermes-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
