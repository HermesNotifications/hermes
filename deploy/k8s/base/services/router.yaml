apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-router
  labels:
    app.kubernetes.io/name: hermes-router
    app.kubernetes.io/component: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-router
        app.kubernetes.io/component: router
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: hermes-router
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8081"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-router
spec:
  selector:
    app.kubernetes.io/name: hermes-router
  ports:
    - name: http
      port: 8081
      targetPort: http
