apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-worker-email
  annotations:
    # ADR 0006, amended 2026-07-31. Calls bootstrap.MustEnsureStreams and exits non-zero
    # without the JetStream streams, so it is applied only after wave 0 (NATS plus the
    # hermes-natsprovision Sync hook) is healthy. See services/dispatch.yaml for the
    # measurement and the cost.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: hermes-worker-email
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-worker-email
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-worker-email
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: hermes
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-email
          image: hermes-worker-email
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8083"
            - name: DD_SERVICE
              value: hermes-worker-email
            - name: OTEL_SERVICE_NAME
              value: hermes-worker-email
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # ADR 0005 phase 2. The private CA that signs the NATS server certificate; no
            # system trust store has it. Only ca.crt is projected — the server's key and
            # certificate stay out of client pods. optional: true keeps the pod startable
            # in the local overlay, where NATS runs plaintext and this Secret does not
            # exist; HERMES_NATS_CA_BUNDLE is empty there, so nothing looks for the file.
            - name: nats-ca
              mountPath: /etc/nats-certs
              readOnly: true
            # ADR 0005 phase 3. Only this service's NKey seed is projected — see send.yaml.
            - name: nats-nkey
              mountPath: /etc/nats-nkey
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
        - name: nats-ca
          secret:
            secretName: nats-server-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: nats-nkey
          secret:
            secretName: nats-nkeys
            optional: true
            defaultMode: 0400
            items:
              - key: hermes-worker-email.nk
                path: seed.nk
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-worker-email
spec:
  selector:
    app.kubernetes.io/name: hermes-worker-email
  ports:
    - name: http
      port: 8083
      targetPort: http
