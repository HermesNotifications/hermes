apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-cleanup
spec:
  schedule: "0 3 * * *" # Daily at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: hermes-cleanup
              env:
                - name: HERMES_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: HERMES_DATABASE_URL
                      optional: true
              envFrom:
                - configMapRef:
                    name: hermes-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          restartPolicy: Never
