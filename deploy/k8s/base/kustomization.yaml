apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - services/
  - infra/
  - migration-job.yaml
  - ingress.yaml

configMapGenerator:
  - name: hermes-config
    literals:
      - HERMES_NATS_URL=nats://nats:4222
      - HERMES_CENTRIFUGO_API_URL=http://centrifugo:8000
    options:
      disableNameSuffixHash: true
