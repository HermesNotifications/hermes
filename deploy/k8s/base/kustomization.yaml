apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - services/
  - infra/
  - migration-job.yaml
  - cleanup-cronjob.yaml
  - ingress.yaml

configMapGenerator:
  - name: hermes-config
    literals:
      - HERMES_NATS_URL=nats://nats:4222
      - HERMES_CENTRIFUGO_API_URL=http://centrifugo:8000
      # OpenTelemetry — cluster-local Collector in the observability namespace.
      # Overlays may override to an out-of-cluster endpoint.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-opentelemetry-collector.observability.svc:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    options:
      disableNameSuffixHash: true
