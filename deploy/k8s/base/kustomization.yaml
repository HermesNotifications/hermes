apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

# Finding 47. includeTemplates is what puts the label on spec.template.metadata.labels.
# Without it the label reached resource metadata only, never a pod — so every
# NetworkPolicy whose podSelector keys on part-of selected ZERO pods, and the declared
# effect of the policy set was DNS egress and nothing else for the entire namespace.
#
# includeSelectors stays false deliberately: turning it on would write part-of into
# Deployment.spec.selector and Service.spec.selector, which are immutable on an existing
# Deployment and would require deleting and recreating each one.
labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - services/
  - infra/
  - migration-job.yaml
  - cleanup-cronjob.yaml
  - ingress.yaml

configMapGenerator:
  - name: hermes-config
    literals:
      # ADR 0005 phase 2. tls:// is the default so a deployment that forgets to configure
      # transport security is the one that fails, not the one that leaks: config.Validate
      # rejects a non-tls:// URL outside development, and the local overlay opts out
      # explicitly rather than by omission.
      - HERMES_NATS_URL=tls://nats:4222
      # Where each service finds the private CA that signs the NATS server certificate.
      # No system trust store contains it. The path is the mount in every NATS client
      # pod; an empty value means "use the system pool", which is the local dev setting.
      - HERMES_NATS_CA_BUNDLE=/etc/nats-certs/ca.crt
      - HERMES_CENTRIFUGO_API_URL=http://centrifugo:8000
      # OpenTelemetry — cluster-local Collector in the observability namespace.
      # Overlays may override to an out-of-cluster endpoint.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-opentelemetry-collector.observability.svc:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    options:
      disableNameSuffixHash: true
