apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-worker-email
  namespace: hermes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes-worker-email
  template:
    metadata:
      labels:
        app: hermes-worker-email
    spec:
      containers:
        - name: worker-email
          image: hermes-worker-email:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8083"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-worker-email
  namespace: hermes
spec:
  selector:
    app: hermes-worker-email
  ports:
    - port: 8083
      targetPort: 8083
