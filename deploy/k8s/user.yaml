apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-user
  namespace: hermes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes-user
  template:
    metadata:
      labels:
        app: hermes-user
    spec:
      containers:
        - name: user
          image: hermes-user:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_HTTP_PORT
              value: "8087"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-user
  namespace: hermes
spec:
  selector:
    app: hermes-user
  ports:
    - port: 8087
      targetPort: 8087
