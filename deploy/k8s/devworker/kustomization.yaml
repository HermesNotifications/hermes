apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field here on purpose. `make devworker-up` generates a throwaway
# overlay that sets it per worker, so two workers can apply concurrently without editing
# a shared file. `kustomize edit set namespace` would mutate this file and is therefore
# not parallel-safe.
#
# No `commonLabels` either: the Hermes NetworkPolicies select on
# app.kubernetes.io/part-of=hermes, and a sandbox that accidentally carried that label
# would be governed by policies it has no allow rules for.

resources:
  - infra.yaml
