# Finding 36. Delivery workers: messages survive in the DELIVERY WorkQueue while the workers
# are down, so this buys delivery latency rather than durability.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hermes-worker-email
  namespace: hermes
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-worker-email
