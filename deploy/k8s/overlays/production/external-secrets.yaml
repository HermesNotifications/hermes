apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
  # Finding 12. These previously all read `hermes/production`, a secret the Crossplane
  # composition created and never populated. They are now split by ownership: values
  # derived from infrastructure come from the Crossplane-reconciled `/connection` secret,
  # and values only a human can supply come from the operator-seeded `/app` secret.
  # Nothing writes both, so nothing reverts the other's changes.
  data:
    # Operator-owned — seeded once by hand, never touched by Crossplane.
    - secretKey: HERMES_JWT_SECRET
      remoteRef:
        key: hermes/production/app
        property: jwt_secret
    - secretKey: HERMES_API_KEY_HMAC_SECRET
      remoteRef:
        key: hermes/production/app
        property: api_key_hmac_secret
    - secretKey: HERMES_CENTRIFUGO_TOKEN_SECRET
      remoteRef:
        key: hermes/production/app
        property: centrifugo_token_secret
    - secretKey: HERMES_CENTRIFUGO_API_KEY
      remoteRef:
        key: hermes/production/app
        property: centrifugo_api_key
    # Crossplane-owned — derived from the Aurora and ElastiCache claims. Note
    # HERMES_DATABASE_URL must carry sslmode=require and HERMES_REDIS_URL must be
    # rediss://, or the services refuse to start (ADR 0005).
    - secretKey: HERMES_DATABASE_URL
      remoteRef:
        key: hermes/production/connection
        property: database_url
    - secretKey: HERMES_REDIS_URL
      remoteRef:
        key: hermes/production/connection
        property: redis_url
    - secretKey: HERMES_CENTRIFUGO_REDIS_ADDRESS
      remoteRef:
        key: hermes/production/connection
        property: centrifugo_redis_address
    - secretKey: HERMES_CENTRIFUGO_REDIS_PASSWORD
      remoteRef:
        key: hermes/production/connection
        property: centrifugo_redis_password
---
# Webhook URLs from SSM Parameter Store
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config-params
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: hermes-config-params
    creationPolicy: Owner
  data:
    - secretKey: HERMES_EMAIL_WEBHOOK_URL
      remoteRef:
        key: /hermes/production/email_webhook_url
    - secretKey: HERMES_SMS_WEBHOOK_URL
      remoteRef:
        key: /hermes/production/sms_webhook_url
