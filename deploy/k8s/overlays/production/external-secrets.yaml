apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
  # Finding 12. These previously all read `hermes/production`, a secret the Crossplane
  # composition created and never populated. They are now split by ownership: values
  # derived from infrastructure come from the Crossplane-reconciled `/connection` secret,
  # and values only a human can supply come from the operator-seeded `/app` secret.
  # Nothing writes both, so nothing reverts the other's changes.
  data:
    # Operator-owned — seeded once by hand, never touched by Crossplane.
    - secretKey: HERMES_JWT_SECRET
      remoteRef:
        key: hermes/production/app
        property: jwt_secret
    - secretKey: HERMES_API_KEY_HMAC_SECRET
      remoteRef:
        key: hermes/production/app
        property: api_key_hmac_secret
    - secretKey: HERMES_CENTRIFUGO_TOKEN_SECRET
      remoteRef:
        key: hermes/production/app
        property: centrifugo_token_secret
    - secretKey: HERMES_CENTRIFUGO_API_KEY
      remoteRef:
        key: hermes/production/app
        property: centrifugo_api_key
    # Crossplane-owned — derived from the Aurora and ElastiCache claims. Note
    # HERMES_DATABASE_URL must carry sslmode=require and HERMES_REDIS_URL must be
    # rediss://, or the services refuse to start (ADR 0005).
    - secretKey: HERMES_DATABASE_URL
      remoteRef:
        key: hermes/production/connection
        property: database_url
    - secretKey: HERMES_REDIS_URL
      remoteRef:
        key: hermes/production/connection
        property: redis_url
    - secretKey: HERMES_CENTRIFUGO_REDIS_ADDRESS
      remoteRef:
        key: hermes/production/connection
        property: centrifugo_redis_address
    - secretKey: HERMES_CENTRIFUGO_REDIS_PASSWORD
      remoteRef:
        key: hermes/production/connection
        property: centrifugo_redis_password
    # ADR 0005 phase 4. Centrifugo's bus URL, password included: centrifugo:v5 offers no
    # separate password setting, so nats_url's userinfo is the only channel. The same
    # password is also stored as nats-nkeys/centrifugo_password for nats-server, and nothing
    # verifies the two match — see the staging overlay for the full note.
    - secretKey: HERMES_CENTRIFUGO_NATS_URL
      remoteRef:
        key: hermes/production/connection
        property: centrifugo_nats_url
---
# ADR 0005 phase 3 — the NATS NKey set. Operator-owned, like the other /app secrets:
# Crossplane cannot derive these, and nothing but a human (or cmd/natskeys) writes them.
#
# Twelve values from one AWS secret because they are one artifact: six public keys the
# nats-server resolves as $HERMES_NKEY_* variables in nats-accounts.conf, and the six
# matching seeds each service pod projects as /etc/nats-nkey/seed.nk. Rotating one half of
# a pair alone locks that service out of the bus.
#
# Seed the remote secret with `go run ./cmd/natskeys -format json`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-nkeys
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nats-nkeys
    creationPolicy: Owner
  data:
    - secretKey: HERMES_NKEY_SEND
      remoteRef: { key: hermes/production/nats-nkeys, property: send_public }
    - secretKey: HERMES_NKEY_DISPATCH
      remoteRef: { key: hermes/production/nats-nkeys, property: dispatch_public }
    - secretKey: HERMES_NKEY_WORKER_EMAIL
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_email_public }
    - secretKey: HERMES_NKEY_WORKER_SMS
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_sms_public }
    - secretKey: HERMES_NKEY_WORKER_INBOX
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_inbox_public }
    - secretKey: HERMES_NKEY_WORKER_EVENTS
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_events_public }
    # ADR 0005 phase 4. The provisioning identity — the only user that may create or update a
    # stream. Its seed goes to the hermes-natsprovision Job, not to any service.
    - secretKey: HERMES_NKEY_PROVISION
      remoteRef: { key: hermes/production/nats-nkeys, property: provision_public }
    - secretKey: hermes-send.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: send_seed }
    - secretKey: hermes-dispatch.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: dispatch_seed }
    - secretKey: hermes-worker-email.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_email_seed }
    - secretKey: hermes-worker-sms.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_sms_seed }
    - secretKey: hermes-worker-inbox.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_inbox_seed }
    - secretKey: hermes-worker-events.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: worker_events_seed }
    - secretKey: hermes-natsprovision.nk
      remoteRef: { key: hermes/production/nats-nkeys, property: provision_seed }
    # ADR 0005 phase 4. Centrifugo is a password user, not an NKey user — its image can
    # present nothing else. nats-server reads it from the same Secret as the public keys.
    - secretKey: HERMES_CENTRIFUGO_NATS_PASSWORD
      remoteRef: { key: hermes/production/nats-nkeys, property: centrifugo_password }
---
# SMS webhook URL from SSM Parameter Store.
#
# HERMES_EMAIL_WEBHOOK_URL used to be pulled in here too. No Go code has ever read it —
# internal/email/email.go builds an SMTP or SES provider and rejects anything else — so it
# was dead config that made email delivery look configurable in a way it is not. Email is
# configured through HERMES_EMAIL_PROVIDER instead. SMS genuinely is webhook-based.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config-params
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: hermes-config-params
    creationPolicy: Owner
  data:
    - secretKey: HERMES_SMS_WEBHOOK_URL
      remoteRef:
        key: /hermes/production/sms_webhook_url
