# API services — higher resource allocation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-admin
spec:
  template:
    spec:
      containers:
        - name: admin
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
