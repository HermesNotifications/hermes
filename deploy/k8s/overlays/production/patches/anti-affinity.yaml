# Spread pods across zones and nodes for high availability.
#
# Finding 36. This file previously covered admin, dispatch, inbox and user only. Centrifugo,
# send, the four workers and — the one that actually costs quorum — the NATS StatefulSet had
# no spread constraint of any kind, so nothing stopped the scheduler stacking every replica of
# a workload onto one node.
#
# Two different rules are used here on purpose, and the difference is not cosmetic:
#
#   * Horizontally scalable stateless tiers (every Deployment below) get soft spread —
#     `whenUnsatisfiable: ScheduleAnyway`. A hard rule would cap the workload's replica count
#     at the node count, which would silently defeat the HPAs in ../hpa/ the moment the
#     autoscaler asked for more replicas than there are nodes. A degraded spread beats a
#     Pending pod for a tier whose availability comes from having many replicas.
#
#   * NATS gets a HARD rule, because its availability comes from a quorum of exactly three,
#     and a soft rule is worth nothing there: it is precisely the "all three on one node" case
#     that the PDB in ../pdb/nats-pdb.yaml cannot survive, and `ScheduleAnyway` permits it.
#     See the NATS block at the end of this file for the cost that choice carries.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-admin
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-admin
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-admin
---
