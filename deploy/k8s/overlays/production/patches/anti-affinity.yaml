# Centrifugo holds no durable state of its own — presence and history live in Redis and the
# broker is NATS — so a soft spread is enough. It is in the request path for every WebSocket
# client, which is why it is here at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: centrifugo
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: centrifugo
---
# Finding 36, the part that costs data availability rather than capacity.
#
# NATS is a 3-replica JetStream cluster whose meta layer needs 2 of 3 to elect a leader, and
# ../pdb/nats-pdb.yaml sets `minAvailable: 2` to protect exactly that. With all three pods on
# one node the PDB protects nothing and actively makes things worse: losing that node takes
# JetStream below quorum, and because only 1 of 3 pods is then healthy the same PDB reports
# `disruptionsAllowed: 0` and blocks the voluntary eviction that would let the survivors
# reschedule. The control and the failure it was meant to survive are the same event.
#
# `requiredDuringSchedulingIgnoredDuringExecution` on hostname is the only rule that makes the
# PDB's premise true. The cost is explicit and accepted: **the production cluster must have at
# least 3 schedulable nodes, and at least 4 for a node to be drained without leaving a NATS pod
# Pending.** Below that a NATS pod stays Pending rather than co-locating — loud and diagnosable,
# versus a cluster that looks healthy until the node it all sits on goes away.
#
# Zone spread stays soft. A hard zone rule would pin the cluster to exactly one pod per zone
# and make a single zone's capacity shortage an unschedulable pod, which is a worse trade than
# a temporarily uneven zone distribution over nodes that are already guaranteed distinct.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nats
