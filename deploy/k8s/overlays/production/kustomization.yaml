apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # ADR 0005 phase 4. Hermes' internal CA. A sibling of ../../base, not part of it: base sets
  # `namespace: hermes` and the transformer would rewrite the CA Certificate's
  # `namespace: cert-manager`, moving the CA private key back into the application namespace.
  - ../../pki
  - external-secrets.yaml
  - secret-store.yaml
  - parameter-store.yaml
  - hpa/
  - pdb/
  - network-policies/

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - path: patches/anti-affinity.yaml
  - path: patches/centrifugo-env.yaml
  - path: patches/ingress-tls.yaml
    target:
      kind: Ingress
      name: hermes-ingress
  - path: patches/ingress-realtime-tls.yaml
    target:
      kind: Ingress
      name: hermes-realtime-ingress

# DATABASE_URL and REDIS_URL are provided by ExternalSecret (hermes-secrets)
# No additional hermes-config needed — base config has NATS_URL and CENTRIFUGO_API_URL

configMapGenerator:
  - name: hermes-config
    behavior: merge
    literals:
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
      # ADR 0005. Anything other than "development" makes config.Validate enforce TLS on
      # every datastore connection and reject the built-in placeholder secrets. Without
      # this the check defaults to development and is silently inert here — which is the
      # same failure mode as finding 47, a control that exists and does not run.
      - HERMES_ENV=production
      # Matches the 3-replica NATS StatefulSet. Without this every stream lives on one peer, so
      # losing a single node takes NOTIFICATIONS or DELIVERY offline entirely — publishes fail,
      # consumers stall, and restarting services crash-loop on EnsureStreams — despite the
      # minAvailable: 2 PDB and the hard hostname anti-affinity that exist to prevent it.
      - HERMES_NATS_STREAM_REPLICAS=3
      # Roughly 60% of the 5Gi JetStream PVC per node. A file store that reaches the disk limit
      # fails *every* publish, including the dead-letter publishes that are the safety net;
      # bounding the work streams means a spike is rejected at the edge (a 503 the caller can
      # retry) instead of taking the DLQ down with it.
      - HERMES_NATS_STREAM_MAX_BYTES=3221225472
    options:
      disableNameSuffixHash: true
  - name: hermes-domain
    literals:
      - DOMAIN=hermes.example.com  # ← Set your production domain here
    options:
      disableNameSuffixHash: true
  - name: centrifugo-config
    behavior: replace
    files:
      - config.json=centrifugo-config.json
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: hermes-domain
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.tls.0.hosts.0
          - spec.rules.0.host

# Image tags managed by Kargo in a separate component to avoid merge conflicts
components:
  - images/
