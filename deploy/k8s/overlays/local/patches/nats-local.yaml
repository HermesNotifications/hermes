apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  replicas: 1
  template:
    spec:
      # Finding 53. The base StatefulSet refuses to start unless
      # HERMES_CENTRIFUGO_NATS_PASSWORD is set and begins with an ASCII letter. That guard
      # protects the accounts file, and the args replacement below drops `-c nats.conf`, so
      # this overlay never reads that file and legitimately has no password — the guard would
      # block `make dev-up` for a risk that does not exist here.
      #
      # `$patch: delete` matches on the container's `name`, which is therefore a contract with
      # ../../../base/infra/nats.yaml: rename it there without renaming it here and this patch
      # silently stops matching. The failure is loud rather than silent — the local pod would
      # sit in Init:CrashLoopBackOff with the FATAL message — but it is still a rename that
      # breaks a second file.
      initContainers:
        - name: require-centrifugo-password
          $patch: delete
      containers:
        - name: nats
          # ADR 0005 phase 2 keeps local development working without certificates, and
          # this is where that opt-out is spelled out rather than implied. Replacing the
          # args drops `-c nats.conf`, so the server never reads the `tls` block and runs
          # plaintext on 4222 with plain HTTP monitoring on 8222 — the same thing
          # `make infra-up` gives you. The base `certs` volume is optional, so the
          # cert-manager Secret being absent here does not block the pod.
          #
          # The matching client half is in kustomization.yaml: HERMES_NATS_URL goes back
          # to nats:// and HERMES_NATS_CA_BUNDLE is emptied.
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "-m"
            - "8222"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
              scheme: HTTP
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
