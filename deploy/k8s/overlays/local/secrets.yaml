apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
type: Opaque
stringData:
  HERMES_JWT_SECRET: "dev-jwt-secret"
  HERMES_CENTRIFUGO_TOKEN_SECRET: "dev-jwt-secret"
  HERMES_CENTRIFUGO_API_KEY: "centrifugo-api-key"
  # No HERMES_EMAIL_WEBHOOK_URL: nothing reads it. internal/email/email.go builds an SMTP or
  # SES provider and rejects anything else. Local email goes to Mailpit over SMTP.
  HERMES_SMS_WEBHOOK_URL: "http://host.k3d.internal:9090/sms"
