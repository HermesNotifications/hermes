apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/datadog

secretGenerator:
  - name: datadog-secret
    literals:
      - api-key=REPLACE_WITH_YOUR_DD_API_KEY
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: "hermes-.*"
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            containers:
              - name: "*"
                env:
                  - name: DD_AGENT_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.hostIP
                  - name: DD_ENV
                    value: local
                  - name: DD_VERSION
                    value: dev
