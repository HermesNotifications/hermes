apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres.yaml
  - redis.yaml
  - mailpit.yaml
  - extenddb.yaml
  - secrets.yaml

patches:
  # Replace 3-node NATS StatefulSet with single-node plaintext for local dev
  - path: patches/nats-local.yaml
  # ADR 0005 phase 2. The k3d cluster `make dev-up` creates has no cert-manager —
  # infra/scripts/bootstrap-cluster.sh installs it on EKS, not here — so applying these
  # would fail on a missing CRD. Local NATS runs plaintext and needs no certificates.
  - target:
      group: cert-manager.io
      kind: Certificate
    patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: unused
  - target:
      group: cert-manager.io
      kind: Issuer
    patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: unused
  # Relax readOnlyRootFilesystem for Tilt live_update (restart wrapper needs writes)
  - path: patches/security-dev.yaml
    target:
      kind: Deployment
      name: "hermes-.*"
  # Remove migration Job — Tilt runs migrations via local_resource
  - target:
      kind: Job
      name: hermes-migrate
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: hermes-migrate
  # The dev image (Dockerfile.dev) bakes no ENTRYPOINT — services get theirs from
  # Tilt's restart wrapper, but the cleanup CronJob uses a plain build, so set the
  # container command explicitly. (The prod image bakes ENTRYPOINT ["/service"].)
  - target:
      kind: CronJob
      name: hermes-cleanup
    patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: hermes-cleanup
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: cleanup
                    command: ["/app/service"]

configMapGenerator:
  - name: hermes-config
    behavior: merge
    literals:
      - HERMES_DATABASE_URL=postgres://hermes:hermes@postgres:5432/hermes?sslmode=disable
      - HERMES_REDIS_URL=redis://redis:6379/0
      # ADR 0005 phase 2's explicit dev opt-out. The base defaults are tls:// and a CA
      # bundle path; local NATS has neither, so both are named here. An empty CA bundle
      # makes internal/messaging.WithCABundle a no-op. HERMES_ENV is unset, so it defaults
      # to "development" and config.Validate does not reject these.
      - HERMES_NATS_URL=nats://nats:4222
      - HERMES_NATS_CA_BUNDLE=
      # ADR 0005 phase 3's dev opt-out, named for the same reason. Local NATS defines no
      # accounts (patches/nats-local.yaml replaces args, so nats.conf and its
      # `include "accounts.conf"` are never read), so there is nobody to authenticate as.
      # An empty seed makes messaging.WithIdentity leave the credential off while still
      # applying the per-service inbox prefix.
      - HERMES_NATS_NKEY_SEED=
      - HERMES_EMAIL_SMTP_HOST=mailpit
      - HERMES_DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - HERMES_DYNAMO_REGION=us-east-1
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    options:
      disableNameSuffixHash: true
  # Override centrifugo config for local dev (admin enabled, dev secrets)
  - name: centrifugo-config
    behavior: replace
    files:
      - config.json=centrifugo-config.json
    options:
      disableNameSuffixHash: true

images:
  - name: hermes-admin
    newName: k3d-hermes-registry.localhost:5111/hermes-admin
  - name: hermes-dispatch
    newName: k3d-hermes-registry.localhost:5111/hermes-dispatch
  - name: hermes-inbox
    newName: k3d-hermes-registry.localhost:5111/hermes-inbox
  - name: hermes-user
    newName: k3d-hermes-registry.localhost:5111/hermes-user
  - name: hermes-worker-events
    newName: k3d-hermes-registry.localhost:5111/hermes-worker-events
  - name: hermes-worker-email
    newName: k3d-hermes-registry.localhost:5111/hermes-worker-email
  - name: hermes-worker-sms
    newName: k3d-hermes-registry.localhost:5111/hermes-worker-sms
  - name: hermes-send
    newName: k3d-hermes-registry.localhost:5111/hermes-send
  - name: hermes-worker-inbox
    newName: k3d-hermes-registry.localhost:5111/hermes-worker-inbox
  - name: hermes-cleanup
    newName: k3d-hermes-registry.localhost:5111/hermes-cleanup
