# Allow all hermes pods to reach NATS on client port
# Allow NATS pods to communicate on cluster port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats-client
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    # Client connections from all hermes pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hermes
      ports:
        - protocol: TCP
          port: 4222
    # Cluster communication between NATS nodes
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 6222
    # Monitor port for health checks
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8222
---
# Allow hermes pods to connect to NATS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-nats
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hermes
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
---
# Allow NATS nodes to reach each other for cluster routing.
#
# Not part of the original findings, but exposed by fixing finding 47: allow-nats-client
# above permits 6222 INGRESS between NATS pods, and nothing permitted the matching
# EGRESS. While the part-of label never reached a pod these policies selected nothing and
# the omission was invisible. Staging runs a single replica so it would not have noticed,
# but the rule is kept identical to production deliberately.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats-cluster-egress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 6222
---
# Allow hermes pods to connect to Centrifugo
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-centrifugo
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hermes
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: centrifugo
      ports:
        - protocol: TCP
          port: 8000
---
# Allow Centrifugo to reach NATS (broker)
# Centrifugo's egress to managed Redis is covered by allow-egress-managed-services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-centrifugo-egress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: centrifugo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hermes
      ports:
        - protocol: TCP
          port: 8000
