apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: HERMES_JWT_SECRET
      remoteRef:
        key: hermes/staging
        property: jwt_secret
    - secretKey: HERMES_DATABASE_URL
      remoteRef:
        key: hermes/staging
        property: database_url
    - secretKey: HERMES_REDIS_URL
      remoteRef:
        key: hermes/staging
        property: redis_url
    - secretKey: HERMES_CENTRIFUGO_TOKEN_SECRET
      remoteRef:
        key: hermes/staging
        property: centrifugo_token_secret
    - secretKey: HERMES_CENTRIFUGO_API_KEY
      remoteRef:
        key: hermes/staging
        property: centrifugo_api_key
    - secretKey: HERMES_EMAIL_WEBHOOK_URL
      remoteRef:
        key: hermes/staging
        property: email_webhook_url
    - secretKey: HERMES_SMS_WEBHOOK_URL
      remoteRef:
        key: hermes/staging
        property: sms_webhook_url
