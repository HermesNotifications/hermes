apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: HERMES_JWT_SECRET
      remoteRef:
        key: hermes/staging/app
        property: jwt_secret
    - secretKey: HERMES_DATABASE_URL
      remoteRef:
        key: hermes/staging/connection
        property: database_url
    - secretKey: HERMES_REDIS_URL
      remoteRef:
        key: hermes/staging/connection
        property: redis_url
    - secretKey: HERMES_CENTRIFUGO_TOKEN_SECRET
      remoteRef:
        key: hermes/staging/app
        property: centrifugo_token_secret
    - secretKey: HERMES_CENTRIFUGO_API_KEY
      remoteRef:
        key: hermes/staging/app
        property: centrifugo_api_key
    - secretKey: HERMES_CENTRIFUGO_REDIS_ADDRESS
      remoteRef:
        key: hermes/staging/connection
        property: centrifugo_redis_address
    - secretKey: HERMES_CENTRIFUGO_REDIS_PASSWORD
      remoteRef:
        key: hermes/staging/connection
        property: centrifugo_redis_password
    - secretKey: HERMES_API_KEY_HMAC_SECRET
      remoteRef:
        key: hermes/staging/app
        property: api_key_hmac_secret
---
# ADR 0005 phase 3 — the NATS NKey set.
#
# Twelve values from one AWS secret because they are one artifact: six public keys the
# nats-server resolves as $HERMES_NKEY_* variables in nats-accounts.conf, and the six
# matching seeds each service pod projects as /etc/nats-nkey/seed.nk. A public key and its
# seed are a pair; rotating one half alone locks that service out of the bus.
#
# Seed the remote secret with `go run ./cmd/natskeys -format json`. The public keys are not
# sensitive; they live here with the seeds so the pair cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-nkeys
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nats-nkeys
    creationPolicy: Owner
  data:
    - secretKey: HERMES_NKEY_SEND
      remoteRef: { key: hermes/staging/nats-nkeys, property: send_public }
    - secretKey: HERMES_NKEY_DISPATCH
      remoteRef: { key: hermes/staging/nats-nkeys, property: dispatch_public }
    - secretKey: HERMES_NKEY_WORKER_EMAIL
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_email_public }
    - secretKey: HERMES_NKEY_WORKER_SMS
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_sms_public }
    - secretKey: HERMES_NKEY_WORKER_INBOX
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_inbox_public }
    - secretKey: HERMES_NKEY_WORKER_EVENTS
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_events_public }
    - secretKey: hermes-send.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: send_seed }
    - secretKey: hermes-dispatch.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: dispatch_seed }
    - secretKey: hermes-worker-email.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_email_seed }
    - secretKey: hermes-worker-sms.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_sms_seed }
    - secretKey: hermes-worker-inbox.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_inbox_seed }
    - secretKey: hermes-worker-events.nk
      remoteRef: { key: hermes/staging/nats-nkeys, property: worker_events_seed }
---
# Webhook URLs from SSM Parameter Store
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config-params
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: hermes-config-params
    creationPolicy: Owner
  data:
    - secretKey: HERMES_EMAIL_WEBHOOK_URL
      remoteRef:
        key: /hermes/staging/email_webhook_url
    - secretKey: HERMES_SMS_WEBHOOK_URL
      remoteRef:
        key: /hermes/staging/sms_webhook_url
