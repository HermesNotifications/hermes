# Staging NATS server configuration — single node, TLS, no cluster.
#
# Staging runs one replica. It cannot use the base configuration, because that file lists
# three cluster routes and a JetStream meta layer that expects three peers never reaches
# quorum with one: verified in a live cluster, where the single node came up, passed a
# server-level health check, and then failed every stream create with "JetStream system
# temporarily unavailable (10008)" indefinitely. Removing the cluster block makes it a
# standalone JetStream server, which works.
#
# The `tls` block is identical to the base file and must stay that way — this file
# existing to drop the cluster block is not licence to weaken transport security. The
# certificate is the same cert-manager-issued one; the SANs covering the headless Service
# are what a client dialling nats:4222 verifies.

port: 4222
https: 8222

jetstream {
  store_dir: /data
}

tls {
  cert_file: "/etc/nats-certs/tls.crt"
  key_file:  "/etc/nats-certs/tls.key"
  ca_file:   "/etc/nats-certs/ca.crt"
  timeout: 5
}
