apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- external-secrets.yaml
- secret-store.yaml
- parameter-store.yaml
- network-policies/
- storage-class.yaml
patches:
- path: patches/replicas.yaml
- path: patches/centrifugo-env.yaml
- path: patches/ingress.yaml
- path: patches/nats.yaml
# DATABASE_URL and REDIS_URL are provided by ExternalSecret (hermes-secrets)
# No additional hermes-config needed — base config has NATS_URL and CENTRIFUGO_API_URL
configMapGenerator:
- name: hermes-config
  behavior: merge
  literals:
  - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=staging
  # ADR 0005. Anything other than "development" makes config.Validate enforce TLS on every
  # datastore connection and reject the built-in placeholder secrets. Without this the
  # check defaults to development and is silently inert here.
  - HERMES_ENV=staging
  options:
    disableNameSuffixHash: true
- name: hermes-domain
  literals:
  - DOMAIN=staging.hermes.dgr.io # ← Set your staging domain here
  options:
    disableNameSuffixHash: true
- name: centrifugo-config
  behavior: replace
  files:
  - config.json=centrifugo-config.json
  options:
    disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: hermes-domain
    fieldPath: data.DOMAIN
  targets:
  - select:
      kind: Ingress
    fieldPaths:
    - spec.tls.0.hosts.0
    - spec.rules.0.host
# Image tags managed by Kargo in a separate component to avoid merge conflicts
components:
- images/
