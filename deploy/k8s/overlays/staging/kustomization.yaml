apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- external-secrets.yaml
- secret-store.yaml
- parameter-store.yaml
- network-policies/
patches:
- path: patches/replicas.yaml
- path: patches/centrifugo-env.yaml
- path: patches/ingress.yaml
# DATABASE_URL and REDIS_URL are provided by ExternalSecret (hermes-secrets)
# No additional hermes-config needed — base config has NATS_URL and CENTRIFUGO_API_URL
configMapGenerator:
- name: hermes-domain
  literals:
  - DOMAIN=staging.hermes.horizonhq.io # ← Set your staging domain here
  options:
    disableNameSuffixHash: true
- name: centrifugo-config
  behavior: replace
  files:
  - config.json=centrifugo-config.json
  options:
    disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: hermes-domain
    fieldPath: data.DOMAIN
  targets:
  - select:
      kind: Ingress
    fieldPaths:
    - spec.tls.0.hosts.0
    - spec.rules.0.host
# Image tags managed by Kargo in a separate component to avoid merge conflicts
components:
- images/
images:
- name: hermes-admin
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-inbox
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-migrate
  newTag: 29f949003b68b88f832aba3f79687ba0f65054c3
- name: hermes-router
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-user
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-worker-email
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-worker-events
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-worker-inbox
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
- name: hermes-worker-sms
  newTag: 33c324917894ed038ab308f33ccc112206fb2bd5
