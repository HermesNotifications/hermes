# Argo Rollouts AnalysisTemplate used by Kargo for post-promotion verification.
# Runs a kubectl job that checks rollout status for all Hermes deployments
# and the NATS StatefulSet, then verifies all pods are in Running state.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: hermes-health-check
  namespace: hermes
spec:
  metrics:
    - name: pod-health
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              metadata:
                # Selected by allow-health-check-egress in rbac.yaml. Without a label the
                # policy can match, the pod gets default-deny-all and cannot reach the
                # API server — see finding 47 for how a policy matching nothing looks
                # exactly like one that works.
                labels:
                  app.kubernetes.io/name: hermes-health-check
              spec:
                restartPolicy: Never
                # Finding 35. Previously unset, so the pod ran as `default`, which holds
                # no permissions — every kubectl call returned 403.
                serviceAccountName: hermes-health-check
                containers:
                  - name: health-check
                    # Pinned by digest rather than :latest. An unpinned verification gate
                    # is one where a new image can silently change what "healthy" means
                    # between two promotions of identical code.
                    #
                    # Digest resolved from bitnami/kubectl:latest on 2026-07-29 and
                    # verified to exist. The tag is kept alongside it for readability;
                    # the digest is what actually selects the image.
                    #
                    # Separately: the triage recorded an unverified external claim that
                    # the bitnami registry is being retired. If that is true this image
                    # needs replacing regardless, and a digest pin at least makes the
                    # failure a clean pull error rather than a silent behaviour change.
                    image: bitnami/kubectl:latest@sha256:bb91d6086d968982b7589dbed517aac72409337c76556e4ddcc15d810b6cc06d
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        # Wait for each deployment rollout to complete.
                        # hermes-send was missing from this list, so the platform's
                        # primary write path was never verified after a promotion.
                        for deploy in admin send dispatch inbox user worker-events worker-email worker-sms worker-inbox; do
                          echo "Checking hermes-${deploy}..."
                          kubectl rollout status deployment/hermes-${deploy} -n hermes --timeout=120s
                        done
                        # Check NATS StatefulSet
                        kubectl rollout status statefulset/nats -n hermes --timeout=60s
                        # Verify all pods are ready
                        NOT_READY=$(kubectl get pods -n hermes --no-headers | grep -v "Running\|Completed" | wc -l)
                        if [ "$NOT_READY" -gt 0 ]; then
                          echo "Found $NOT_READY pods not in Running state"
                          kubectl get pods -n hermes
                          exit 1
                        fi
                        echo "All pods healthy"
      successCondition: result.exitCode == 0
      failureLimit: 2
      interval: 30s
      count: 3
