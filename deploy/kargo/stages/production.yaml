# Kargo Stage: production
# Subscribes to Freight that has been verified in the staging stage.
# NO auto-promotion — requires manual approval in the Kargo UI before
# Freight is promoted to production.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: hermes
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hermes
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: registry
          value: 471524413120.dkr.ecr.us-east-1.amazonaws.com
        - name: repoURL
          value: git@github.com:darylrobbins/hermes.git
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          config:
            path: ./src/deploy/k8s/overlays/production/images
            images:
              - image: hermes-admin
                newName: ${{ vars.registry }}/hermes-admin
                tag: ${{ imageFrom(vars.registry + "/hermes-admin").Tag }}
              - image: hermes-dispatch
                newName: ${{ vars.registry }}/hermes-dispatch
                tag: ${{ imageFrom(vars.registry + "/hermes-dispatch").Tag }}
              - image: hermes-inbox
                newName: ${{ vars.registry }}/hermes-inbox
                tag: ${{ imageFrom(vars.registry + "/hermes-inbox").Tag }}
              - image: hermes-user
                newName: ${{ vars.registry }}/hermes-user
                tag: ${{ imageFrom(vars.registry + "/hermes-user").Tag }}
              - image: hermes-worker-events
                newName: ${{ vars.registry }}/hermes-worker-events
                tag: ${{ imageFrom(vars.registry + "/hermes-worker-events").Tag }}
              - image: hermes-worker-email
                newName: ${{ vars.registry }}/hermes-worker-email
                tag: ${{ imageFrom(vars.registry + "/hermes-worker-email").Tag }}
              - image: hermes-worker-sms
                newName: ${{ vars.registry }}/hermes-worker-sms
                tag: ${{ imageFrom(vars.registry + "/hermes-worker-sms").Tag }}
              - image: hermes-worker-inbox
                newName: ${{ vars.registry }}/hermes-worker-inbox
                tag: ${{ imageFrom(vars.registry + "/hermes-worker-inbox").Tag }}
              - image: hermes-send
                newName: ${{ vars.registry }}/hermes-send
                tag: ${{ imageFrom(vars.registry + "/hermes-send").Tag }}
              - image: hermes-migrate
                newName: ${{ vars.registry }}/hermes-migrate
                tag: ${{ imageFrom(vars.registry + "/hermes-migrate").Tag }}
        - uses: git-commit
          config:
            path: ./src
            message: "chore(production): update image tags via Kargo promotion"
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: hermes-production
                sources:
                  - repoURL: git@github.com:darylrobbins/hermes.git
