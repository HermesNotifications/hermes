# Kargo Warehouse watches ECR for new images across all 11 Hermes images:
# the 9 long-running services plus the two run-to-completion Jobs, hermes-migrate
# and hermes-natsprovision, which are subscribed below like any other and are why
# the count is 11 rather than 9.
# When any service publishes a new tag, Kargo creates a Freight that can
# be promoted through the staging -> production pipeline.
#
# Images are tagged with git SHAs by the CD pipeline, so we use the Lexical
# strategy with a regex filter to match 40-char hex strings.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hermes
  namespace: hermes
spec:
  subscriptions:
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-admin
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-dispatch
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-inbox
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-user
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-worker-events
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-worker-email
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-worker-sms
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-worker-inbox
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-send
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-migrate
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
    # ADR 0005 phase 4. The stream-provisioning Job — the only bus identity that may declare
    # a stream. Subscribed here so a Freight cannot promote services that require streams
    # without the image that creates them.
    - image:
        repoURL: 471524413120.dkr.ecr.us-east-1.amazonaws.com/hermes-natsprovision
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{40}$
        discoveryLimit: 5
