# ArgoCD Application for Hermes observability (production).
# Manual sync only — changes to the observability stack require explicit approval.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-observability-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:HermesNotifications/hermes.git
    targetRevision: main
    path: deploy/observability/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    # No automated sync — production observability changes require manual approval.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
