# ArgoCD Application for Hermes production environment.
# Auto-sync is enabled (prune + selfHeal) because Kargo controls
# WHEN the production overlay is updated via promotion steps.
# ArgoCD simply reconciles whatever state is committed to git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-production
  namespace: argocd
  labels:
    kargo.akuity.io/authorized-stage: production
  annotations:
    kargo.akuity.io/authorized-stage: hermes:production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:HermesNotifications/hermes.git
    targetRevision: main
    path: deploy/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  # Finding 34. Four Deployments (admin, dispatch, inbox, worker-email) carry both a
  # committed replica count in overlays/production/patches/replicas.yaml AND an HPA in
  # overlays/production/hpa/. With selfHeal on and no exception, ArgoCD reverts every
  # scaling decision the HPA makes back to the git-committed number, so the two
  # controllers fight and autoscaling silently does not work.
  #
  # Ignoring /spec/replicas is preferred over deleting it from the patch: the committed
  # value still serves as the initial count for a fresh deployment, and it stays
  # meaningful for the five Deployments that have no HPA.
  #
  # Staging deliberately has no equivalent — its kustomization includes no hpa/ directory,
  # so nothing there contends for the field.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
