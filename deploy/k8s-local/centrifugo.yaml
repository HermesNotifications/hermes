apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-config
  namespace: hermes
data:
  config.json: |
    {
      "engine": "redis",
      "redis_address": "redis:6379",
      "broker": "nats",
      "nats_url": "nats://nats:4222",
      "token_hmac_secret_key": "dev-centrifugo-token-secret",
      "api_key": "centrifugo-api-key",
      "admin": true,
      "presence": true,
      "history_size": 50,
      "history_ttl": "1h",
      "user_subscribe_to_personal": true,
      "allow_user_limited_channels": true,
      "health": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
    spec:
      enableServiceLinks: false
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v5
          args: ["centrifugo", "--config", "/centrifugo/config.json"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /centrifugo
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: centrifugo-config
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
  namespace: hermes
spec:
  selector:
    app: centrifugo
  ports:
    - port: 8000
      targetPort: 8000
