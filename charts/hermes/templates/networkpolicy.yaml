{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "hermes.fullname" . -}}
# Default deny all ingress and egress, but allow DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-default-deny
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hermes
  policyTypes:
    - Ingress
    - Egress
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow ingress to admin service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-admin
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-admin
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.admin.port }}
          protocol: TCP
---
# Allow ingress to send service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-send
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-send
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.send.port }}
          protocol: TCP
---
# Allow ingress to inbox service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-inbox
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-inbox
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.inbox.port }}
          protocol: TCP
---
# Allow ingress to user service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-user
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-user
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.user.port }}
          protocol: TCP
{{- if .Values.postgresql.enabled }}
---
# Allow ingress to the bundled Postgres from Hermes pods.
#
# Required by ADR 0009, not optional hardening. While Postgres was the bitnami sub-chart its
# pods carried no `app.kubernetes.io/part-of: hermes` label, so the default-deny policy above
# never selected them and traffic reached them by virtue of no policy applying at all. The
# bundled manifests use hermes.labels and therefore *are* selected, so without this rule
# every Hermes service fails to connect to its database — with the chart rendering perfectly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-postgresql
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hermes
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.redis.enabled }}
---
# Allow ingress to the bundled Redis from Hermes pods. Same reasoning as Postgres above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-ingress-redis
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hermes
      ports:
        - port: 6379
          protocol: TCP
{{- end }}
---
# Allow egress to infrastructure services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-allow-egress
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hermes
  policyTypes:
    - Egress
  egress:
    # NATS
    - ports:
        - port: 4222
          protocol: TCP
    # Centrifugo
    - ports:
        - port: 8000
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # HTTPS (external webhooks)
    - ports:
        - port: 443
          protocol: TCP
    # SMTP
    - ports:
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 25
          protocol: TCP
    {{- if and .Values.hermes.bootstrap.enabled (not .Values.hermes.bootstrap.existingSecret) }}
    # Kubernetes API server, for the bootstrap Job's Secret write.
    #
    # 443 above covers a managed control plane, but k3s, kind, k3d and RKE serve the API on
    # 6443 — so on exactly the clusters someone is most likely to evaluate on, the Job would
    # hang until its context deadline and the install would look like a database problem.
    # Rendered only when the Job actually needs the API server: with existingSecret set it
    # talks to Postgres and nothing else.
    - ports:
        - port: {{ .Values.hermes.bootstrap.apiServerPort }}
          protocol: TCP
    {{- end }}
{{- end }}
