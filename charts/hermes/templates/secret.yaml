{{- if not .Values.hermes.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes.fullname" . }}-secrets
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.hermes.jwt.existingSecret }}
  HERMES_JWT_SECRET: {{ required "hermes.jwt.secret is required when hermes.jwt.existingSecret is not set" .Values.hermes.jwt.secret | quote }}
  {{- end }}
  {{- if not .Values.hermes.apiKey.existingSecret }}
  HERMES_API_KEY_HMAC_SECRET: {{ required "hermes.apiKey.hmacSecret is required when hermes.apiKey.existingSecret is not set" .Values.hermes.apiKey.hmacSecret | quote }}
  {{- end }}
  {{- if .Values.centrifugo.enabled }}
  {{/*
  Always present when the bundled Centrifugo is enabled, defaulting to the same placeholder
  internal/config uses.

  It used to be omitted when unset, which was fine while nothing read it from here. It is not
  fine now that the Centrifugo sub-chart takes its own `http_api.key` from this Secret: an
  absent key makes the secretKeyRef unresolvable and the pod sits in
  CreateContainerConfigError -- a failure `helm template` cannot see, because it happens when
  the kubelet builds the container rather than when the chart renders.

  The placeholder is safe here for the same reason it is safe elsewhere in development: it is
  a published constant, and `_validate.tpl` refuses it outside development.
  */}}
  HERMES_CENTRIFUGO_API_KEY: {{ .Values.hermes.centrifugo.apiKey | default "centrifugo-api-key" | quote }}
  {{- else if .Values.hermes.centrifugo.apiKey }}
  HERMES_CENTRIFUGO_API_KEY: {{ .Values.hermes.centrifugo.apiKey | quote }}
  {{- end }}
  {{- if not .Values.externalPostgresql.existingSecret }}
  HERMES_DATABASE_URL: {{ include "hermes.databaseUrl" . | quote }}
  {{- end }}
  {{- if and (eq .Values.hermes.email.provider "smtp") .Values.hermes.email.smtp.password }}
  HERMES_EMAIL_SMTP_PASSWORD: {{ .Values.hermes.email.smtp.password | quote }}
  {{- end }}
{{- end }}
