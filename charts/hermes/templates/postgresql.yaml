{{/*
Bundled evaluation Postgres.

This is a plain StatefulSet rather than a sub-chart dependency, and that is a decision with
a reason behind it (ADR 0009). The bitnami/postgresql chart that used to sit here became
uninstallable when Broadcom withdrew Bitnami's free image catalogue from Docker Hub: every
versioned tag under docker.io/bitnami now 404s, and only the moving `:latest` survives.
Depending on a chart means depending on whatever image its maintainer points it at, which is
exactly the exposure that broke this chart once already. `docker.io/library/postgres` is a
Docker Official Image with versioned tags and no such vendor.

Scope: this exists so `helm install hermes` gives someone a working system to evaluate. It
is a single replica with no backups, no replication and no TLS, which is why
_validate.tpl refuses to render it alongside `hermes.env=production`. Production installs
set `postgresql.enabled=false` and point `externalPostgresql.url` at a managed instance.
*/}}
{{- if .Values.postgresql.enabled }}
{{- $fullName := include "hermes.fullname" . -}}
{{- $name := printf "%s-postgresql" $fullName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # The same credentials hermes.databaseUrl builds HERMES_DATABASE_URL from. The URL itself
  # is assembled in the ConfigMap, where the password is already visible; this Secret exists
  # so the server process does not additionally take it from a ConfigMap-sourced env var.
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "hermes.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "hermes.name" . }}-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        # The official postgres image runs as uid 999 and needs to own its data directory.
        # fsGroup is what makes the mounted PVC writable to it; without this the server
        # exits with "could not create lock file" on any storage class that does not
        # happen to mount world-writable.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      {{- include "hermes.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if include "hermes.storeTLS" (dict "root" . "store" "postgresql") }}
          {{/*
          `args` replaces the image's CMD, so `postgres` must lead or the entrypoint script
          has no server to exec. The script still runs: it recognises `postgres` as the
          command and does its usual initialisation first.

          The key file permissions are the fiddly part, and were verified on a real kubelet
          rather than reasoned about. Postgres refuses to start if its key is group- or
          world-readable, with one exception since PG11: a root-owned key may be 0640. A
          Secret volume mounts files as root:<fsGroup>, and fsGroup is 999 above, so
          defaultMode 0640 gives root:999 0640 -- which satisfies the root-owned rule while
          staying readable by the postgres user. Confirmed: `SHOW ssl` returns on.
          */}}
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/certs/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/certs/tls.key
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ $name }}
          env:
            # The official image refuses to initialise into a non-empty directory, and
            # every PVC arrives with a lost+found. A subdirectory is the documented way out.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if include "hermes.storeTLS" (dict "root" . "store" "postgresql") }}
            - name: certs
              mountPath: /etc/postgresql/certs
              readOnly: true
            {{- end }}
      {{- if or (not .Values.postgresql.persistence.enabled) (include "hermes.storeTLS" (dict "root" . "store" "postgresql")) }}
      volumes:
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if include "hermes.storeTLS" (dict "root" . "store" "postgresql") }}
        - name: certs
          secret:
            secretName: {{ include "hermes.postgresqlTLSSecret" . }}
            # 0640, not 0600. A Secret volume mounts files owned by root:<fsGroup>, so the
            # postgres user reads this through its group -- 0600 would make the key
            # unreadable to the very process that needs it, and 0644 would make Postgres
            # refuse to start. See the args block above.
            defaultMode: 0640
        {{- end }}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- end }}
{{- end }}
