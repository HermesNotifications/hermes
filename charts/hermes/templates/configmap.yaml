{{- include "hermes.validateEnvironment" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes.configMapName" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
data:
  {{/*
  internal/config/config.go defaults HERMES_ENV to "development" when it is unset, and
  Config.Validate() short-circuits to nil in that environment. A chart that never sets it
  therefore runs every self-hoster in development mode — placeholder secrets accepted,
  plaintext datastores accepted — without ever saying so. Setting it explicitly is the
  point; `hermes.env` defaults to the same value, so nothing changes for an evaluator.

  It goes in the shared ConfigMap rather than per-Deployment env because the migration
  Job, the cleanup CronJob and the stream provisioning Job all call config.MustLoad too,
  and Validate() applies to them identically.
  */}}
  HERMES_ENV: {{ .Values.hermes.env | quote }}
  {{- $natsUrl := include "hermes.natsUrl" . }}
  {{- if $natsUrl }}
  HERMES_NATS_URL: {{ $natsUrl | quote }}
  {{- end }}
  {{- $centrifugoApiUrl := include "hermes.centrifugoApiUrl" . }}
  {{- if $centrifugoApiUrl }}
  HERMES_CENTRIFUGO_API_URL: {{ $centrifugoApiUrl | quote }}
  {{- end }}
  {{- $redisUrl := include "hermes.redisUrl" . }}
  {{- if $redisUrl }}
  HERMES_REDIS_URL: {{ $redisUrl | quote }}
  {{- end }}
  HERMES_EMAIL_PROVIDER: {{ .Values.hermes.email.provider | quote }}
  HERMES_EMAIL_FROM: {{ .Values.hermes.email.from | quote }}
  {{- if eq .Values.hermes.email.provider "smtp" }}
  {{- if .Values.hermes.email.smtp.host }}
  HERMES_EMAIL_SMTP_HOST: {{ .Values.hermes.email.smtp.host | quote }}
  HERMES_EMAIL_SMTP_PORT: {{ .Values.hermes.email.smtp.port | quote }}
  {{- if .Values.hermes.email.smtp.username }}
  HERMES_EMAIL_SMTP_USERNAME: {{ .Values.hermes.email.smtp.username | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.hermes.email.provider "ses" }}
  HERMES_EMAIL_SES_REGION: {{ .Values.hermes.email.ses.region | quote }}
  {{- end }}
  {{- if .Values.hermes.sms.webhookUrl }}
  HERMES_SMS_WEBHOOK_URL: {{ .Values.hermes.sms.webhookUrl | quote }}
  {{- end }}
  HERMES_EVENT_RETENTION_DAYS: {{ .Values.hermes.events.retentionDays | quote }}
  {{- if .Values.observability.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otel.protocol | quote }}
  {{- if .Values.observability.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.observability.resourceAttributes | quote }}
  {{- end }}
  {{- end }}
