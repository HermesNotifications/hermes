{{/*
post-install, not pre-install. This Job has never been able to run as a pre-install hook
and it took installing the chart to find out — twice, with two different symptoms:

  1. It read the release Secret via envFrom. Helm creates a release's regular resources
     only *after* its pre-install hooks finish, so the pod sat in
     CreateContainerConfigError until `helm install` gave up with
     "failed pre-install: timed out waiting for the condition".
  2. With that fixed by hook-scoped copies of the config, the pod started and then failed
     with `lookup hv-postgresql: no such host` — because the bundled Postgres sub-chart is
     also a regular resource, so at pre-install time the database it migrates does not
     exist either. BackoffLimitExceeded, install failed.

The second is not fixable while staying in the pre-install phase: with `postgresql.enabled`
(the chart default and the evaluation posture the owner asked for) there is nothing to
migrate against until the release's resources are applied.

post-install/post-upgrade keeps what the hook was for — a failed migration fails the
`helm` command loudly instead of leaving a half-working install — and works in both
postures. What it gives up is that the services are created at the same time as this Job
rather than after it, so on a first install they will error briefly until the schema
exists. That is the same convergence deploy/k8s/base already relies on for both Jobs, and
the same one ADR 0005 phase 4 names for stream provisioning.

hook-weight is explicit on both Jobs so migrate runs before natsprovision. They are
independent, but an order that merely happens to work is the kind that breaks once and is
never reproducible.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hermes.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "-5"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "hermes.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: migrate
          image: {{ include "hermes.image" (dict "root" . "service" .Values.migration) }}
          imagePullPolicy: IfNotPresent
          args: ["-migrations-path", "/migrations"]
          env:
            {{- if .Values.externalPostgresql.existingSecret }}
            - name: HERMES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret }}
                  key: {{ .Values.externalPostgresql.existingSecretKey }}
            {{- end }}
          envFrom:
            {{- /* Safe to read the release ConfigMap and Secret because this is a
                   post-install hook: both exist by the time it runs. It was not safe as a
                   pre-install hook, which is half of why the phase changed. */}}
            - configMapRef:
                name: {{ include "hermes.configMapName" . }}
            - secretRef:
                name: {{ include "hermes.secretName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
