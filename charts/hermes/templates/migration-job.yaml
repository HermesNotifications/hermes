{{/*
An ordinary tracked resource, deliberately NOT a Helm hook. See ADR 0007, which records
this decision and the measurements behind it. The short version, because the annotations
that are absent here are the kind of thing someone will helpfully "fix":

  * As a PRE-install hook it cannot work. Helm creates a release's regular resources only
    after pre-install hooks finish, so this Job could see neither the release
    ConfigMap/Secret (pod stuck in CreateContainerConfigError, install timed out) nor the
    bundled Postgres it migrates (`lookup hv-postgresql: no such host`). Both observed.
    It has been in this state since the file was written, so a fresh `helm install` of
    this chart had never once run its migrations.

  * As a POST-install hook it deadlocks under `--wait` and `--atomic`. Helm waits for
    every regular resource to become Ready *before* running post-install hooks. The
    services cannot become Ready without the schema and the streams. Measured on this
    chart: `helm install --wait --timeout 4m` failed with `context deadline exceeded`,
    NO Job was ever created, no streams existed, and all nine services were in
    CrashLoopBackOff. `--atomic` additionally rolled the release back and uninstalled it.
    Flux's HelmRelease and ArgoCD's Helm integration both effectively wait, so this is
    the path most self-hosters are on.

As a plain resource the Job is applied alongside everything else and retries until the
datastore is reachable, while the services crash-loop and converge behind it. `--wait`
then blocks on the Deployments, which do become Ready, because this Job is running rather
than queued behind them. `--wait` does not itself wait for Jobs unless you pass
`--wait-for-jobs`.

The revision-scoped name is what makes this safe to re-apply: a Job's pod template is
immutable, so a stable name fails on the second install. Helm prunes the previous
revision's Job on upgrade because it is absent from the new manifest.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hermes.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/name: hermes-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "hermes.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: migrate
          image: {{ include "hermes.image" (dict "root" . "service" .Values.migration) }}
          imagePullPolicy: IfNotPresent
          args: ["-migrations-path", "/migrations"]
          env:
            {{- if .Values.externalPostgresql.existingSecret }}
            - name: HERMES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret }}
                  key: {{ .Values.externalPostgresql.existingSecretKey }}
            {{- end }}
          envFrom:
            {{- /* Safe because this Job is a regular resource, applied in the same pass as
                   the ConfigMap and Secret. It was NOT safe as a pre-install hook, which
                   is half of why this is no longer one. */}}
            - configMapRef:
                name: {{ include "hermes.configMapName" . }}
            - secretRef:
                name: {{ include "hermes.secretName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
