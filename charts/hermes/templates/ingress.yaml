{{- if .Values.ingress.enabled }}
{{- $fullName := include "hermes.fullname" . -}}
{{/*
The API route table. It is a list rather than seven copies of the same eleven lines
because the copies are what rotted: /v1/types and /v1/groups survived the group/type
rename here long after no handler served them, and /v1/templates, /v1/apikeys,
/v1/organizations and /v1/subscriptions were never added at all — those admin endpoints
were unreachable through a chart install.

Order does not matter to Kubernetes: an Ingress with pathType Prefix resolves by longest
match, which is what lets /v1/users and /v1/users/me go to different services. It is kept
in the order below purely so a human diff reads well.

The last two entries are the longest-prefix split deploy/k8s/base/ingress.yaml already
performs and the chart did not. internal/admin serves GET /v1/users (the operator-facing
listing) and internal/userservice serves everything under /v1/users/me. Routing all of
/v1/users to the user service, as this chart did, makes the admin listing unreachable.

scripts/check_helm_render.py checks this table against the `Path:` fields of the huma
operations in internal/{admin,inbox,userservice,send}, in both directions — an endpoint
with no rule and a rule with no endpoint both fail the build.
*/}}
{{- $routes := list
  (dict "path" "/v1/send"          "service" "send"  "port" .Values.send.port)
  (dict "path" "/v1/auth"          "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/notifications" "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/templates"     "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/apikeys"       "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/organizations" "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/subscriptions" "service" "admin" "port" .Values.admin.port)
  (dict "path" "/v1/inbox"         "service" "inbox" "port" .Values.inbox.port)
  (dict "path" "/v1/users/me"      "service" "user"  "port" .Values.user.port)
  (dict "path" "/v1/users"         "service" "admin" "port" .Values.admin.port)
-}}
{{- $apiController := include "hermes.ingressController" . -}}
{{- if and .Values.ingress.rateLimit.enabled (eq $apiController "traefik") }}
{{/*
The same flood bound as the nginx annotations below, expressed the way Traefik expresses it.

Rendered rather than skipped because the annotations below are inert on Traefik: they are
accepted, ignored, and leave an installation that reads as rate limited in every manifest
and is not. `average` is requests per `period`, and sourceCriterion defaults to the client
address, so this is per-IP as the nginx form is.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-ratelimit
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.rps }}
    burst: {{ mul .Values.ingress.rateLimit.rps .Values.ingress.rateLimit.burstMultiplier }}
    period: 1s
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.rateLimit.enabled }}
    {{/*
    Per-IP flood shielding, on the API ingress only. The in-process limiter runs
    after authentication, so an unauthenticated flood costs an HMAC and a Redis
    lookup per request before it is rejected and never reaches a bucket.

    The default rps matches send's per-credential sustained ceiling rather than
    sitting below it: the ingress cannot distinguish an authenticated request from an
    unauthenticated one, so a lower value would make the documented per-credential
    limit unreachable for a legitimate caller behind one egress IP. This bounds a
    flood; it is not a quota.
    */}}
    {{- if eq $apiController "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-ratelimit@kubernetescrd
    {{- else }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.rateLimit.burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.rateLimit.connections | quote }}
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    nginx.ingress.kubernetes.io/limit-conn-status-code: "429"
    {{- end }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          {{- range $routes }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-{{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if or .Values.centrifugo.enabled .Values.externalCentrifugo.ingressServiceName }}
{{- $controller := include "hermes.ingressController" . -}}
{{- if eq $controller "traefik" }}
---
{{/*
Traefik strips the prefix with a Middleware, because it cannot do it the way nginx does.

Traefik v3 removed regex support from Kubernetes Ingress paths, so the nginx form below --
`path: /realtime(/|$)(.*)` with `rewrite-target: /$2` -- produces a route that matches
nothing at all: the path is taken literally, no request ever has that prefix, and /realtime
returns 404 while every other route works. The widget then reports itself disconnected and
falls all the way down the transport ladder to nothing (ADR 0017), with no error anywhere
that names the ingress.

This needs the traefik.io CRDs, which ship with Traefik itself, so a cluster running Traefik
has them by definition.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-realtime-stripprefix
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /realtime
{{- end }}
---
# Realtime ingress for Centrifugo WebSocket connections.
# When using external Centrifugo without ingressServiceName, create your own
# Ingress and Service pointing to your Centrifugo instance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-realtime
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq $controller "traefik" }}
    # The <namespace>-<name>@kubernetescrd form is Traefik's, not Kubernetes': a bare name
    # resolves to nothing and the middleware is skipped without complaint, which would leave
    # Centrifugo receiving /realtime/... and answering 404 on every connection.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-realtime-stripprefix@kubernetescrd
    {{- else }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Required, and its absence is silent. The path below is a regex with two capture groups and
    # rewrite-target refers to the second; without use-regex nginx treats the path as a literal
    # prefix, $2 captures nothing, and every websocket request is rewritten to "/" — so the
    # realtime route simply does not work in a chart install. The kustomize overlays set this;
    # the chart did not. scripts/check_helm_render.py now refuses any rewrite-target containing
    # $ that is not paired with it.
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Load-bearing for the http_stream and sse fallback transports, and pinned rather than
    # left to the default for the same reason use-regex is spelled out above: its absence is
    # silent. Both rungs are a single response the server never finishes writing. With
    # buffering on, nginx holds each publication waiting for a complete response that is not
    # coming, so the connection establishes, the widget reports itself healthy, and
    # notifications arrive late or not at all. ingress-nginx defaults this to "off", so it
    # works today by luck — a cluster-wide ConfigMap enabling buffering would break realtime
    # with nothing in any log to explain it. Websockets are unaffected either way.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          {{- if eq $controller "traefik" }}
          {{/* A plain prefix: the Middleware above does the stripping. ADR 0017 requires
               /realtime to stay a PREFIX so the http_stream and sse fallbacks, which live
               on sub-paths, are reachable -- an Exact match would leave the websocket
               working and both fallbacks 404, which is the worst of the three outcomes
               because it only shows up on a degraded network. */}}
          - path: /realtime
            pathType: Prefix
          {{- else }}
          - path: /realtime(/|$)(.*)
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                {{- if .Values.centrifugo.enabled }}
                name: {{ .Release.Name }}-centrifugo
                {{- else }}
                name: {{ .Values.externalCentrifugo.ingressServiceName }}
                {{- end }}
                port:
                  number: 8000
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
