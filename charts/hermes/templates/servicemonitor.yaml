{{- /*
The Capabilities guard is load-bearing now that observability.enabled defaults to true.
ServiceMonitor is a Prometheus Operator CRD, and rendering one on a cluster that has never
installed the operator fails the whole release with `no matches for kind "ServiceMonitor"` --
so without this, turning telemetry on by default would break every evaluation install that
does not happen to run kube-prometheus-stack.

But a capability check fails in the *other* direction under any renderer that does not report
cluster API versions -- plain `helm template`, and some GitOps render paths. There the guard is
indistinguishable from "the operator is absent", and the failure is silent: no ServiceMonitor,
no scrape, no error, and a dashboard that is simply empty. That is a worse outcome than a loud
install failure, and it is the one you get in the environment that matters most.

Hence `force`. Leave it unset for the capability check; set it true wherever the chart is
rendered without cluster access and the CRDs are known to be present -- which for this repo
means the Argo CD Applications in the GitOps repo.
*/ -}}
{{- $smPossible := or (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.observability.serviceMonitor.force -}}
{{- if and .Values.observability.enabled .Values.observability.serviceMonitor.enabled $smPossible }}
{{- $fullName := include "hermes.fullname" . -}}
{{- $labels := include "hermes.labels" . -}}
{{- range $service := list "admin" "send" "dispatch" "inbox" "user" "worker-email" "worker-sms" "worker-inbox" "worker-events" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}-{{ $service }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-{{ $service }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}

{{- /*
The bundled Redis, when its exporter sidecar is running. templates/redis.yaml adds the
container and a `metrics` port on the Service but nothing scraped it, so enabling
redis.metrics produced an endpoint and no time series.

Kept in this file rather than redis.yaml so every ServiceMonitor in the chart sits behind the
same CRD guard above.
*/ -}}
{{- if and .Values.redis.enabled .Values.redis.metrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}-redis
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
{{- end }}
