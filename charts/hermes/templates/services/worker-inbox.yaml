{{- $svcName := printf "%s-worker-inbox" (include "hermes.fullname" .) -}}
{{- $svcCtx := dict "root" . "service" "worker-inbox" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "hermes.serviceLabels" $svcCtx | nindent 4 }}
spec:
  {{- if not .Values.workerInbox.autoscaling.enabled }}
  replicas: {{ .Values.workerInbox.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hermes.serviceSelectorLabels" $svcCtx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.workerInbox.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hermes.serviceSelectorLabels" $svcCtx | nindent 8 }}
    spec:
      {{- include "hermes.terminationGracePeriod" (dict "root" . "service" "workerInbox") | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      {{- include "hermes.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker-inbox
          image: {{ include "hermes.image" (dict "root" . "service" .Values.workerInbox) }}
          imagePullPolicy: {{ include "hermes.imagePullPolicy" (dict "root" . "service" .Values.workerInbox) }}
          ports:
            - name: http
              containerPort: {{ .Values.workerInbox.port }}
              protocol: TCP
          env:
            - name: HERMES_HTTP_PORT
              value: {{ .Values.workerInbox.port | quote }}
            {{- include "hermes.otelServiceEnv" $svcCtx | nindent 12 }}
            {{- if .Values.hermes.jwt.existingSecret }}
            - name: HERMES_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.jwt.existingSecret }}
                  key: {{ .Values.hermes.jwt.existingSecretKey }}
            {{- end }}
            {{- if .Values.hermes.apiKey.existingSecret }}
            - name: HERMES_API_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.apiKey.existingSecret }}
                  key: {{ .Values.hermes.apiKey.existingSecretKey }}
            {{- end }}
            {{- if .Values.externalPostgresql.existingSecret }}
            - name: HERMES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret }}
                  key: {{ .Values.externalPostgresql.existingSecretKey }}
            {{- end }}
            {{- if .Values.externalNats.existingSecret }}
            - name: HERMES_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalNats.existingSecret }}
                  key: {{ .Values.externalNats.existingSecretKey | default "nats-url" }}
            {{- end }}
            {{- if .Values.externalRedis.existingSecret }}
            - name: HERMES_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.existingSecret }}
                  key: {{ .Values.externalRedis.existingSecretKey }}
            {{- end }}
            {{- if .Values.externalCentrifugo.existingSecret }}
            - name: HERMES_CENTRIFUGO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalCentrifugo.existingSecret }}
                  key: {{ .Values.externalCentrifugo.existingSecretKey }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "hermes.configMapName" . }}
            - secretRef:
                name: {{ include "hermes.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # /healthz fails when this pod's JetStream consumer has work waiting and has settled
            # none of it for HERMES_NATS_CONSUMER_STALL_TIMEOUT (10m). A worker takes no inbound
            # traffic, so readiness cannot express "this pod is not doing its job" — only a
            # restart can act on it, and unacked messages are redelivered.
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            # One, not the default three: shutdown flips /readyz to 503 and then keeps
            # serving for the drain delay, so the pod must leave the Service endpoints on
            # the very next probe. Dependency blips are debounced in-process instead,
            # where the drain flag can bypass the debounce.
            failureThreshold: 1
          resources:
            {{- toYaml .Values.workerInbox.resources | nindent 12 }}
          {{- include "hermes.preStop" . | nindent 10 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "hermes.datastoreCAMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
        {{- include "hermes.datastoreCAVolumes" . | nindent 8 }}
      {{- with .Values.workerInbox.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerInbox.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerInbox.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerInbox.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "hermes.serviceLabels" $svcCtx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.workerInbox.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hermes.serviceSelectorLabels" $svcCtx | nindent 4 }}
{{- if .Values.workerInbox.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "hermes.serviceLabels" $svcCtx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svcName }}
  minReplicas: {{ .Values.workerInbox.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.workerInbox.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.workerInbox.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.workerInbox.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.workerInbox.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
