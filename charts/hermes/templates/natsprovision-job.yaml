{{- if .Values.natsProvision.enabled }}
{{/*
ADR 0005 phase 4. Without this Job a chart install crash-loops six services at boot.

PR #71 replaced MustSetupStreams with messaging.EnsureStreams, which *verifies* streams and
cannot create them (internal/messaging/provision.go). Stream creation moved to
cmd/natsprovision. deploy/k8s/base got nats-provision-job.yaml; this chart got nothing, so
send, dispatch and all four workers exited at startup with
"stream NOTIFICATIONS is not available ... (has cmd/natsprovision run?)".

Modelled on migration-job.yaml because it is the same kind of thing: streams are schema.
An ordinary tracked resource, deliberately NOT a Helm hook, for exactly the reasons set
out there and recorded in ADR 0008 — a pre-install hook cannot see the bundled NATS it
provisions, and a post-install hook never runs at all under `--wait`/`--atomic` because
Helm is blocked waiting for the very services this Job unblocks.

Re-running is safe: SetupStreams is CreateOrUpdate, so this is idempotent by construction.
That is what makes running it on every install and upgrade the intended usage rather than
something to guard.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hermes.fullname" . }}-natsprovision-{{ .Release.Revision }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    {{- /* app.kubernetes.io/name is messaging.ProvisionerService here too, so the render
           gate can find this Job from its metadata as well as its pod template. */}}
    app.kubernetes.io/name: hermes-natsprovision
    app.kubernetes.io/component: provisioning
spec:
  backoffLimit: {{ .Values.natsProvision.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "hermes.labels" . | nindent 8 }}
        {{- /* app.kubernetes.io/name is messaging.ProvisionerService: the identity
               cmd/natsprovision presents on the bus, and what the render gate keys on
               to find this Job. */}}
        app.kubernetes.io/name: hermes-natsprovision
        app.kubernetes.io/component: provisioning
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      {{- include "hermes.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: natsprovision
          image: {{ include "hermes.image" (dict "root" . "service" .Values.natsProvision) }}
          imagePullPolicy: {{ include "hermes.imagePullPolicy" (dict "root" . "service" .Values.natsProvision) }}
          {{- if .Values.externalNats.existingSecret }}
          env:
            - name: HERMES_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalNats.existingSecret }}
                  key: {{ .Values.externalNats.existingSecretKey | default "nats-url" }}
          {{- end }}
          envFrom:
            {{- /* Safe because this Job is a regular resource, applied in the same pass as
                   the ConfigMap and Secret. */}}
            - configMapRef:
                name: {{ include "hermes.configMapName" . }}
            - secretRef:
                name: {{ include "hermes.secretName" . }}
          resources:
            {{- toYaml .Values.natsProvision.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}
