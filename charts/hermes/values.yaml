# ---------------------------------------------------------------------------
# Admin Portal (web UI)
# ---------------------------------------------------------------------------

# -- Admin Portal web application
adminPortal:
  # -- Deploy the admin portal
  enabled: false
  image:
    repository: hermes-admin-portal
    tag: ""
  # -- Container port
  port: 3000
  replicas: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Database migration job
# ---------------------------------------------------------------------------

# -- Database migration job configuration
migration:
  image:
    # -- Migration job image repository
    repository: hermes-migrate
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed
  backoffLimit: 3
  # -- Resource requests and limits for the migration job
  resources: {}

# ---------------------------------------------------------------------------
# NATS stream provisioning job
# ---------------------------------------------------------------------------

# -- JetStream stream provisioning job (ADR 0005 phase 4).
# Declares the NOTIFICATIONS, DELIVERY, EVENTS and DLQ streams before the services start.
# Send, dispatch and all four workers verify their streams at boot and exit non-zero if one
# is missing, so disabling this without provisioning streams some other way crash-loops
# six deployments. Idempotent — SetupStreams is CreateOrUpdate.
natsProvision:
  # -- Run the stream provisioning job. Disable only if you provision JetStream streams
  # out of band (e.g. cmd/natsprovision run by your own pipeline).
  enabled: true
  image:
    # -- Provisioning job image repository
    repository: hermes-natsprovision
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed
  backoffLimit: 6
  # -- Resource requests and limits for the provisioning job
  resources: {}

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------

# -- Ingress configuration
ingress:
  # -- Enable ingress resource creation
  enabled: true
  # -- Ingress class name (e.g. nginx, traefik)
  className: ""
  # -- Additional ingress annotations
  annotations: {}
  # -- TLS configuration
  tls: []
  #  - secretName: hermes-tls
  #    hosts:
  #      - hermes.example.com

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

# -- Observability / telemetry configuration
observability:
  # -- Enable OpenTelemetry export environment for Hermes services
  enabled: false
  otel:
    # -- OTLP endpoint for the OpenTelemetry Collector
    endpoint: "http://otel-collector-opentelemetry-collector.observability.svc:4317"
    # -- OTLP protocol used by Hermes services
    protocol: "grpc"
  # -- Comma-separated OTEL_RESOURCE_ATTRIBUTES appended at SDK startup
  resourceAttributes: ""
  serviceMonitor:
    # -- Emit Prometheus Operator ServiceMonitor resources for Hermes services.
    # Defaults to true to preserve the old observability.enabled=true behavior.
    enabled: true

# ---------------------------------------------------------------------------
# Network Policy
# ---------------------------------------------------------------------------

# -- Network policy configuration
networkPolicy:
  # -- Enable network policies to restrict inter-service traffic
  enabled: false

# ---------------------------------------------------------------------------
# External services (when sub-charts are disabled)
# ---------------------------------------------------------------------------

# -- External PostgreSQL connection (used when postgresql.enabled=false)
externalPostgresql:
  # -- Full connection URL (e.g. postgres://user:pass@host:5432/hermes?sslmode=require)
  url: ""
  # -- Name of an existing secret containing the database URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_DATABASE_URL"

# -- External NATS connection (used when nats.enabled=false)
externalNats:
  # -- NATS connection URL
  url: ""
  # -- Name of an existing secret containing the NATS URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_NATS_URL"

# -- External Redis connection (used when redis.enabled=false)
externalRedis:
  # -- Redis connection URL
  url: ""
  # -- Name of an existing secret containing the Redis URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_REDIS_URL"

# -- External Centrifugo connection (used when centrifugo.enabled=false)
externalCentrifugo:
  # -- Centrifugo HTTP API URL
  apiUrl: ""
  # -- Name of an existing secret containing the Centrifugo API key
  existingSecret: ""
  # -- Key within the existing secret that holds the API key
  existingSecretKey: "centrifugo-api-key"
  # -- Name of the Kubernetes Service to route realtime ingress traffic to when using external Centrifugo.
  # You must create this Service yourself (e.g., an ExternalName or headless Service pointing to your Centrifugo instance).
  ingressServiceName: ""

# ---------------------------------------------------------------------------
# Sub-chart overrides
# ---------------------------------------------------------------------------

# -- Bitnami PostgreSQL sub-chart configuration
postgresql:
  enabled: true
  auth:
    username: hermes
    password: hermes
    database: hermes

# -- Bitnami Redis sub-chart configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# -- NATS sub-chart configuration
nats:
  enabled: true
  # Helm merges the parent chart's `global` into every sub-chart, and the NATS chart reads
  # `global.image.registry` — the same key Hermes uses for its own images. Left alone, the
  # bundled bus renders as ghcr.io/hermesnotifications/nats:2.10.26-alpine and two more
  # images nobody publishes, and every NATS pod is ImagePullBackOff. `helm template` is
  # perfectly happy with it. Pinning each registry explicitly overrides the inherited
  # global, because a per-image registry beats the global one in that chart.
  container:
    image:
      registry: docker.io
  reloader:
    image:
      registry: docker.io
  promExporter:
    image:
      registry: docker.io
  natsBox:
    container:
      image:
        registry: docker.io
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    cluster:
      enabled: true
      replicas: 3

# -- Centrifugo sub-chart configuration
centrifugo:
  enabled: true
  config:
    engine:
      type: memory
