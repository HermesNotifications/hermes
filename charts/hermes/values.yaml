    targetCPUUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# -- Dispatch service
dispatch:
  replicas: 1
  image:
    repository: hermes-dispatch
    tag: ""
  port: 8081
  # -- Size of the dispatch worker pool (HERMES_DISPATCH_CONCURRENCY): how many
  # notification.send messages are processed in parallel by one replica.
  #
  # This is the chart's single largest throughput lever, and it was not settable at all before
  # -- neither this nor the pool below appeared anywhere in the chart, so every documented
  # install ran at 8 whatever the hardware. cmd/dispatchbench, run inside a cluster against
  # Longhorn-backed Postgres:
  #
  #     workers   msgs/s
  #           8    2,100   <- this default
  #          16    3,511
  #          32    5,534
  #          64    7,907
  #
  # 3.8x from configuration alone. Dispatch is I/O-bound, not CPU-bound: Postgres amortises
  # concurrent commits into shared WAL flushes and the amortisation scales with how many are in
  # flight, so 8 workers simply do not give it enough to work with. The ceiling is the
  # database's appetite for concurrency, not this pod's cores.
  #
  # Raising it costs Postgres connections, one per worker plus the headroom below. Read
  # `database.maxConns` before going past 16 -- on the bundled evaluation Postgres the chart
  # will refuse an install whose fleet cannot fit in max_connections.
  concurrency: 8
  database:
    # -- Postgres pool size for dispatch (HERMES_DATABASE_MAX_CONNS). Empty derives it from
    # `concurrency`, which is the point: leave it empty.
    #
    # These two are one knob with two halves, and getting that wrong is silent. cmd/dispatch
    # clamps the worker pool to the pool size at startup (dispatch.ClampWorkersToPool -- a
    # worker holds a connection for as long as it is processing, so workers beyond the pool
    # only add contention), which means raising `concurrency` against an unchanged pool
    # changes throughput by exactly nothing and reports it in a single startup warning.
    # Deriving the pool is what makes that trap unreachable; setting this below `concurrency`
    # by hand is refused at render time rather than clamped at runtime.
    #
    # The derived value is `concurrency` + 2, not `concurrency`. /readyz pings this pool
    # (bootstrap.PostgresCheck), so a pool sized exactly to the workers makes the probe queue
    # behind them at precisely the load the tuning was for -- readinessProbe.failureThreshold
    # is 1 here, so one queued ping takes the pod out of the Service endpoints. Two spare
    # connections keep probes and pool housekeeping off the workers' path.
    #
    # At the default concurrency of 8 this is 10, which is database.DefaultPoolConfig.MaxConns
    # to the connection: rendering defaults deploys what the chart has always deployed.
    #
    # Note that `pool_max_conns` in HERMES_DATABASE_URL wins over this (see
    # database.NewPoolWithConfig, whose precedence exists for cmd/dispatchbench), and that URL
    # is shared by every service. The chart refuses combinations where the URL would silently
    # override what you set here.
    maxConns: ""
  resources:
    # Non-empty on purpose. With no requests the scheduler packs blind and these pods are the
    # first evicted under node pressure -- precisely the churn this is meant to survive -- and
    # an HPA measuring a resource its target declares no request for reports
    # ScalingActive=False / FailedGetResourceMetric and silently never scales. Matches the
    # kustomize base; raise for production traffic.
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # Memory only. A CPU limit throttles latency-sensitive work at exactly the moment it
      # matters; see deploy/k8s/overlays/production/patches/resources.yaml.
      memory: 256Mi
  podDisruptionBudget:
    # -- Protect this service during voluntary disruptions (node drains, cluster upgrades).
    # Off by default so a single-replica evaluation install is not blocked from draining.
    enabled: false
    # maxUnavailable rather than minAvailable: expressed as a ceiling on disruptions it always
    # permits at least one eviction, so it paces a node drain instead of wedging it at
    # replicas: 1. See deploy/k8s/overlays/production/pdb/README.md.
    maxUnavailable: 1
  # -- 60, not the 30s shared default: this service drains a NATS consumer on the way out
  # (5s drain delay + up to 30s for in-flight handlers + 15s HTTP shutdown = 50s).
  terminationGracePeriodSeconds: 60
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

