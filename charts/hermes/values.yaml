# -- Global configuration shared across all services
global:
  image:
    # -- Container image registry
    registry: ghcr.io/hermesnotifications
    # -- Global image tag override (defaults to Chart appVersion)
    tag: ""
    # -- Image pull policy for every Hermes image, overridable per service.
    #
    # IfNotPresent is right for the immutable semver tags this chart defaults to, and wrong
    # in two cases that are easy to hit and hard to diagnose, because both fail by silently
    # doing nothing: tracking a mutable tag (the node keeps its stale copy forever), and
    # side-loading an image into a kind/k3d node, where Always would try the registry and
    # fail. Set it deliberately for either.
    pullPolicy: IfNotPresent
  # -- Secrets used to pull every Hermes image, by name.
  #
  # Required for a private registry or an air-gapped mirror, which is most regulated
  # environments -- and also for this project's own images before their GHCR packages are
  # made public. Create the secret yourself (`kubectl create secret docker-registry`) and
  # name it here; the chart does not manufacture registry credentials.
  #
  # Reaches every workload this chart owns, including the bundled Postgres and Redis (which
  # pull from Docker Hub and so need it just as much) and the two `helm test` pods. The
  # Centrifugo sub-chart reads this same key and picks it up too.
  #
  # The NATS sub-chart is the exception: it spells the same idea `global.image.pullSecretNames`,
  # so set BOTH if you enable the bundled bus behind a private registry. A parent chart cannot
  # template a sub-chart's values, so this cannot be wired up for you:
  #
  #   global:
  #     imagePullSecrets: [my-registry-credentials]     # Hermes, Postgres, Redis, Centrifugo
  #     image:
  #       pullSecretNames: [my-registry-credentials]    # the NATS sub-chart
  imagePullSecrets: []
  #  - my-registry-credentials
  # -- Primary domain for ingress routing
  domain: ""

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Hermes application-level configuration
hermes:
  # -- Deployment environment, published to every service as HERMES_ENV.
  #
  # `development` is the evaluation posture and the chart default: internal/config
  # tolerates plaintext Postgres/Redis/NATS and the built-in placeholder secrets, which is
  # what the bundled sub-charts provide. Only the literal string "development" is relaxed —
  # any other value, including a typo, takes the strict path in Config.Validate().
  #
  # `production` requires TLS on all three datastores and real secrets, so it is only
  # usable with the external* connection settings below. The chart refuses to render a
  # production install that still uses a bundled sub-chart rather than letting it
  # crash-loop; see NOTES.txt.
  env: "development"

  # -- Name of an existing Kubernetes Secret containing all sensitive values.
  # When set, the chart will not create its own Secret.
  existingSecret: ""

  # Graceful shutdown. These values and the HERMES_SHUTDOWN_* / HERMES_NATS_DRAIN_TIMEOUT
  # environment variables form one budget: the sum of the drain steps must fit inside the
  # grace period, or the kubelet SIGKILLs the process partway through — which is worse than
  # not draining, because it has already stopped accepting work and now abandons what it was
  # finishing. scripts/check_shutdown_budget.py enforces the arithmetic over the render.
  shutdown:
    # -- Default grace period, in seconds. Services that drain a NATS consumer override this
    # to 60 (5s drain delay + up to 30s for in-flight handlers + 15s HTTP shutdown = 50s).
    # The API-only services need 5 + 15 = 20 and so fit comfortably in 30.
    terminationGracePeriodSeconds: 30
    # -- Seconds to sleep before SIGTERM, via a preStop SleepAction.
    #
    # Zero (the default) disables it, because SleepAction needs Kubernetes 1.30+ and rendering
    # it on an older cluster is rejected. It is *belt and braces only*: every Hermes image is
    # FROM scratch, so a `preStop: exec` hook has no shell to run `sleep` in, and the drain
    # delay that actually matters runs in-process via HERMES_SHUTDOWN_DRAIN_DELAY. Raising
    # this to 5 on a new enough cluster closes the endpoint-propagation race a little tighter.
    preStopSleepSeconds: 0

  jwt:
    # -- HMAC secret used to verify user JWTs (required)
    secret: ""
    # -- Use an existing secret for the JWT secret instead of hermes.jwt.secret
    existingSecret: ""
    # -- Key within the existing secret that holds the JWT secret
    existingSecretKey: "HERMES_JWT_SECRET"

  apiKey:
    # -- HMAC secret used for API key hashing (required)
    hmacSecret: ""
    # -- Use an existing secret for the API key HMAC secret
    existingSecret: ""
    # -- Key within the existing secret
    existingSecretKey: "HERMES_API_KEY_HMAC_SECRET"

  centrifugo:
    # -- API key for authenticating with Centrifugo
    apiKey: ""

  email:
    # -- Email delivery provider: smtp or ses
    provider: "smtp"
    # -- Default sender address
    from: "noreply@example.com"
    smtp:
      # -- SMTP server hostname
      host: ""
      # -- SMTP server port
      port: 587
      # -- SMTP username
      username: ""
      # -- SMTP password (stored in Secret)
      password: ""
    ses:
      # -- AWS region for SES
      region: "us-east-1"

  sms:
    # -- Webhook URL for SMS delivery
    webhookUrl: ""

  events:
    # -- Number of days to retain notification events
    retentionDays: 90

  nats:
    # -- Replicas per JetStream work stream (HERMES_NATS_STREAM_REPLICAS).
    #
    # Empty derives it from the bundled cluster size, which is the sane default and was not
    # what happened before: the built-in default is 1, so a three-node bundled cluster carried
    # single-replica streams and losing one node stopped the pipeline. Nothing surfaced that
    # -- the streams exist and the cluster reports healthy right up until a node goes away.
    #
    # Set explicitly only for an external bus, where the chart cannot know the cluster size.
    # It must not exceed the number of servers, or stream creation fails outright.
    streamReplicas: ""
    # -- Permit changing the replication factor of streams that ALREADY EXIST.
    #
    # Needed exactly once, when raising an existing installation's replica count -- most
    # likely upgrading a bundled three-node bus that was provisioned at R1 before the chart
    # derived this. Turn it on, let one upgrade run, turn it off again.
    #
    # Off by default because changing a replication factor migrates the whole stream between
    # peers. That is a maintenance operation on live data, not a config change, and the
    # provisioner refuses it as a deploy-time side effect (ADR 0015). Leaving this off is what
    # makes an unintended change fail loudly at provisioning rather than quietly move data
    # while a rollout is in flight.
    #
    # Leaving it ON permanently is the thing to avoid: it turns every future replica change
    # into something a routine `helm upgrade` can trigger.
    streamReplicasAllowChange: false

  cleanup:
    # -- Enable periodic cleanup of expired events
    enabled: false
    # -- Cron schedule for cleanup job
    schedule: "0 3 * * *"

  # -- First API key, created at install time.
  #
  # Creating an API key requires an API key -- POST /v1/apikeys demands apikeys:manage -- so
  # without this a clean install produces a healthy cluster you cannot make a single
  # authenticated call against. Turning it off leaves you no supported way to get a first
  # credential short of writing an api_keys row by hand.
  #
  # Read it after installing:
  #
  #   kubectl -n <namespace> get secret <release>-hermes-bootstrap \
  #     -o jsonpath='{.data.HERMES_API_KEY}' | base64 -d
  #
  # It carries every permission, including apikeys:manage -- it has to, or it could not mint
  # the narrower key meant to replace it. Trade it for a scoped key and revoke it.
  bootstrap:
    # -- Create the first API key
    enabled: true
    # -- Name of the Secret to write. Defaults to <release>-hermes-bootstrap.
    #
    # The Secret is deliberately NOT tracked by Helm: `helm uninstall` leaves it, so a
    # reinstall against a surviving database re-adopts the same key instead of issuing a new
    # one and invalidating every place the old one was pasted.
    secretName: ""
    # -- Read the key from a Secret you manage instead of creating one.
    #
    # For clusters whose policy forbids workloads creating Secrets. Supply the key via ESO,
    # Vault, SOPS or by hand; the Job then only ensures the database row, and the chart
    # renders no ServiceAccount and no RBAC at all.
    existingSecret: ""
    # -- Key within existingSecret holding the raw API key
    existingSecretKey: HERMES_API_KEY
    # -- Label stored on the api_keys row
    keyName: "Bootstrap"
    # -- Port the Kubernetes API server listens on, for the networkPolicy egress rule.
    #
    # 443 on a managed control plane (EKS, GKE, AKS); 6443 on k3s, kind, k3d and RKE. Only
    # matters when networkPolicy.enabled is true, and getting it wrong there costs a Job that
    # hangs until its deadline rather than one that fails with something readable.
    apiServerPort: 443
    image:
      # -- Bootstrap job image repository
      repository: hermes-bootstrap
      # -- Image tag override
      tag: ""
    # -- Retries before the Job is marked failed. 6 for the same reason migration uses 6:
    # it is applied in the same pass as the database and the migration that creates
    # api_keys, so on a first install it retries while both catch up.
    backoffLimit: 6
    # -- Resource requests and limits for the bootstrap job
    resources: {}

# ---------------------------------------------------------------------------
# Per-service configuration
# ---------------------------------------------------------------------------

# -- Admin API service
admin:
  # -- Number of replicas
  replicas: 1
  image:
    # -- Image repository (appended to global.image.registry)
    repository: hermes-admin
    # -- Image tag override
    tag: ""
  # -- Container port
  port: 8080
  # -- Per-replica HTTP rate limit, keyed by API key. Leave burst/perSecond
  # empty to keep the service default (1000 burst, 500/s). Enforcement is per
  # replica, so the cluster ceiling is these numbers times `replicas` — size
  # them per pod, not per fleet.
  rateLimit:
    enabled: true
    burst: ""
    perSecond: ""
  # -- Resource requests and limits
  resources:
    # Non-empty on purpose. With no requests the scheduler packs blind and these pods are the
    # first evicted under node pressure -- precisely the churn this is meant to survive -- and
    # an HPA measuring a resource its target declares no request for reports
    # ScalingActive=False / FailedGetResourceMetric and silently never scales. Matches the
    # kustomize base; raise for production traffic.
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # Memory only. A CPU limit throttles latency-sensitive work at exactly the moment it
      # matters; see deploy/k8s/overlays/production/patches/resources.yaml.
      memory: 256Mi
  podDisruptionBudget:
    # -- Protect this service during voluntary disruptions (node drains, cluster upgrades).
    # Off by default so a single-replica evaluation install is not blocked from draining.
    enabled: false
    # maxUnavailable rather than minAvailable: expressed as a ceiling on disruptions it always
    # permits at least one eviction, so it paces a node drain instead of wedging it at
    # replicas: 1. See deploy/k8s/overlays/production/pdb/README.md.
    maxUnavailable: 1
  # -- Horizontal pod autoscaler configuration
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # -- Additional pod annotations
  podAnnotations: {}
  # -- Node selector constraints
  nodeSelector: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Topology spread constraints
  topologySpreadConstraints: []

