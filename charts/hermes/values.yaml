    # Non-empty on purpose. With no requests the scheduler packs blind and these pods are the
    # first evicted under node pressure -- precisely the churn this is meant to survive -- and
    # an HPA measuring a resource its target declares no request for reports
    # ScalingActive=False / FailedGetResourceMetric and silently never scales. Matches the
    # kustomize base; raise for production traffic.
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # Memory only. A CPU limit throttles latency-sensitive work at exactly the moment it
      # matters; see deploy/k8s/overlays/production/patches/resources.yaml.
      memory: 256Mi
  podDisruptionBudget:
    # -- Protect this service during voluntary disruptions (node drains, cluster upgrades).
    # Off by default so a single-replica evaluation install is not blocked from draining.
    enabled: false
    # maxUnavailable rather than minAvailable: expressed as a ceiling on disruptions it always
    # permits at least one eviction, so it paces a node drain instead of wedging it at
    # replicas: 1. See deploy/k8s/overlays/production/pdb/README.md.
    maxUnavailable: 1
  # -- 60, not the 30s shared default: this service drains a NATS consumer on the way out
  # (5s drain delay + up to 30s for in-flight handlers + 15s HTTP shutdown = 50s).
  terminationGracePeriodSeconds: 60
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Admin Portal (web UI)
# ---------------------------------------------------------------------------

# -- Admin Portal web application.
# NOTE: no hermes-admin-portal image is published, and this repository contains no
# Dockerfile that could build one — web/admin is a Next.js app, the Tiltfile runs it as a
# local pnpm process, and .github/workflows/cd.yml builds Go services only. Enabling this
# without overriding image.repository to an image you built yourself is refused at render
# time rather than left to become an ImagePullBackOff.
adminPortal:
  # -- Deploy the admin portal. Requires adminPortal.image.repository to point at your own
  # image; see the note above.
  enabled: false
  image:
    repository: hermes-admin-portal
    tag: ""
  # -- Container port
  port: 3000
  replicas: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Database migration job
# ---------------------------------------------------------------------------

# -- Database migration job configuration
migration:
  image:
    # -- Migration job image repository
    repository: hermes-migrate
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed.
  # 6, not 3: the Job is applied in the same pass as the database it migrates, so on a
  # first install it retries while Postgres starts. Kubernetes backs off 10s, 20s, 40s...
  # between attempts, so 3 gave roughly 70 seconds — less than a bundled Postgres takes to
  # accept connections.
  backoffLimit: 6
  # -- Resource requests and limits for the migration job
  resources: {}

# ---------------------------------------------------------------------------
# NATS stream provisioning job
# ---------------------------------------------------------------------------

# -- JetStream stream provisioning job (ADR 0005 phase 4).
# Declares the NOTIFICATIONS, DELIVERY, EVENTS and DLQ streams. Send, dispatch and all four
# workers verify their streams at boot and exit non-zero if one is missing, so disabling
# this without provisioning streams some other way crash-loops six deployments.
# Idempotent — SetupStreams is CreateOrUpdate.
#
# This Job and the migration Job are ordinary resources, NOT Helm hooks (ADR 0008). Neither
# hook phase works: pre-install runs before the bundled datastores exist, and post-install
# never runs at all under `--wait`/`--atomic` because Helm is blocked waiting for the very
# services these Jobs unblock. As plain resources they run alongside the services, which
# crash-loop for about a minute and then converge.
#
# Practical consequence for your install command:
#   * `--wait` and `--atomic` work, and are recommended. A flagless `helm install` returns
#     before these Jobs have necessarily succeeded, so it cannot fail on a failed migration.
#   * On `helm upgrade`, add `--wait-for-jobs` — `--wait` alone does not wait for Jobs, and
#     on an upgrade the services are already Ready so it can return too early.
natsProvision:
  # -- Run the stream provisioning job. Disable only if you provision JetStream streams
  # out of band (e.g. cmd/natsprovision run by your own pipeline).
  enabled: true
  image:
    # -- Provisioning job image repository
    repository: hermes-natsprovision
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed
  backoffLimit: 6
  # -- Resource requests and limits for the provisioning job
  resources: {}

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# -- Deployment-wide rate limiting. The per-credential rate lives on each
# service's own `rateLimit` block, because each service is its own Deployment;
# these settings describe the installation as a whole.
rateLimit:
  # -- Per-source-address bound applied BEFORE authentication, inside the Go
  # services. Unlike the nginx ingress annotations below it works on every
  # ingress controller, and on none at all — which matters because the
  # in-process credential limiter runs *after* auth and so cannot see an
  # unauthenticated flood at all. This is a flood bound, not a quota. Empty
  # burst/perSecond keeps each service's compiled-in default (send and admin
  # default to their per-credential ceiling; inbox and user default well above
  # their per-user rate, because many users share one NAT).
  # OFF by default, and deliberately so: behind an ingress controller every request
  # carries the controller's pod IP unless trustedProxyCIDRs is set, which collapses the
  # whole fleet into one bucket — an outage delivered by the feature meant to prevent
  # one. Enable it together with trustedProxyCIDRs below. Services log a warning at
  # startup if you enable it without them.
  perIP:
    enabled: false
    burst: ""
    perSecond: ""
  # -- Proxies whose `X-Forwarded-For` may be believed, as CIDRs or bare IPs.
  # EMPTY MEANS TRUST NOTHING, and per-IP limiting then keys on the address of
  # the immediate peer — which behind an ingress controller is the controller
  # itself, collapsing every caller into one bucket. Set this to your ingress
  # controller's pod CIDR to get real client addresses. Do not set it to
  # 0.0.0.0/0: the header is caller-supplied, so trusting every peer lets anyone
  # choose their own bucket and escape the limit entirely.
  trustedProxyCIDRs: []
  #  - 10.42.0.0/16
  # -- Per-credential token buckets held in memory per replica. Empty keeps the
  # built-in 50,000.
  #
  # The number to size against is DISTINCT CALLERS ACTIVE IN ANY 30-MINUTE WINDOW,
  # which has nothing to do with requests per second. For send and admin that is API
  # keys, in the hundreds. For inbox and user it is *users*, so an install where more
  # than 50,000 people open their inbox in half an hour exceeds it.
  #
  # Exceeding it is not an outage: callers who do not fit are admitted without a
  # bucket rather than refused, so the limit simply stops being enforced for them
  # (ADR 0024). Before that ADR they shared one bucket and were refused 429 for each
  # other's traffic -- a 100k-connection run produced 6,705 of those in four minutes.
  #
  # Watch hermes_http_rate_limit_decisions_total{decision="overflow_admitted"}. Raise
  # this if it is non-zero and you want the limit applied to everyone; each bucket is
  # a few dozen bytes.
  maxEntries: ""
  # -- Cluster-wide per-credential limiting. With this off, each replica enforces
  # the configured rate independently and the cluster-wide ceiling is that rate
  # times the replica count. With it on, the admission check runs in Redis
  # (GCRA, one atomic Lua round trip) and the configured rate IS the cluster-wide
  # ceiling. Costs one Redis round trip per authenticated request, on a path that
  # already makes one or two. If Redis cannot answer within 100ms the request is
  # decided from the replica's local bucket instead, so an outage degrades to the
  # per-replica behaviour rather than failing requests or dropping the limit.
  # Requires Redis. Off by default because it lowers the effective throughput a
  # multi-replica deployment gets today, which should be an opt-in change.
  distributed:
    enabled: false

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------

# -- Ingress configuration
ingress:
  # -- Enable ingress resource creation
  enabled: true
  # -- Ingress class name (e.g. nginx, traefik)
  className: ""
  # -- Which controller's dialect to emit. Inferred from className; set only when your class
  # is named something the inference cannot see through (`traefik-internal`, `nginx-public`).
  #
  # This is not cosmetic. The realtime route has to strip `/realtime` before Centrifugo sees
  # it, and the two controllers cannot express that the same way: nginx uses a regex path
  # with rewrite-target, and Traefik v3 removed regex from Ingress paths, so the nginx form
  # matches nothing at all there. Getting this wrong gives you a working API and a realtime
  # endpoint that 404s, with nothing in any log naming the ingress.
  #
  # One of: "" (infer), "nginx", "traefik". Anything unrecognised is treated as nginx, which
  # is what the chart emitted before this existed.
  controller: ""
  # -- Additional ingress annotations
  annotations: {}
  # -- Per-IP flood shielding on the API ingress (nginx ingress controller only;
  # other controllers ignore these annotations). Deliberately NOT applied to the
  # realtime ingress, where connections are long-lived WebSockets and a per-IP
  # connection cap would count concurrent users behind a shared NAT rather than
  # abuse. `rps` defaults to send's per-credential ceiling so it bounds floods
  # without making the documented API limit unreachable — see
  # docs/configuration.md#http-rate-limiting.
  rateLimit:
    enabled: true
    rps: 2000
    burstMultiplier: 5
    connections: 500
  # -- TLS configuration
  tls: []
  #  - secretName: hermes-tls
  #    hosts:
  #      - hermes.example.com

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

# -- Observability / telemetry configuration
observability:
  # -- Enable OpenTelemetry export environment for Hermes services.
  #
  # On by default. It was off, and not as a sizing decision: `resource.WithProcess()` includes
  # a process-owner detector that calls `os/user.Current()`, which cannot work in a
  # CGO-disabled distroless image, so every service crash-looped on
  #
  #   observability init failed: build resource: error detecting resource:
  #   user: Current requires cgo or $USER set in environment
  #
  # The workaround was `enabled: false`, and it held long enough to become the default. The
  # cost of that shows up in docs/loadtest/websocket-scale-2026-08.md: the entire 250,000
  # connection exercise ran with Hermes telemetry off, so every figure in it came from
  # kubeletstats and hand-run curl, with no Hermes spans or metrics for the window at all.
  #
  # internal/observability/otel.go:buildResource now spells out WithProcess() minus
  # WithProcessOwner(), so the crash is gone and there is no longer a reason to ship dark.
  # Exporting to an endpoint that does not exist is a no-op, not an error — Init returns
  # early when OTEL_EXPORTER_OTLP_ENDPOINT is unset.
  enabled: true
  otel:
    # -- OTLP endpoint for the OpenTelemetry Collector
    endpoint: "http://otel-collector-opentelemetry-collector.observability.svc:4317"
    # -- OTLP protocol used by Hermes services
    protocol: "grpc"
  # -- Comma-separated OTEL_RESOURCE_ATTRIBUTES appended at SDK startup
  resourceAttributes: ""
  serviceMonitor:
    # -- Emit Prometheus Operator ServiceMonitor resources for Hermes services.
    # Defaults to true to preserve the old observability.enabled=true behavior.
    enabled: true
    # -- Render ServiceMonitors even when the renderer cannot see the CRD.
    #
    # templates/servicemonitor.yaml normally checks `.Capabilities.APIVersions` so an
    # evaluation install on a cluster with no Prometheus Operator does not fail with
    # `no matches for kind "ServiceMonitor"`. That check needs cluster access: plain
    # `helm template`, and GitOps renderers that do not pass --api-versions, report no
    # capabilities at all and the guard silently drops every ServiceMonitor. No error, no
    # scrape, an empty dashboard.
    #
    # Set true where the chart is rendered without a cluster and you know the CRDs exist.
    force: false
  # -- net/http/pprof on a dedicated port, for every Hermes service.
  #
  # Off by default for two reasons, both real. The endpoint is unauthenticated and exposes the
  # process command line and every goroutine stack; and the block/mutex profiles below perturb
  # what they measure, so a run with them on is not a run whose latency numbers you should
  # quote. Turn it on to investigate, not to leave on.
  #
  # The port is deliberately absent from every Service, so reaching it takes
  # `kubectl port-forward deploy/hermes-<service> 6060:6060`. Images are FROM scratch with no
  # shell, so analyse locally: `go tool pprof bin/<service>/service http://localhost:6060/...`.
  #
  # See docs/observability/runbooks/high-latency.md for which profile to pull, and why the CPU
  # one is usually not it.
  profiling:
    enabled: false
    port: 6060
    # -- Sample one blocking event per this many nanoseconds spent blocked. 0 disables.
    # 10000 (10µs) is a reasonable on; 1 records every event and is genuinely expensive.
    #
    # This is the profile worth having here. Dispatch caps out waiting on Postgres commit
    # rather than on CPU, and a CPU profile of a process parked in pgx shows an idle process.
    blockProfileRate: 10000
    # -- Sample 1 in N mutex contention events. 0 disables; 5 is a reasonable on.
    mutexProfileFraction: 5

# ---------------------------------------------------------------------------
# Synthetic prober
# ---------------------------------------------------------------------------

# -- Continuously measures the pipeline the way a user experiences it: from POST /v1/send
# returning to the notification frame arriving on a websocket.
#
# Every latency Hermes emits today is per-hop, and none of them -- alone or summed -- answers
# "did it arrive, and how long did it take". That number has existed only inside k6, during
# load tests, and it took four defect fixes to make real; three of those had it evaluating zero
# samples while reporting a green threshold. This runs the same measurement continuously.
#
# It is the only signal here that fails when realtime is broken in the ways that are otherwise
# silent: a Centrifugo on the memory engine behind two replicas, an origin rule refusing every
# browser, a channel nobody is subscribed to, a wedged consumer. Every one of those leaves the
# HTTP API answering 200.
#
# Off by default. It needs an API key you create, and each probe writes a real notification row
# (30s = 2,880/day), so it is opt-in rather than something an evaluation install starts doing.
prober:
  enabled: false
  image:
    repository: hermes-prober
    tag: ""
  port: 8089
  # -- Organization and user the probe addresses. Both are auto-created on the first token
  # exchange, so no seeding step is needed.
  #
  # organizationID MUST BE A UUID. Organizations are the one entity that did not move to the
  # base62 scheme -- `organizations.id` is `UUID PRIMARY KEY` (migrations/000001) -- so a
  # readable name cannot be stored. This shipped as "hermes-synthetic", which meant
  # `prober.enabled: true` could never work at all: EnsureOrganization fails on the insert,
  # /v1/auth/token answers 500, and the pod crash-loops with `mint token: auth/token
  # returned 500` while the rest of the release looks healthy. Rejected at render time below.
  #
  # userID is a caller-facing external id and is free text; keep it obviously synthetic,
  # because both rows land in the same tables as real ones.
  organizationID: "deadbeef-0000-4000-8000-000000000001"
  userID: "hermes-probe"
  # -- Time between probes. Also the write rate: every probe is a real notification.
  interval: 30s
  # -- How long a probe waits before it is counted lost. Generous on purpose -- end-to-end p95
  # measured 11ms while holding 250,000 connections, so this is not a latency threshold, it is
  # the line between "slow" and "never arrived". Alert on latency separately.
  timeout: 30s
  # -- Websocket connection endpoint. Empty derives `ws://<release>-centrifugo:8000/connection/websocket`.
  #
  # Note this is the CONNECTION endpoint on the external port, not the HTTP API on the internal
  # one. Pointing it at the API URL produces a socket that never connects and a probe that
  # reports 100% loss against a perfectly healthy pipeline.
  centrifugoURL: ""
  # -- API key for the probe, from a Secret you create. Required when enabled.
  #
  # Give it `notifications:send` and `organizations:manage` and nothing else. Reusing the
  # bootstrap key works and means a pod runs forever holding rights it never exercises.
  apiKey:
    existingSecret: ""
    existingSecretKey: "api-key"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------------------
# Network Policy
# ---------------------------------------------------------------------------

# -- Network policy configuration
networkPolicy:
  # -- Enable network policies to restrict inter-service traffic
  enabled: false

# ---------------------------------------------------------------------------
# TLS for the bundled datastores
# ---------------------------------------------------------------------------

# -- Encrypt the connections to the bundled PostgreSQL, Redis and NATS.
#
# This is what makes `hermes.env: production` possible with the bundled sub-charts. Without
# it they speak plaintext, which config.Validate() rejects outside development -- so before
# this existed, "bundled" and "production" were mutually exclusive and the chart said so at
# render time.
#
# Requires cert-manager, unless you supply certificates yourself with the per-store
# `tls.existingSecret`. The chart does not mint certificates: Helm's genCA/genSignedCert
# regenerate on every `helm template`, so `--dry-run` would disagree with `install` and every
# Argo or Flux render would churn the material. `existingSecret` is the same capability
# without that.
#
# Off by default, so an evaluation install is unchanged.
tls:
  # -- Issue certificates for the bundled datastores
  enabled: false
  issuer:
    # -- Name of an existing cert-manager Issuer or ClusterIssuer to sign with.
    #
    # This is the recommended path. Most clusters that run cert-manager already have a CA
    # whose private key lives somewhere deliberate.
    name: ""
    # -- Issuer or ClusterIssuer
    kind: ClusterIssuer
    # -- Create a self-signed CA in THIS namespace instead of using an existing issuer.
    #
    # For a cluster that has cert-manager but no CA of its own. Understand the trade before
    # enabling it: this puts a ten-year CA private key in a Secret in the release namespace,
    # where anyone who can read Secrets there can mint a certificate every Hermes service
    # trusts. deploy/k8s/pki/ moved that key OUT of the application namespace on purpose
    # (ADR 0005). Prefer `issuer.name` pointing at a cluster-scoped CA whose key lives
    # elsewhere.
    create: false
  # -- Certificate lifetime and renewal window, matching deploy/k8s/.
  #
  # Renewal is not automatic in the sense you might expect: none of Postgres, Redis or NATS
  # reloads a certificate from disk on its own, and the NATS sub-chart's config reloader
  # watches the config rather than the certificate Secret. A pod that is never restarted
  # keeps serving an expired certificate. A `helm upgrade` or a rollout restart inside the
  # renewal window is the mechanism -- 15 days of slack, deliberately generous.
  duration: 2160h
  renewBefore: 360h

# ---------------------------------------------------------------------------
# helm test
# ---------------------------------------------------------------------------

# -- Configuration for the `helm test` hooks
tests:
  # -- Image used by the connectivity test pod, which curls every service's /healthz.
  #
  # Pinned rather than `:latest`, so `helm test` means the same thing next month as today,
  # and settable so it can point at a mirror -- a hardcoded docker.io reference makes the
  # test unrunnable on an air-gapped cluster, which is the same gap as global.imagePullSecrets
  # and worth closing in the same place. It is the only third-party image `helm test` pulls.
  image: curlimages/curl:8.21.0

# ---------------------------------------------------------------------------
# External services (when sub-charts are disabled)
# ---------------------------------------------------------------------------

# -- External PostgreSQL connection (used when postgresql.enabled=false)
externalPostgresql:
  # -- Full connection URL (e.g. postgres://user:pass@host:5432/hermes?sslmode=require)
  url: ""
  # -- Name of an existing secret containing the database URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_DATABASE_URL"

# -- External NATS connection (used when nats.enabled=false)
externalNats:
  # -- NATS connection URL
  url: ""
  # -- Name of an existing secret containing the NATS URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_NATS_URL"

# -- External Redis connection (used when redis.enabled=false)
externalRedis:
  # -- Redis connection URL
  url: ""
  # -- Name of an existing secret containing the Redis URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_REDIS_URL"

# -- External Centrifugo connection (used when centrifugo.enabled=false)
externalCentrifugo:
  # -- Centrifugo HTTP API URL
  apiUrl: ""
  # -- Name of an existing secret containing the Centrifugo API key
  existingSecret: ""
  # -- Key within the existing secret that holds the API key
  existingSecretKey: "centrifugo-api-key"
  # -- Name of the Kubernetes Service to route realtime ingress traffic to when using external Centrifugo.
  # You must create this Service yourself (e.g., an ExternalName or headless Service pointing to your Centrifugo instance).
  ingressServiceName: ""

# ---------------------------------------------------------------------------
# Sub-chart overrides
# ---------------------------------------------------------------------------

# -- Bundled evaluation Postgres. Plain manifests, not a sub-chart — see templates/postgresql.yaml.
postgresql:
  # -- Run the bundled evaluation Postgres (templates/postgresql.yaml). Set false and use
  # externalPostgresql.url for anything you care about; hermes.env=production requires it.
  enabled: true
  image:
    # -- Docker Official Image. Not bitnami/postgresql: Broadcom withdrew Bitnami's free
    # catalogue from Docker Hub, so every versioned docker.io/bitnami tag now 404s. ADR 0009.
    repository: docker.io/library/postgres
    # -- Tracks the major that docker-compose.yml and the integration suite test against, so
    # the bundled datastore is the one Hermes is actually exercised on. Floating within the
    # major to pick up patch releases; pin harder here if you need a reproducible redeploy.
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    # -- These are placeholder credentials for an evaluation install and are committed to a
    # public repository. They are embedded in HERMES_DATABASE_URL in the ConfigMap.
    username: hermes
    password: hermes
    database: hermes
  # -- `max_connections` for the bundled server. Empty keeps the postgres image default of 100.
  #
  # This is here because 100 is not a lot once you start tuning. Every Hermes service holds its
  # own pgx pool of 10 (database.DefaultPoolConfig), nine services at one replica is 90, and
  # that is before dispatch.concurrency asks for more -- a dispatch pool of 64 across two
  # replicas is 128 on its own. Exhausting it does not fail where you caused it: Postgres
  # answers "sorry, too many clients already" to whichever service connects next, so the
  # symptom appears in inbox or admin while dispatch runs fine.
  #
  # templates/_validate.tpl does that arithmetic at render time whenever dispatch is tuned
  # above the built-in pool size, and this is the value that makes its answer fixable without
  # leaving the bundled path. Each slot costs the server a few hundred KB of shared memory plus
  # a backend process if used, so raise postgresql.resources with it.
  #
  # It is still an evaluation datastore (ADR 0009): one replica, no backups, no replication.
  # Real throughput work belongs on externalPostgresql.
  maxConnections: ""
  tls:
    # -- Bring your own certificate instead of having the chart issue one. Needs tls.crt,
    # tls.key and ca.crt -- the shape cert-manager produces, and equally the shape
    # `openssl` or an internal PKI can. This is the path that needs no cert-manager.
    existingSecret: ""
    # -- Verification mode written into HERMES_DATABASE_URL.
    #
    # verify-full by default, and that default matters. pgx sets InsecureSkipVerify for
    # `require`, so `require` is encryption with no server authentication: anything that
    # can win a DNS race is the database. Full verification costs one query parameter,
    # because pgx reads sslrootcert from the URL.
    #
    # `require` remains available for a deployment that cannot mount the CA. It renders no
    # sslrootcert -- deliberately, since pgx silently promotes the mode to verify-ca when
    # both are present, making the setting and the behaviour disagree.
    sslmode: verify-full
  # -- Extra `-c key=value` settings passed to the bundled server.
  #
  # `track_wal_io_timing=on` is the default because without it `pg_stat_wal.wal_sync_time`
  # and `wal_write_time` stay at exactly zero, and the postgres-exporter query that reads
  # them (deploy/observability/base/exporters/postgres-exporter.yaml) then publishes a mean
  # fsync latency of 0/0. A metric that is always zero is worse than an absent one: it reads
  # as "the disk is instant" rather than as "this is not being measured".
  #
  # It costs a clock read per WAL write. Postgres warns this can be significant on platforms
  # with slow timing; `pg_test_timing` in the container tells you which you have, and on
  # anything with a usable TSC it is in the tens of nanoseconds. Drop it from this list if
  # you measure otherwise.
  #
  # This is also the general escape hatch for write-path tuning -- commit_delay,
  # shared_buffers, max_wal_size -- none of which was reachable from the documented install
  # path before. Values are passed through verbatim and not validated:
  #
  #   extraSettings:
  #     - track_wal_io_timing=on
  #     - commit_delay=250
  #     - shared_buffers=1GB      # raise postgresql.shmSize with it
  extraSettings:
    - track_wal_io_timing=on
  persistence:
    # -- With persistence off the database is an emptyDir and every pod restart starts empty.
    enabled: true
    # -- Matches the storage the bitnami/postgresql chart requested by default, so replacing
    # it does not silently change what a fresh install provisions.
    size: 8Gi
    # -- Empty uses the cluster default StorageClass.
    storageClass: ""
  # -- Size of /dev/shm for the Postgres container.
  #
  # Kubernetes defaults a container's /dev/shm to 64Mi no matter how much memory the node
  # has, and Postgres allocates parallel workers' shared memory out of it. Once a table is
  # big enough for the planner to pick a parallel plan, queries fail rather than slow down:
  # "could not resize shared memory segment ... No space left on device". Raise it with
  # shared_buffers and work_mem if you tune those.
  shmSize: 256Mi
  resources: {}

# -- Bundled evaluation Redis. See templates/redis.yaml; no authentication by design.
redis:
  # -- Run the bundled evaluation Redis (templates/redis.yaml). Set false and use
  # externalRedis.url for anything you care about; hermes.env=production requires it.
  enabled: true
  image:
    # -- Docker Official Image, for the same reason as Postgres above. ADR 0009.
    repository: docker.io/library/redis
    # -- Matches docker-compose.yml.
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  tls:
    # -- Bring your own certificate. See postgresql.tls.existingSecret.
    #
    # Note that TLS here buys encryption, not access control: the bundled Redis requires no
    # password with or without it, so any pod in this namespace that can reach port 6379
    # still has full read/write on the idempotency keys and unread counts. It raises the bar
    # from "anything on the network" to "a pod in this namespace", which is worth having and
    # is not the same as authentication. Adding a password means moving HERMES_REDIS_URL out
    # of the ConfigMap and into the Secret; that has not been done.
    existingSecret: ""
  persistence:
    # -- Redis holds the Centrifugo engine state, the type-config cache and idempotency-key
    # dedup. None is a system of record, but losing the dedup keys on restart reopens a
    # window where a retried send is delivered twice, so this defaults on.
    enabled: true
    # -- Matches the storage the bitnami/redis chart requested by default.
    size: 8Gi
    # -- Empty uses the cluster default StorageClass.
    storageClass: ""
  resources: {}
  metrics:
    # -- Run a redis_exporter sidecar exposing Prometheus metrics on port 9121, and add a
    # `metrics` port to the Redis Service.
    #
    # On by default. This Redis is not only a cache: it holds the idempotency keys that stop
    # a retried send being delivered twice, and when Centrifugo runs on the Redis engine it
    # is also the realtime broker every websocket publication passes through -- so it becomes
    # load-bearing for connection fan-out at exactly the point you scale the realtime tier
    # out. Nothing else in the chart exposes its state.
    #
    # It shipped off, and the 250k load test is what argued it back on: Redis was measured at
    # 0.15 cores and 3,000 ops/s while carrying the fan-out for 100,000 connections, and that
    # number had to be obtained by hand because the pod had no metrics endpoint at all. A
    # component on the realtime critical path with no time series is one you can only
    # characterise after the incident.
    #
    # The sidecar is ~10Mi and one scrape target. Set false if you are running an evaluation
    # install where that still matters.
    enabled: true
    image:
      # -- The exporter the Prometheus community maintains for Redis.
      repository: docker.io/oliver006/redis_exporter
      tag: "v1.67.0"
      pullPolicy: IfNotPresent
    resources: {}

# -- NATS sub-chart configuration
nats:
  enabled: true
  # Helm merges the parent chart's `global` into every sub-chart, and the NATS chart reads
  # `global.image.registry` — the same key Hermes uses for its own images. Left alone, the
  # bundled bus renders as ghcr.io/hermesnotifications/nats:2.10.26-alpine and two more
  # images nobody publishes, and every NATS pod is ImagePullBackOff. `helm template` is
  # perfectly happy with it. Pinning each registry explicitly overrides the inherited
  # global, because a per-image registry beats the global one in that chart.
  container:
    image:
      registry: docker.io
  reloader:
    image:
      registry: docker.io
  promExporter:
    image:
      registry: docker.io
  natsBox:
    container:
      image:
        registry: docker.io
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    cluster:
      enabled: true
      replicas: 3

# -- Centrifugo sub-chart configuration
centrifugo:
  enabled: true
  # -- Secrets Centrifugo needs, read from the Hermes release Secret.
  #
  # Both are REQUIRED for realtime to work at all, and both were missing:
  #
  #   CENTRIFUGO_HTTP_API_KEY must equal HERMES_CENTRIFUGO_API_KEY, or every publish from the
  #   inbox worker is rejected 401. Centrifugo 6 requires API authentication by default; the
  #   chart set the key on the clients and never on the server.
  #
  #   CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY must equal HERMES_JWT_SECRET, because the token
  #   the widget presents is one Hermes minted. Without it Centrifugo cannot verify any token
  #   and refuses every browser, while the websocket handshake itself still succeeds -- so the
  #   route looks healthy and no client can subscribe.
  #
  # The secret name has to be spelled out because a parent chart cannot template a sub-chart's
  # values. It is `<release>-hermes-secrets` for a release named `hermes`; adjust it if you
  # install under a different name, or set hermes.existingSecret and name that instead.
  # templates/_validate.tpl checks that this points at the Secret the chart actually creates.
  envSecret:
    - name: CENTRIFUGO_HTTP_API_KEY
      secretKeyRef:
        name: hermes-secrets
        key: HERMES_CENTRIFUGO_API_KEY
    - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
      secretKeyRef:
        name: hermes-secrets
        key: HERMES_JWT_SECRET
  # -- OpenTelemetry traces from Centrifugo, joined to the Hermes trace.
  #
  # Centrifugo traces its **server API** only — the publish calls Hermes makes to it. It does
  # not trace websocket client sessions, so this closes the `send -> dispatch -> worker-inbox
  # -> Centrifugo publish` leg and stops there. The socket-delivery leg is still measured only
  # by the load generator, which is what `ws_push_e2e_latency` is for.
  #
  # That is worth having anyway: worker-inbox publishing to Centrifugo was the one hop with no
  # server-side timing at all, and a publish that is slow or failing currently shows up as an
  # inbox notification that silently never arrives.
  #
  # The endpoint has to be repeated here rather than inherited: Helm merges `global` into a
  # sub-chart but observability.otel.* is not under `global`, and a parent chart cannot
  # template a sub-chart's values. **If you change observability.otel.endpoint, change this
  # one too** — templates/_validate.tpl now refuses to render when they disagree, because
  # they silently did on a real install and the only symptom was Centrifugo never appearing
  # in the trace service list.
  #
  # OTEL_EXPORTER_OTLP_PROTOCOL is set explicitly because Centrifugo defaults to http/protobuf
  # while Hermes' collector endpoint below is the gRPC port (4317). Left at the default, every
  # span is posted as HTTP to a gRPC listener and silently dropped.
  env:
    CENTRIFUGO_OPENTELEMETRY: "1"
    CENTRIFUGO_OPENTELEMETRY_API: "1"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "hermes-centrifugo"
  # -- Left OFF, and the ServiceMonitor for Centrifugo is rendered by this chart instead, in
  # templates/servicemonitor.yaml.
  #
  # Not a preference. The sub-chart's ServiceMonitor template is guarded only by this flag,
  # with no `.Capabilities.APIVersions` check — so turning it on makes `helm install` fail with
  # `no matches for kind "ServiceMonitor"` on any cluster that has never installed the
  # Prometheus Operator. That is most evaluation installs, and it is not visible from
  # `helm template`, which reports no capabilities either way. It took a real kind install in
  # CI to surface it.
  #
  # Hermes' own copy carries the guard every other ServiceMonitor here does, and scrapes the
  # same endpoint (`internal` port, 9000).
  metrics:
    serviceMonitor:
      enabled: false
  # -- The sub-chart ships `resources: {}`, which schedules Centrifugo as BestEffort -- the
  # first QoS class the kubelet evicts under node pressure, for the one pod that holds every
  # live websocket in the deployment. Evicting it drops every connection at once.
  #
  # Sized from measurement rather than guessed. Centrifugo costs roughly 60 KiB and 5m CPU per
  # 1,000 connections per replica, so 512Mi carries ~8,000 connections with room, and 1Gi is
  # the point where a single replica has been observed holding ~16,000. Raise the limit
  # proportionally before scaling connections: at 250,000 across six replicas each pod sat at
  # 1.5-2.1Gi against a 4Gi limit, and three replicas would have needed ~5Gi and been
  # OOM-killed.
  #
  # The CPU request is deliberately small. At 25,000 connections Centrifugo used 0.23 of one
  # core; it is a memory-bound workload and a large CPU request only makes it harder to
  # schedule.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  config:
    # -- The admin UI. Off: it is served on the same internal port as the API and, with no
    # admin password configured, enabling it is an unauthenticated console onto every channel
    # for anything that can reach the Service.
    admin:
      enabled: false
    # -- Instrument Centrifugo's own HTTP handlers, so the publish API gets latency and status
    # histograms rather than only node-level gauges. The /metrics endpoint itself is always on
    # (internal port 9000); this adds the per-handler series.
    #
    # `channel_namespace_resolution` is deliberately not set: it labels metrics by channel
    # namespace, and Hermes runs everything through `channel.without_namespace` on
    # `user#<id>`, so it would add a label whose only value is empty.
    prometheus:
      enabled: true
      instrument_http_handlers: true
    # -- Where Centrifugo keeps its subscription registry.
    #
    # `memory` is correct at ONE replica and silently wrong at more: each node knows only its
    # own subscribers, so a publication reaches only the clients on the pod that happened to
    # receive it. templates/_validate.tpl refuses replicaCount > 1 on this engine rather than
    # letting it render, because the failure has no symptom -- the notification is still
    # stored, so the inbox is correct on refresh and only the live push is missing.
    #
    # To scale the realtime tier out, switch to Redis and raise centrifugo.replicaCount:
    #
    #   centrifugo:
    #     replicaCount: 3
    #     config:
    #       engine:
    #         type: redis
    #         redis:
    #           address: redis://hermes-redis:6379/0
    #
    # Measured on three replicas: 208 pushes/s against 210/s for a single pod -- cross-replica
    # fan-out costs nothing detectable -- and a `kubectl rollout restart` completed mid-run with
    # 0.00% failed requests and push latency indistinguishable from steady state. On one replica
    # that same restart drops every connection at once, which is the real argument for doing it.
    #
    # The address is a literal because a parent chart cannot template a sub-chart's values, so
    # adjust it if you install under a release name other than `hermes`, and use rediss:// with
    # engine.redis.tls if you enable tls.enabled -- the bundled Redis certificate comes from a
    # private cert-manager CA that no system trust store knows. _validate.tpl catches the
    # plaintext-against-TLS case; it cannot catch a wrong hostname.
    engine:
      type: memory
    channel:
      without_namespace:
        # -- REQUIRED for any client to subscribe. Do not turn this off.
        #
        # Hermes puts each user on `user#<internal id>`. The `#` is Centrifugo's user-limited
        # channel convention: the suffix names the only user allowed to subscribe. But
        # Centrifugo only honours that when this is enabled — without it every subscription
        # is refused with "103: permission denied", while the connection itself succeeds.
        #
        # So the failure is a widget that connects, authenticates, and silently receives
        # nothing. The deploy/k8s overlays have always set it; the chart never did, which is
        # why realtime did not work there even once the API port and token secret were right.
        #
        # Note the nesting. This sub-chart ships Centrifugo v6, where the option lives under
        # channel.without_namespace; in v5 it was top-level, which is the shape the kustomize
        # overlays use. An unrecognised key is ignored rather than rejected, so the v5 spelling
        # here would look correct and change nothing.
        allow_user_limited_channels: true
    # -- Fallback transports for the inbox widget's connection ladder
    # (websocket -> http_stream -> sse). Leave both on.
    #
    # The widget tries websocket first and only steps down when it fails, so on a healthy
    # network these cost nothing. They exist for the networks that break websockets:
    # TLS-intercepting corporate proxies and middleboxes that strip `Upgrade`. Without
    # them such a client loads its inbox once over REST and then never updates again,
    # silently, for the whole session.
    #
    # Both are bidirectional via an `/emulation` endpoint that enabling either one also
    # turns on, and which the chart's realtime Ingress already routes (`/realtime(/|$)(.*)`).
    # Client->server commands are independent POSTs, so they can hit any replica and this
    # needs no session affinity.
    #
    # Note the nesting, as with `allowed_origins` below: this sub-chart ships Centrifugo v6,
    # where these are `sse.enabled`. The kustomize overlays in deploy/k8s run the v5 image,
    # where they are flat booleans. An unrecognised key is ignored rather than rejected, so
    # the wrong shape yields a server that starts healthy and 404s only the fallback rungs.
    http_stream:
      enabled: true
    sse:
      enabled: true
    client:
      # -- Origins permitted to open a realtime websocket, e.g.
      # `["https://app.example.com", "https://*.example.com"]`.
      #
      # **Set this or realtime does not work.** The inbox widget is embedded in *your*
      # application, so the browser's `Origin` is your app's domain while the socket lives on
      # the Hermes domain — cross-origin by construction. Centrifugo answers `403` at the
      # websocket handshake to any origin not listed here.
      #
      # The failure is quiet in the worst way: Centrifugo permits connections that carry *no*
      # `Origin` header at all, "as they typically originate from non-browser environments".
      # So health checks, curl and every server-side client succeed while every browser is
      # refused. The service looks healthy and serves nobody.
      #
      # Empty (the default) means same-origin only, which suits a local evaluation where the
      # page and the socket share a host, and nothing else.
      #
      # Note the nesting: this sub-chart ships Centrifugo v6, where the option lives under
      # `client`. The kustomize overlays in deploy/k8s run the v5 image, where it is top-level.
      allowed_origins: []
