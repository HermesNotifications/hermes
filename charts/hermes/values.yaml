# ---------------------------------------------------------------------------
# Admin Portal (web UI)
# ---------------------------------------------------------------------------

# -- Admin Portal web application.
# NOTE: no hermes-admin-portal image is published, and this repository contains no
# Dockerfile that could build one — web/admin is a Next.js app, the Tiltfile runs it as a
# local pnpm process, and .github/workflows/cd.yml builds Go services only. Enabling this
# without overriding image.repository to an image you built yourself is refused at render
# time rather than left to become an ImagePullBackOff.
adminPortal:
  # -- Deploy the admin portal. Requires adminPortal.image.repository to point at your own
  # image; see the note above.
  enabled: false
  image:
    repository: hermes-admin-portal
    tag: ""
  # -- Container port
  port: 3000
  replicas: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Database migration job
# ---------------------------------------------------------------------------

# -- Database migration job configuration
migration:
  image:
    # -- Migration job image repository
    repository: hermes-migrate
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed.
  # 6, not 3: the Job is applied in the same pass as the database it migrates, so on a
  # first install it retries while Postgres starts. Kubernetes backs off 10s, 20s, 40s...
  # between attempts, so 3 gave roughly 70 seconds — less than a bundled Postgres takes to
  # accept connections.
  backoffLimit: 6
  # -- Resource requests and limits for the migration job
  resources: {}

# ---------------------------------------------------------------------------
# NATS stream provisioning job
# ---------------------------------------------------------------------------

# -- JetStream stream provisioning job (ADR 0005 phase 4).
# Declares the NOTIFICATIONS, DELIVERY, EVENTS and DLQ streams. Send, dispatch and all four
# workers verify their streams at boot and exit non-zero if one is missing, so disabling
# this without provisioning streams some other way crash-loops six deployments.
# Idempotent — SetupStreams is CreateOrUpdate.
#
# This Job and the migration Job are ordinary resources, NOT Helm hooks (ADR 0008). Neither
# hook phase works: pre-install runs before the bundled datastores exist, and post-install
# never runs at all under `--wait`/`--atomic` because Helm is blocked waiting for the very
# services these Jobs unblock. As plain resources they run alongside the services, which
# crash-loop for about a minute and then converge.
#
# Practical consequence for your install command:
#   * `--wait` and `--atomic` work, and are recommended. A flagless `helm install` returns
#     before these Jobs have necessarily succeeded, so it cannot fail on a failed migration.
#   * On `helm upgrade`, add `--wait-for-jobs` — `--wait` alone does not wait for Jobs, and
#     on an upgrade the services are already Ready so it can return too early.
natsProvision:
  # -- Run the stream provisioning job. Disable only if you provision JetStream streams
  # out of band (e.g. cmd/natsprovision run by your own pipeline).
  enabled: true
  image:
    # -- Provisioning job image repository
    repository: hermes-natsprovision
    # -- Image tag override
    tag: ""
  # -- Number of retries before marking the job as failed
  backoffLimit: 6
  # -- Resource requests and limits for the provisioning job
  resources: {}

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# -- Deployment-wide rate limiting. The per-credential rate lives on each
# service's own `rateLimit` block, because each service is its own Deployment;
# these settings describe the installation as a whole.
rateLimit:
  # -- Per-source-address bound applied BEFORE authentication, inside the Go
  # services. Unlike the nginx ingress annotations below it works on every
  # ingress controller, and on none at all — which matters because the
  # in-process credential limiter runs *after* auth and so cannot see an
  # unauthenticated flood at all. This is a flood bound, not a quota. Empty
  # burst/perSecond keeps each service's compiled-in default (send and admin
  # default to their per-credential ceiling; inbox and user default well above
  # their per-user rate, because many users share one NAT).
  # OFF by default, and deliberately so: behind an ingress controller every request
  # carries the controller's pod IP unless trustedProxyCIDRs is set, which collapses the
  # whole fleet into one bucket — an outage delivered by the feature meant to prevent
  # one. Enable it together with trustedProxyCIDRs below. Services log a warning at
  # startup if you enable it without them.
  perIP:
    enabled: false
    burst: ""
    perSecond: ""
  # -- Proxies whose `X-Forwarded-For` may be believed, as CIDRs or bare IPs.
  # EMPTY MEANS TRUST NOTHING, and per-IP limiting then keys on the address of
  # the immediate peer — which behind an ingress controller is the controller
  # itself, collapsing every caller into one bucket. Set this to your ingress
  # controller's pod CIDR to get real client addresses. Do not set it to
  # 0.0.0.0/0: the header is caller-supplied, so trusting every peer lets anyone
  # choose their own bucket and escape the limit entirely.
  trustedProxyCIDRs: []
  #  - 10.42.0.0/16
  # -- Cluster-wide per-credential limiting. With this off, each replica enforces
  # the configured rate independently and the cluster-wide ceiling is that rate
  # times the replica count. With it on, the admission check runs in Redis
  # (GCRA, one atomic Lua round trip) and the configured rate IS the cluster-wide
  # ceiling. Costs one Redis round trip per authenticated request, on a path that
  # already makes one or two. If Redis cannot answer within 100ms the request is
  # decided from the replica's local bucket instead, so an outage degrades to the
  # per-replica behaviour rather than failing requests or dropping the limit.
  # Requires Redis. Off by default because it lowers the effective throughput a
  # multi-replica deployment gets today, which should be an opt-in change.
  distributed:
    enabled: false

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------

# -- Ingress configuration
ingress:
  # -- Enable ingress resource creation
  enabled: true
  # -- Ingress class name (e.g. nginx, traefik)
  className: ""
  # -- Which controller's dialect to emit. Inferred from className; set only when your class
  # is named something the inference cannot see through (`traefik-internal`, `nginx-public`).
  #
  # This is not cosmetic. The realtime route has to strip `/realtime` before Centrifugo sees
  # it, and the two controllers cannot express that the same way: nginx uses a regex path
  # with rewrite-target, and Traefik v3 removed regex from Ingress paths, so the nginx form
  # matches nothing at all there. Getting this wrong gives you a working API and a realtime
  # endpoint that 404s, with nothing in any log naming the ingress.
  #
  # One of: "" (infer), "nginx", "traefik". Anything unrecognised is treated as nginx, which
  # is what the chart emitted before this existed.
  controller: ""
  # -- Additional ingress annotations
  annotations: {}
  # -- Per-IP flood shielding on the API ingress (nginx ingress controller only;
  # other controllers ignore these annotations). Deliberately NOT applied to the
  # realtime ingress, where connections are long-lived WebSockets and a per-IP
  # connection cap would count concurrent users behind a shared NAT rather than
  # abuse. `rps` defaults to send's per-credential ceiling so it bounds floods
  # without making the documented API limit unreachable — see
  # docs/configuration.md#http-rate-limiting.
  rateLimit:
    enabled: true
    rps: 2000
    burstMultiplier: 5
    connections: 500
  # -- TLS configuration
  tls: []
  #  - secretName: hermes-tls
  #    hosts:
  #      - hermes.example.com

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

# -- Observability / telemetry configuration
observability:
  # -- Enable OpenTelemetry export environment for Hermes services
  enabled: false
  otel:
    # -- OTLP endpoint for the OpenTelemetry Collector
    endpoint: "http://otel-collector-opentelemetry-collector.observability.svc:4317"
    # -- OTLP protocol used by Hermes services
    protocol: "grpc"
  # -- Comma-separated OTEL_RESOURCE_ATTRIBUTES appended at SDK startup
  resourceAttributes: ""
  serviceMonitor:
    # -- Emit Prometheus Operator ServiceMonitor resources for Hermes services.
    # Defaults to true to preserve the old observability.enabled=true behavior.
    enabled: true

# ---------------------------------------------------------------------------
# Network Policy
# ---------------------------------------------------------------------------

# -- Network policy configuration
networkPolicy:
  # -- Enable network policies to restrict inter-service traffic
  enabled: false

# ---------------------------------------------------------------------------
# TLS for the bundled datastores
# ---------------------------------------------------------------------------

# -- Encrypt the connections to the bundled PostgreSQL, Redis and NATS.
#
# This is what makes `hermes.env: production` possible with the bundled sub-charts. Without
# it they speak plaintext, which config.Validate() rejects outside development -- so before
# this existed, "bundled" and "production" were mutually exclusive and the chart said so at
# render time.
#
# Requires cert-manager, unless you supply certificates yourself with the per-store
# `tls.existingSecret`. The chart does not mint certificates: Helm's genCA/genSignedCert
# regenerate on every `helm template`, so `--dry-run` would disagree with `install` and every
# Argo or Flux render would churn the material. `existingSecret` is the same capability
# without that.
#
# Off by default, so an evaluation install is unchanged.
tls:
  # -- Issue certificates for the bundled datastores
  enabled: false
  issuer:
    # -- Name of an existing cert-manager Issuer or ClusterIssuer to sign with.
    #
    # This is the recommended path. Most clusters that run cert-manager already have a CA
    # whose private key lives somewhere deliberate.
    name: ""
    # -- Issuer or ClusterIssuer
    kind: ClusterIssuer
    # -- Create a self-signed CA in THIS namespace instead of using an existing issuer.
    #
    # For a cluster that has cert-manager but no CA of its own. Understand the trade before
    # enabling it: this puts a ten-year CA private key in a Secret in the release namespace,
    # where anyone who can read Secrets there can mint a certificate every Hermes service
    # trusts. deploy/k8s/pki/ moved that key OUT of the application namespace on purpose
    # (ADR 0005). Prefer `issuer.name` pointing at a cluster-scoped CA whose key lives
    # elsewhere.
    create: false
  # -- Certificate lifetime and renewal window, matching deploy/k8s/.
  #
  # Renewal is not automatic in the sense you might expect: none of Postgres, Redis or NATS
  # reloads a certificate from disk on its own, and the NATS sub-chart's config reloader
  # watches the config rather than the certificate Secret. A pod that is never restarted
  # keeps serving an expired certificate. A `helm upgrade` or a rollout restart inside the
  # renewal window is the mechanism -- 15 days of slack, deliberately generous.
  duration: 2160h
  renewBefore: 360h

# ---------------------------------------------------------------------------
# helm test
# ---------------------------------------------------------------------------

# -- Configuration for the `helm test` hooks
tests:
  # -- Image used by the connectivity test pod, which curls every service's /healthz.
  #
  # Pinned rather than `:latest`, so `helm test` means the same thing next month as today,
  # and settable so it can point at a mirror -- a hardcoded docker.io reference makes the
  # test unrunnable on an air-gapped cluster, which is the same gap as global.imagePullSecrets
  # and worth closing in the same place. It is the only third-party image `helm test` pulls.
  image: curlimages/curl:8.21.0

# ---------------------------------------------------------------------------
# External services (when sub-charts are disabled)
# ---------------------------------------------------------------------------

# -- External PostgreSQL connection (used when postgresql.enabled=false)
externalPostgresql:
  # -- Full connection URL (e.g. postgres://user:pass@host:5432/hermes?sslmode=require)
  url: ""
  # -- Name of an existing secret containing the database URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_DATABASE_URL"

# -- External NATS connection (used when nats.enabled=false)
externalNats:
  # -- NATS connection URL
  url: ""
  # -- Name of an existing secret containing the NATS URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_NATS_URL"

# -- External Redis connection (used when redis.enabled=false)
externalRedis:
  # -- Redis connection URL
  url: ""
  # -- Name of an existing secret containing the Redis URL
  existingSecret: ""
  # -- Key within the existing secret
  existingSecretKey: "HERMES_REDIS_URL"

# -- External Centrifugo connection (used when centrifugo.enabled=false)
externalCentrifugo:
  # -- Centrifugo HTTP API URL
  apiUrl: ""
  # -- Name of an existing secret containing the Centrifugo API key
  existingSecret: ""
  # -- Key within the existing secret that holds the API key
  existingSecretKey: "centrifugo-api-key"
  # -- Name of the Kubernetes Service to route realtime ingress traffic to when using external Centrifugo.
  # You must create this Service yourself (e.g., an ExternalName or headless Service pointing to your Centrifugo instance).
  ingressServiceName: ""

# ---------------------------------------------------------------------------
# Sub-chart overrides
# ---------------------------------------------------------------------------

# -- Bundled evaluation Postgres. Plain manifests, not a sub-chart — see templates/postgresql.yaml.
postgresql:
  # -- Run the bundled evaluation Postgres (templates/postgresql.yaml). Set false and use
  # externalPostgresql.url for anything you care about; hermes.env=production requires it.
  enabled: true
  image:
    # -- Docker Official Image. Not bitnami/postgresql: Broadcom withdrew Bitnami's free
    # catalogue from Docker Hub, so every versioned docker.io/bitnami tag now 404s. ADR 0009.
    repository: docker.io/library/postgres
    # -- Tracks the major that docker-compose.yml and the integration suite test against, so
    # the bundled datastore is the one Hermes is actually exercised on. Floating within the
    # major to pick up patch releases; pin harder here if you need a reproducible redeploy.
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    # -- These are placeholder credentials for an evaluation install and are committed to a
    # public repository. They are embedded in HERMES_DATABASE_URL in the ConfigMap.
    username: hermes
    password: hermes
    database: hermes
  tls:
    # -- Bring your own certificate instead of having the chart issue one. Needs tls.crt,
    # tls.key and ca.crt -- the shape cert-manager produces, and equally the shape
    # `openssl` or an internal PKI can. This is the path that needs no cert-manager.
    existingSecret: ""
    # -- Verification mode written into HERMES_DATABASE_URL.
    #
    # verify-full by default, and that default matters. pgx sets InsecureSkipVerify for
    # `require`, so `require` is encryption with no server authentication: anything that
    # can win a DNS race is the database. Full verification costs one query parameter,
    # because pgx reads sslrootcert from the URL.
    #
    # `require` remains available for a deployment that cannot mount the CA. It renders no
    # sslrootcert -- deliberately, since pgx silently promotes the mode to verify-ca when
    # both are present, making the setting and the behaviour disagree.
    sslmode: verify-full
  persistence:
    # -- With persistence off the database is an emptyDir and every pod restart starts empty.
    enabled: true
    # -- Matches the storage the bitnami/postgresql chart requested by default, so replacing
    # it does not silently change what a fresh install provisions.
    size: 8Gi
    # -- Empty uses the cluster default StorageClass.
    storageClass: ""
  resources: {}

# -- Bundled evaluation Redis. See templates/redis.yaml; no authentication by design.
redis:
  # -- Run the bundled evaluation Redis (templates/redis.yaml). Set false and use
  # externalRedis.url for anything you care about; hermes.env=production requires it.
  enabled: true
  image:
    # -- Docker Official Image, for the same reason as Postgres above. ADR 0009.
    repository: docker.io/library/redis
    # -- Matches docker-compose.yml.
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  tls:
    # -- Bring your own certificate. See postgresql.tls.existingSecret.
    #
    # Note that TLS here buys encryption, not access control: the bundled Redis requires no
    # password with or without it, so any pod in this namespace that can reach port 6379
    # still has full read/write on the idempotency keys and unread counts. It raises the bar
    # from "anything on the network" to "a pod in this namespace", which is worth having and
    # is not the same as authentication. Adding a password means moving HERMES_REDIS_URL out
    # of the ConfigMap and into the Secret; that has not been done.
    existingSecret: ""
  persistence:
    # -- Redis holds the Centrifugo engine state, the type-config cache and idempotency-key
    # dedup. None is a system of record, but losing the dedup keys on restart reopens a
    # window where a retried send is delivered twice, so this defaults on.
    enabled: true
    # -- Matches the storage the bitnami/redis chart requested by default.
    size: 8Gi
    # -- Empty uses the cluster default StorageClass.
    storageClass: ""
  resources: {}

# -- NATS sub-chart configuration
nats:
  enabled: true
  # Helm merges the parent chart's `global` into every sub-chart, and the NATS chart reads
  # `global.image.registry` — the same key Hermes uses for its own images. Left alone, the
  # bundled bus renders as ghcr.io/hermesnotifications/nats:2.10.26-alpine and two more
  # images nobody publishes, and every NATS pod is ImagePullBackOff. `helm template` is
  # perfectly happy with it. Pinning each registry explicitly overrides the inherited
  # global, because a per-image registry beats the global one in that chart.
  container:
    image:
      registry: docker.io
  reloader:
    image:
      registry: docker.io
  promExporter:
    image:
      registry: docker.io
  natsBox:
    container:
      image:
        registry: docker.io
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    cluster:
      enabled: true
      replicas: 3

# -- Centrifugo sub-chart configuration
centrifugo:
  enabled: true
  # -- Secrets Centrifugo needs, read from the Hermes release Secret.
  #
  # Both are REQUIRED for realtime to work at all, and both were missing:
  #
  #   CENTRIFUGO_HTTP_API_KEY must equal HERMES_CENTRIFUGO_API_KEY, or every publish from the
  #   inbox worker is rejected 401. Centrifugo 6 requires API authentication by default; the
  #   chart set the key on the clients and never on the server.
  #
  #   CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY must equal HERMES_JWT_SECRET, because the token
  #   the widget presents is one Hermes minted. Without it Centrifugo cannot verify any token
  #   and refuses every browser, while the websocket handshake itself still succeeds -- so the
  #   route looks healthy and no client can subscribe.
  #
  # The secret name has to be spelled out because a parent chart cannot template a sub-chart's
  # values. It is `<release>-hermes-secrets` for a release named `hermes`; adjust it if you
  # install under a different name, or set hermes.existingSecret and name that instead.
  # templates/_validate.tpl checks that this points at the Secret the chart actually creates.
  envSecret:
    - name: CENTRIFUGO_HTTP_API_KEY
      secretKeyRef:
        name: hermes-secrets
        key: HERMES_CENTRIFUGO_API_KEY
    - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
      secretKeyRef:
        name: hermes-secrets
        key: HERMES_JWT_SECRET
  config:
    # -- The admin UI. Off: it is served on the same internal port as the API and, with no
    # admin password configured, enabling it is an unauthenticated console onto every channel
    # for anything that can reach the Service.
    admin:
      enabled: false
    engine:
      type: memory
    # -- Fallback transports for the inbox widget's connection ladder
    # (websocket -> http_stream -> sse). Leave both on.
    #
    # The widget tries websocket first and only steps down when it fails, so on a healthy
    # network these cost nothing. They exist for the networks that break websockets:
    # TLS-intercepting corporate proxies and middleboxes that strip `Upgrade`. Without
    # them such a client loads its inbox once over REST and then never updates again,
    # silently, for the whole session.
    #
    # Both are bidirectional via an `/emulation` endpoint that enabling either one also
    # turns on, and which the chart's realtime Ingress already routes (`/realtime(/|$)(.*)`).
    # Client->server commands are independent POSTs, so they can hit any replica and this
    # needs no session affinity.
    #
    # Note the nesting, as with `allowed_origins` below: this sub-chart ships Centrifugo v6,
    # where these are `sse.enabled`. The kustomize overlays in deploy/k8s run the v5 image,
    # where they are flat booleans. An unrecognised key is ignored rather than rejected, so
    # the wrong shape yields a server that starts healthy and 404s only the fallback rungs.
    http_stream:
      enabled: true
    sse:
      enabled: true
    client:
      # -- Origins permitted to open a realtime websocket, e.g.
      # `["https://app.example.com", "https://*.example.com"]`.
      #
      # **Set this or realtime does not work.** The inbox widget is embedded in *your*
      # application, so the browser's `Origin` is your app's domain while the socket lives on
      # the Hermes domain — cross-origin by construction. Centrifugo answers `403` at the
      # websocket handshake to any origin not listed here.
      #
      # The failure is quiet in the worst way: Centrifugo permits connections that carry *no*
      # `Origin` header at all, "as they typically originate from non-browser environments".
      # So health checks, curl and every server-side client succeed while every browser is
      # refused. The service looks healthy and serves nobody.
      #
      # Empty (the default) means same-origin only, which suits a local evaluation where the
      # page and the socket share a host, and nothing else.
      #
      # Note the nesting: this sub-chart ships Centrifugo v6, where the option lives under
      # `client`. The kustomize overlays in deploy/k8s run the v5 image, where it is top-level.
      allowed_origins: []
