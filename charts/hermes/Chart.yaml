apiVersion: v2
name: hermes
description: An event-driven notification platform for delivering multi-channel notifications at scale
type: application
version: 0.2.1
appVersion: "0.2.1"
home: https://github.com/hermesnotifications/hermes
sources:
  - https://github.com/hermesnotifications/hermes
maintainers:
  - name: Hermes Notifications
    url: https://github.com/hermesnotifications
keywords:
  - notifications
  - messaging
  - email
  - sms
  - inbox
  - push
  - nats
  - event-driven

# The bundled Postgres and Redis are plain manifests in templates/, not sub-charts — see
# ADR 0009. Bitnami withdrew its free image catalogue from Docker Hub, leaving the charts
# that used to be listed here unable to pull an image at all. NATS and Centrifugo are
# unaffected: both publish their own images and neither depends on Bitnami.
dependencies:
  - name: nats
    version: "~1.2"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: centrifugo
    version: "~13.0"
    repository: https://centrifugal.github.io/helm-charts
    condition: centrifugo.enabled
