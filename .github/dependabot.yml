# Dependabot version updates. Grouping is the point here: without it, every Go
# submodule (each aws-sdk-go-v2/* package, each otel module, ...) opens its own
# PR and triggers its own full CI run. Grouped updates collapse those into a few
# PRs per week, each a single CI run.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      go-minor-patch:
        # Everything else: bundle minor/patch bumps together; majors stay separate.
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Must be the repo root, not /web/admin: this is a pnpm workspace, so there is a
  # single pnpm-lock.yaml at the root covering web/admin and sdks/typescript/packages/*.
  # Pointed at /web/admin, Dependabot found no lockfile and opened no update PRs, which
  # is how 53 npm alerts accumulated untouched.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        # Majors grouped but separate: sharp, hono and @hono/node-server all need
        # major bumps to clear their advisories, and those want reviewing together.
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directories:
      - "/deploy/docker"
      - "/cmd/loadseed"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"

  # Actions are pinned to commit SHAs with the tag in a trailing comment
  # (finding 16) — `uses: actions/checkout@d23441a… # v6`. Dependabot understands
  # that form and bumps both the SHA and the comment, so pinning does not mean
  # going stale. This entry is what keeps that true; removing it silently freezes
  # every action at whatever commit was current when it was pinned.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
