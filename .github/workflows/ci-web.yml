name: CI (Web)

# JavaScript/TypeScript CI for the pnpm workspace (web/admin, sdks/typescript, examples/
# and tests/browser).
# The main `ci.yml` only covers the Go services, so dependency bumps and code
# changes under web/admin and the TS SDKs previously shipped with zero CI. This
# workflow closes that gap. Path-filtered so it only runs when JS sources, the
# workspace manifests, or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - "web/admin/**"
      - "sdks/typescript/**"
      - "examples/**"
      - "tests/browser/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/admin/**"
      - "sdks/typescript/**"
      - "examples/**"
      - "tests/browser/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # Pin pnpm to the version that generated pnpm-lock.yaml so --frozen-lockfile
  # checks the lockfile format consistently.
  PNPM_VERSION: "10.28.2"

jobs:
  sdk:
    name: TypeScript SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # --frozen-lockfile also guards against the failure mode where a Dependabot
      # PR updates web/admin/package.json without regenerating the workspace-root
      # pnpm-lock.yaml (which previously slipped through because nothing ran it).
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # All four packages build again. The previous single-package filter blamed
      # hermes-client for generated-type drift, but hermes-client compiles clean;
      # the drift was in hermes-react and hermes-web, which both still constructed
      # a Notification with `group_id` after the schema moved to `category_id`.
      # Building only one package is what let that sit undetected, so build all of
      # them — a compile error in any SDK now fails the job.
      - name: Build SDKs
        run: pnpm --filter "./sdks/typescript/packages/*" build
      # The build emits from tsconfig.build.json, which excludes tests so they are
      # not published. This checks the full tsconfig, tests included — otherwise a
      # test fake could drift out of sync with the real client types and nothing
      # would say so, since vitest transpiles without type-checking.
      - name: Typecheck (including tests)
        run: pnpm --filter "./sdks/typescript/packages/*" --parallel run --if-present typecheck
      # Type errors are caught by the build above; this runs the behavioural suites
      # for the two packages that ship runtime code (hooks and a web component).
      # --if-present so packages without a suite yet do not fail the job.
      - name: Test
        run: pnpm --filter "./sdks/typescript/packages/*" --parallel run --if-present test

  web-admin:
    name: Admin Portal (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # web/admin imports @hermes-notifications/server (workspace:*); its types
      # resolve from the compiled dist/, so the SDK must be built before typecheck.
      - name: Build workspace SDK dependency
        run: pnpm --filter "@hermes-notifications/server" build
      - name: Lint
        run: pnpm --filter "@hermes/admin" lint
      - name: Typecheck
        run: pnpm --filter "@hermes/admin" typecheck
      - name: Test
        run: pnpm --filter "@hermes/admin" test
      # The production build was never run anywhere until now, so nothing caught that
      # every dashboard route was being statically prerendered and the build failed
      # without HERMES_API_URL/HERMES_API_KEY. Deliberately runs with no env vars: the
      # routes are `dynamic = "force-dynamic"`, so a green build here proves none of
      # them reach for the API at build time. If someone makes a route static again,
      # this step is what fails.
      - name: Build
        run: pnpm --filter "@hermes/admin" build

  examples:
    name: Inbox demo (typecheck + build + spec compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The demo consumes the SDKs as workspace packages whose types resolve from dist/, so
      # they must be compiled before anything here typechecks.
      - name: Build workspace SDKs
        run: pnpm --filter "./sdks/typescript/packages/*" build
      - name: Typecheck and test the token server
        run: |
          pnpm --filter "@hermes/demo-server" run typecheck
          pnpm --filter "@hermes/demo-server" test
      - name: Typecheck and test the React demo
        run: |
          pnpm --filter "@hermes/react-demo" run typecheck
          pnpm --filter "@hermes/react-demo" test
      # A real production build, not just a typecheck: this is what catches an ESM resolution
      # problem, a Lit decorator misconfiguration, or a broken dynamic import of the element —
      # none of which a type check would notice.
      - name: Build the React demo
        run: pnpm --filter "@hermes/react-demo" build
      # Compiles every browser spec and resolves the Playwright config without launching a
      # browser: seconds of runtime, and it catches the bulk of suite rot (import errors, a
      # renamed fixture, a deleted helper). The expensive live run is nightly and on-demand
      # in e2e-live.yml, because it needs a k3d cluster this runner does not have.
      - name: Compile the live E2E specs
        run: |
          pnpm --filter "@hermes/browser-tests" run typecheck
          pnpm --filter "@hermes/browser-tests" run test:list
