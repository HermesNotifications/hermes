name: E2E (live browser)

# The live browser suite: a real Chromium driving the real widget against a real cluster.
#
# Deliberately NOT a required check on every PR. It needs a k3d cluster, ingress-nginx,
# Centrifugo, Postgres/NATS/Redis and ten compiled Go services — none of which ci-web.yml has —
# so it is a 15-to-30 minute job with a large surface of environmental failure, attached to some
# of the most frequently touched paths in the repo. That is how a suite ends up
# `continue-on-error`'d and then ignored.
#
# Instead: nightly, on demand, and opt-in per PR via the `e2e-live` label. Day-to-day confidence
# comes from `make demo-e2e` locally plus the cheap spec-compile step in ci-web.yml.
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily, so a regression is caught within a day of landing.
    - cron: "0 6 * * *"
  # No `branches:` filter — see the note in ci.yml. Safe to widen despite the cost of this job:
  # the `e2e-live` label guard below still gates every pull_request run, so a stacked PR gains
  # the *ability* to opt in rather than a 30-minute run it did not ask for.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-live-${{ github.ref }}
  # Never cancel: a half-torn-down k3d cluster is worse than a queued run.
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.2"

jobs:
  live:
    name: Live browser E2E
    # On a pull request, only when explicitly labelled.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-live')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install k3d and Tilt
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
          k3d version
          tilt version

      # `tilt ci` exits once every resource is ready, or non-zero if any fails to come up. It also
      # runs migrate and seed, which is what produces the dev API key the suite needs.
      - name: Bring up the cluster
        run: make dev-up-ci

      - name: Install dependencies and build the SDKs
        run: make demo-install

      - name: Install the Playwright browser
        run: make demo-e2e-install

      - name: Run the live E2E suite
        run: make demo-e2e

      # Always: the trace of a notification arriving over the websocket is the whole diagnostic
      # value, and it matters most precisely when the run failed.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # always(), not failure(). Retries are what made this a blind spot: a spec that fails
      # twice and passes on the third attempt leaves the job green, so `failure()` never fired
      # and the logs for the interesting runs were discarded. Both realtime flakes investigated
      # so far were exactly that shape, and both were diagnosed from Playwright artifacts alone
      # because no cluster logs existed.
      #
      # The delivery worker already logs `delivery failed` with `attempt` and `notification_id`
      # on every NAK (internal/delivery/worker.go:90). That single line distinguishes a
      # publication retried behind exponential backoff from one that was never retried at all,
      # which is the open question about these flakes. It has been produced all along and
      # thrown away.
      #
      # -n hermes is not optional either: the workloads live in the `hermes` namespace, and
      # without it every lookup resolved against `default` and returned "not found".
      - name: Collect cluster logs
        if: always()
        run: |
          kubectl get pods -n hermes -o wide || true
          # Enumerated per pod rather than per Deployment, for two reasons. `deployment/x`
          # reads a single pod, so a publish handled by the *other* Centrifugo replica was
          # invisible. And `--all-pods` would fix that only on newer kubectl — behind the
          # `|| true` these steps need, an unsupported flag yields no logs at all, which is
          # worse than the gap it closes. Enumerating works on every version.
          for pod in $(kubectl get pods -n hermes -o name 2>/dev/null); do
            echo "::group::$pod"
            kubectl logs -n hermes "$pod" --tail=300 --timestamps || true
            echo "::endgroup::"
          done
          # A container that crashed and restarted leaves its evidence only in the previous
          # instance; the replacement starts clean and looks perfectly healthy. Almost always
          # empty, which is the point — when it is not, that is the answer.
          echo "::group::previous instances (present only if something restarted)"
          for pod in $(kubectl get pods -n hermes -o name 2>/dev/null); do
            kubectl logs -n hermes "$pod" --previous --tail=200 --timestamps 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: make dev-down || true
