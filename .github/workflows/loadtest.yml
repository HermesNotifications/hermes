name: Load Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run"
        required: true
        default: send
        type: choice
        options: [send, inbox-mixed, soak]
      parallelism:
        description: "TestRun parallelism"
        required: true
        default: "2"
      vus:
        description: "Virtual users (inbox-mixed/soak)"
        default: "1000"
      target_rps:
        description: "Target RPS (send)"
        default: "500"
      duration:
        description: "Test duration (k6 format)"
        default: "10m"
  schedule:
    # Nightly soak at 2am UTC
    - cron: "0 2 * * *"

permissions:
  id-token: write   # AWS OIDC
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  run:
    runs-on: ubuntu-latest
    # Was `staging`. Load tests now run against the dedicated single-AZ loadtest cluster
    # (infra/terraform/environments/loadtest.tfvars) so that a 4h nightly soak neither
    # degrades staging as a rehearsal environment nor bills cross-AZ transfer on every
    # request. REQUIRES a `loadtest` GitHub environment holding LOADTEST_CLUSTER and its
    # own AWS_LOADTEST_ROLE_ARN and ECR_REGISTRY.
    environment: loadtest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_LOADTEST_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.LOADTEST_CLUSTER }} --region us-east-1

      # ADR 0023. The environment is pinned to one AZ so a run does not pay cross-AZ
      # transfer on every hop, but the pin spans Terraform (node groups) and Crossplane
      # (Aurora, ElastiCache) with nothing enforcing that the two agree. A drift breaks
      # nothing and reports nothing — it just makes the run more expensive than not
      # pinning at all. Seconds of preflight against a run that takes hours.
      #
      # Not `continue-on-error`: a soak that costs several times what it should is worth
      # stopping for, and the failure names the exact claim file to fix.
      - name: Verify single-AZ placement
        env:
          CLUSTER: ${{ secrets.LOADTEST_CLUSTER }}
        run: infra/scripts/check-single-az.sh "$CLUSTER" us-east-1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build and push loadseed image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
          IMG=$REGISTRY/loadseed:${{ github.sha }}
          docker build -f cmd/loadseed/Dockerfile -t $IMG .
          docker push $IMG
          echo "LOADSEED_IMAGE=$IMG" >> $GITHUB_ENV

      - name: Determine run parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_PARALLELISM: ${{ inputs.parallelism }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_VUS: ${{ inputs.vus }}
          INPUT_TARGET_RPS: ${{ inputs.target_rps }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "scenario=soak" >> $GITHUB_OUTPUT
            echo "parallelism=3" >> $GITHUB_OUTPUT
            echo "duration=4h" >> $GITHUB_OUTPUT
            echo "vus=2000" >> $GITHUB_OUTPUT
            echo "target_rps=300" >> $GITHUB_OUTPUT
          else
            echo "scenario=$INPUT_SCENARIO" >> $GITHUB_OUTPUT
            echo "parallelism=$INPUT_PARALLELISM" >> $GITHUB_OUTPUT
            echo "duration=$INPUT_DURATION" >> $GITHUB_OUTPUT
            echo "vus=$INPUT_VUS" >> $GITHUB_OUTPUT
            echo "target_rps=$INPUT_TARGET_RPS" >> $GITHUB_OUTPUT
          fi

      - name: Run load test
        env:
          SCENARIO: ${{ steps.params.outputs.scenario }}
          PARALLELISM: ${{ steps.params.outputs.parallelism }}
          DURATION: ${{ steps.params.outputs.duration }}
          VUS: ${{ steps.params.outputs.vus }}
          TARGET_RPS: ${{ steps.params.outputs.target_rps }}
        run: make loadtest-k8s

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: loadtest-artifacts-${{ github.run_id }}
          path: artifacts/
