name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/k8s/overlays/*/kustomization.yaml'
      # Kargo's automated image-tag commits: skip CI (and thus CD, which now
      # triggers on CI completion) so deploys don't rebuild/republish images.
      - 'deploy/k8s/overlays/*/images/kustomization.yaml'
  # No `branches:` filter, deliberately. Gating on [main] meant a PR stacked on another PR --
  # targeting its parent's branch rather than main -- ran no CI at all, and said so only as an
  # absence: `gh pr checks` reports "no checks reported", which reads much like a queue that has
  # not started yet. A stacked PR is where CI is needed most, because it is the one whose base
  # is itself unmerged and moving.
  #
  # The push trigger above stays pinned to main: every branch push building the full matrix is
  # cost with no reader, and the PR run already covers the branch.
  pull_request:

# Cancel superseded runs on the same ref. PR runs are cancellable (a new push
# obsoletes the previous run); main-branch runs are not, so every commit on main
# is fully built and tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: "v2.11.3"

      - name: Check license headers
        run: make license-check

      # An ADR number is allocated at authoring time by writers who cannot see each other, so
      # two long-lived branches each add "the next one" against the main they branched from and
      # both are right until they meet. Nothing notices locally: the collision only exists
      # relative to a main neither branch has met. PR #73 carried an 0010 against main's
      # different 0010, and a branch stacked on it added an 0011 and 0012 against main's own.
      #
      # The explicit fetch is what makes this gate do anything. actions/checkout takes a shallow
      # clone of the PR merge ref, so `origin/main` is not a ref here — and the check treats an
      # unreadable base as a skip, which would have made this step a decoration.
      - name: Fetch the base branch for the ADR numbering check
        run: git fetch --depth=1 origin main

      # No dependency install: this gate and its tests are pure stdlib, unlike the manifest
      # gates that need PyYAML.
      - name: ADR numbers must not collide with main
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_adr_numbering.py' -t scripts
          python3 scripts/check_adr_numbering.py --base origin/main --require-base

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  test-integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        # SMTP sink for the email-delivery E2E test (SMTP :1025, HTTP API :8025)
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      HERMES_DATABASE_URL: postgres://hermes:hermes@localhost:5432/hermes?sslmode=disable
      HERMES_NATS_URL: nats://localhost:4222
      HERMES_REDIS_URL: redis://localhost:6379
      HERMES_DYNAMO_ENDPOINT: http://localhost:8000
      HERMES_DYNAMO_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine --jetstream --store_dir=/data
          sleep 2

      - name: Start DynamoDB Local
        # Mirrors the docker-compose dynamodb-local service the integration tests
        # in internal/store/dynamo expect at localhost:8000.
        run: |
          docker run -d --name dynamodb-local -p 8000:8000 amazon/dynamodb-local:latest \
            -jar DynamoDBLocal.jar -sharedDb -inMemory
          sleep 2

      - name: Build migrate tool
        run: go build -o ./bin/migrate ./cmd/migrate/

      - name: Run database migrations
        run: ./bin/migrate -migrations-path ./migrations

      - name: Run integration and E2E tests
        # -p 1 serializes packages: integration tests share a single Postgres/NATS/Redis
        # instance, and the NATS WorkQueue streams allow only one consumer per subject.
        run: go test ./... -tags=integration -race -p 1 -timeout=120s -count=1

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all services
        run: |
          go build ./cmd/admin/
          go build ./cmd/send/
          go build ./cmd/dispatch/
          go build ./cmd/worker-events/
          go build ./cmd/worker-email/
          go build ./cmd/worker-sms/
          go build ./cmd/worker-inbox/
          go build ./cmd/inbox/
          go build ./cmd/user/
          go build ./cmd/migrate/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      # On PRs, only smoke-test the admin image; on main, build every service.
      # The matrix is selected here so PRs spin up one runner instead of ten.
      matrix:
        service: ${{ fromJSON(github.event_name == 'pull_request' && '["admin"]' || '["admin","send","dispatch","worker-events","worker-email","worker-sms","worker-inbox","inbox","user","migrate","natsprovision"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: hermes-${{ matrix.service }}:ci
          push: false
          # Per-service GHA layer cache: reuses go mod download + dependency
          # build layers across runs (scoped per service to avoid cross-eviction).
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.service }}

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Add chart repositories
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add centrifugal https://centrifugal.github.io/helm-charts
      - run: helm dependency build charts/hermes/
      - run: helm lint charts/hermes/ --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test --set global.domain=test.example.com
      - run: jq . charts/hermes/values.schema.json > /dev/null
      # check_helm_render.py parses rendered YAML and now fails rather than skips without
      # PyYAML. See the same step in the manifests job for why relying on the runner image
      # shipping it was a latent way to turn the gate off.
      - name: Install the manifest gates' Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Unit-test the chart render gate
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -t scripts
      # This step replaces `helm template ... > /dev/null`, which proved the chart renders
      # and asserted nothing about what it renders. The chart reached main with six
      # services crash-looping at boot for want of the natsprovision Job, two ingress
      # routes no handler has served since the group/type rename, four admin endpoints
      # with no route at all, and the bundled NATS images rewritten under the Hermes
      # registry. Every one of those rendered cleanly.
      - name: Check the rendered chart against the Go source
        run: |
          helm template test charts/hermes/ \
            --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test \
            --set global.domain=test.example.com \
            | python3 scripts/check_helm_render.py - --source-root=.
      # Optional features render workloads the default install never produces. hermes-cleanup
      # was missing from the cd.yml publish matrix and only surfaces when the CronJob renders.
      - name: Check the optional-feature render too
        run: |
          helm template test charts/hermes/ \
            --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test \
            --set global.domain=test.example.com \
            --set hermes.cleanup.enabled=true --set networkPolicy.enabled=true \
            --set observability.enabled=true \
            | python3 scripts/check_helm_render.py - --source-root=.
      # Traefik gets a different realtime route entirely: a stripPrefix Middleware and a plain
      # prefix, because Traefik v3 removed regex from Ingress paths and the nginx form matches
      # nothing there. Checking only the nginx render leaves every k3s cluster — probably the
      # most common self-hosting setup — with a silently dead websocket endpoint.
      - name: Check the Traefik render too
        run: |
          helm template test charts/hermes/ \
            --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test \
            --set global.domain=test.example.com \
            --set ingress.className=traefik \
            | python3 scripts/check_helm_render.py - --source-root=.
      - name: A production install on bundled sub-charts must be refused at render time
        run: |
          if helm template test charts/hermes/ \
               --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test \
               --set global.domain=test.example.com --set hermes.env=production \
               > /dev/null 2>&1; then
            echo "::error::hermes.env=production rendered with bundled sub-charts; every workload would exit on config.Validate()"
            exit 1
          fi
      - name: The admin portal on its unpublished default image must be refused
        run: |
          if helm template test charts/hermes/ \
               --set hermes.jwt.secret=test --set hermes.apiKey.hmacSecret=test \
               --set global.domain=test.example.com --set adminPortal.enabled=true \
               > /dev/null 2>&1; then
            echo "::error::adminPortal.enabled=true rendered against hermes-admin-portal, which nothing in this repository builds"
            exit 1
          fi
      # release.yml asserts the same thing against the tag, but only once a tag exists — by
      # which point the fix is a new tag rather than a commit. Catch it on the PR instead.
      # The chart's appVersion is what _helpers.tpl defaults every image tag to, so a chart
      # claiming 0.1.0 while version says 0.2.0 renders images that were never published.
      - name: Chart version and appVersion must agree, and be in the changelog
        run: |
          set -euo pipefail
          version=$(grep '^version:' charts/hermes/Chart.yaml | awk '{print $2}')
          app_version=$(grep '^appVersion:' charts/hermes/Chart.yaml | awk '{print $2}' | tr -d '"')

          if [ "$version" != "$app_version" ]; then
            echo "::error::charts/hermes/Chart.yaml version ($version) != appVersion ($app_version)."
            echo "They are one number: appVersion is the default tag for every Hermes image."
            exit 1
          fi
          if ! grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section."
            echo "release.yml builds the GitHub Release notes from it and fails without one."
            exit 1
          fi

  kustomize-validate:
    name: Validate Kustomize Overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Every gate below parses rendered YAML and so needs PyYAML. Nothing declared it: the
      # steps passed because ubuntu-latest happens to ship PyYAML for the system python3, and
      # the gates treated its absence as a reason to SKIP and exit 0. A runner image change
      # would therefore have turned six controls off at once with no failing step. The gates
      # now fail closed on a missing PyYAML, which makes this step load-bearing rather than
      # belt-and-braces.
      - name: Install the manifest gates' Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Validate all overlays render cleanly
        run: |
          kubectl kustomize deploy/k8s/overlays/local
          kubectl kustomize deploy/k8s/overlays/staging
          kubectl kustomize deploy/k8s/overlays/production

      # Finding 47: rendering cleanly is not enough. A NetworkPolicy whose selector
      # matches no pod is accepted by kustomize and by the API server, and is
      # indistinguishable from a working one until enforcement is switched on. This gate
      # was added to `make verify` but never to CI, so until now nothing on the merge
      # path would have caught a reintroduction.
      - name: NetworkPolicy selectors must match pods
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -t scripts
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_networkpolicy_selectors.py -
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_networkpolicy_selectors.py -

      # Every alert MUST ship with a runbook (CLAUDE.md), and the rules files have claimed
      # a CI check enforced that since they were written. None did. A runbook_url is
      # followed by whoever is paged; a 404 there costs the minutes it exists to save.
      - name: Every alert must have a runbook that exists
        run: python3 scripts/check_runbook_links.py

      # The route gate ran over the Helm chart only. The overlays are what actually deploy
      # staging and production, and they had drifted to 7 of base's 12 rules: /v1/templates,
      # /v1/apikeys, /v1/organizations and /v1/subscriptions unreachable in both
      # environments, and /v1/users pointed at the user service instead of admin. A
      # strategic-merge patch adding a `host` has to restate the whole atomic rules list,
      # so the copy drifted from base and rendered perfectly the entire time.
      #
      # The deployed overlays get every check, including images: hermes-natsprovision and
      # hermes-cleanup rendered as bare names for want of a Kargo entry, which resolves to
      # docker.io/library/<name>:latest and cannot pull. Local is the exception and gets
      # only the routing checks — Tilt builds its images (untagged by design) and runs
      # stream provisioning as a local_resource rather than the in-cluster Job, both of
      # which overlays/local/kustomization.yaml patches out deliberately.
      - name: Rendered overlays must match the Go source
        run: |
          kubectl kustomize deploy/k8s/overlays/local | python3 scripts/check_helm_render.py - --source-root=. --only=routes,rewrites
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_helm_render.py - --source-root=.
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_helm_render.py - --source-root=.

      # ADR 0005 phase 4. This gate has been in `make verify` since it was written and was
      # never added here — the same "exists but does not run on the merge path" gap the
      # NetworkPolicy step above closed one release earlier.
      - name: The CA private key must not render into the application namespace
        run: |
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_ca_key_location.py - --namespace hermes
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_ca_key_location.py - --namespace hermes

      # ADR 0006. A Job's spec.template is immutable and Kargo rewrites its image tag on
      # every promotion, so a Job that is not an ArgoCD hook applies once and then fails
      # the SECOND promotion with `field is immutable` — while the Application can still
      # report health: Healthy, because no workload changed. Every other step in this job
      # passes identically with that defect present and absent.
      - name: Every Job must be a usable ArgoCD hook
        run: |
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_job_hooks.py -
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_job_hooks.py -

      # Finding 36. A one-character typo in the send PDB's selector (`hermes-sned`) took
      # expectedPods from 3 to 0 with no error from kustomize, kubectl or the API server.
      - name: Every PodDisruptionBudget must protect something
        run: |
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_pdb_selectors.py -

      # Finding 8. hermes-send rendered with no resource requests, no HPA and no PDB and
      # nothing objected. An HPA whose target declares no request for the resource it
      # measures reports ScalingActive=False / FailedGetResourceMetric and never scales.
      # The local overlay is deliberately exempt — see the script's module docstring.
      - name: Workloads must declare requests, and HPAs must be able to read their metric
        run: |
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_workload_resources.py -
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_workload_resources.py - --require-hpa

      # Finding 53. An EMPTY $HERMES_CENTRIFUGO_NATS_PASSWORD is not a parse error — the
      # server starts and accepts a `centrifugo` client presenting no credential at all. The
      # guard is an initContainer, so a cluster missing it looks perfectly healthy and there
      # is no runtime signal to alert on. Local is checked too, and legitimately passes
      # without the guard: it drops `-c nats.conf` and never reads the accounts file.
      - name: NATS must refuse to start on an empty Centrifugo password
        run: |
          kubectl kustomize deploy/k8s/overlays/local | python3 scripts/check_nats_password_guard.py -
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_nats_password_guard.py -
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_nats_password_guard.py -

      # ADR 0005 phase 4's named residual. A `ca` ClusterIssuer can be referenced from ANY
      # namespace, and a leaf it signs is trusted by every Hermes service — enough to
      # impersonate the NATS server. The policy closing it has two silently-inert shapes:
      # unbound, or bound with Warn instead of Deny.
      - name: The internal CA must only be usable from the hermes namespace
        run: |
          kubectl kustomize deploy/k8s/overlays/staging | python3 scripts/check_ca_issuer_policy.py -
          kubectl kustomize deploy/k8s/overlays/production | python3 scripts/check_ca_issuer_policy.py -

  infra-scripts:
    name: Infra Shell Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # infra/scripts/lib.sh derives the database and Redis URLs that config.Validate
      # accepts or rejects, and guards the bootstrap role ARN against finding 7's exact
      # mistake (production bootstrapped with staging's ARN). It shipped with 17 passing
      # tests that nothing ran: `make verify-manifests` discovers only scripts/.
      - name: Test infra/scripts/lib.sh
        run: ./infra/scripts/test-lib.sh

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout and swallows exit codes in some shapes; we only
          # want the binary on PATH so `make tf-check` behaves exactly as it does locally.
          terraform_wrapper: false

      # ADR 0007 records that `terraform validate` and `fmt -check` WERE run during that
      # work — by hand, once, and then never again, because Terraform was in neither
      # `make verify` nor CI. `make tf-check` fails loudly when terraform is absent rather
      # than skipping; here it is guaranteed present, so this genuinely runs every merge.
      #
      # `terraform init -backend=false` rewrites .terraform.lock.hcl to add the runner's
      # platform hashes. That is expected and not committed — do not add a `git diff
      # --exit-code` assertion here, it would fail on every run for no reason.
      - name: Credential-free terraform fmt and validate
        run: make tf-check

  chart-install:
    # WHAT THIS COVERS, AND WHAT IT DOES NOT — read before trusting a green tick.
    #
    # COVERED: the chart installs into a real cluster; the bundled Postgres, Redis, NATS
    # and Centrifugo actually start; and `helm test` connects to Postgres and Redis using
    # HERMES_DATABASE_URL and HERMES_REDIS_URL read out of the chart's OWN rendered Secret
    # and ConfigMap. That last part is the point. hermes.databaseUrl and hermes.redisUrl
    # build a hostname by string-formatting, and a hostname naming no Service renders,
    # lints, and passes `helm template` and scripts/check_helm_render.py without a murmur —
    # verified: with both connection-URL helpers reverted to the old Bitnami Service names,
    # `make verify-chart` stayed green. Only connecting catches it.
    #
    # NOT COVERED: any Hermes service. ghcr.io/hermesnotifications/hermes-*:0.1.0 is not
    # published and returns 403 Forbidden to an anonymous pull, so no Hermes pod can start
    # here. The nine Deployments are therefore installed at replicas=0 rather than left to
    # ImagePullBackOff, and the templates/tests/test-connection.yaml pod — which curls the
    # services' /healthz — is deliberately EXCLUDED by --filter. It cannot pass until a
    # release is cut, and a job that appeared to run it would be claiming coverage it does
    # not have. The two provisioning Jobs still fail to pull; that is expected and does not
    # fail this job, because `helm install --wait` does not wait for Jobs.
    #
    # When the images are published: drop the replicas=0 overrides, add --wait-for-jobs,
    # and remove the --filter so test-connection runs too.
    name: Chart Install on kind (datastores only, see comments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: hermes-chart-gate

      - name: Add chart repositories
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add centrifugal https://centrifugal.github.io/helm-charts
          helm dependency build charts/hermes/

      # replicas=0 on every Hermes service: the images 403, so the alternative is nine
      # Deployments in ImagePullBackOff and a --wait that times out after ten minutes.
      # This way the failure that matters (a datastore that does not come up, or a
      # connection URL naming no Service) is the only thing that can fail the step.
      - name: Install the chart
        run: |
          helm install hermes charts/hermes/ \
            --namespace hermes-chart-gate --create-namespace \
            --set hermes.jwt.secret=citest --set hermes.apiKey.hmacSecret=citest \
            --set global.domain=ci.example.com \
            --set admin.replicas=0 --set send.replicas=0 --set dispatch.replicas=0 \
            --set inbox.replicas=0 --set user.replicas=0 \
            --set workerEmail.replicas=0 --set workerSms.replicas=0 \
            --set workerInbox.replicas=0 --set workerEvents.replicas=0 \
            --wait --timeout 10m

      - name: The bundled datastores must be reachable at the URLs the chart generates
        run: |
          helm test hermes --namespace hermes-chart-gate \
            --filter name=hermes-test-datastores --timeout 5m

      - name: Show what actually ran
        if: always()
        run: |
          kubectl -n hermes-chart-gate get pods
          echo "--- datastore test output (the assertion this job exists for) ---"
          kubectl -n hermes-chart-gate logs hermes-test-datastores --all-containers || true

  bootstrap-key:
    # The first API key is the one thing whose absence makes a whole install useless, and it
    # is the newest code here — so unlike the services above, it gets real coverage rather
    # than a note explaining why it cannot.
    #
    # It does not need a published image: migrate and bootstrap are built from this commit,
    # tagged as the exact reference the chart renders, and loaded into kind. The default
    # IfNotPresent then uses the loaded copy and never reaches the registry. That is also
    # incidentally a test that the rendered image reference is the one we think it is.
    name: First API key bootstrap on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: hermes-bootstrap-gate

      - name: Build migrate and bootstrap from this commit
        run: |
          set -euo pipefail
          for svc in migrate bootstrap; do
            docker buildx build \
              --build-arg SERVICE="$svc" \
              -t "ghcr.io/hermesnotifications/hermes-${svc}:$(grep '^appVersion:' charts/hermes/Chart.yaml | awk '{print $2}' | tr -d '\"')" \
              --cache-from "type=gha,scope=cd-${svc}" \
              --load -f deploy/docker/Dockerfile .
          done
          kind load docker-image --name hermes-bootstrap-gate \
            $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'hermes-(migrate|bootstrap):')

      - name: Add chart repositories
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add centrifugal https://centrifugal.github.io/helm-charts
          helm dependency build charts/hermes/

      # The nine services still cannot pull, so they stay at replicas=0. natsProvision is off
      # for the same reason. What remains is exactly the path under test: Postgres, the
      # migration that creates api_keys, and the bootstrap Job.
      #
      # The NATS and Centrifugo sub-charts stay ENABLED even though nothing here uses them.
      # Disabling one without supplying the matching external* connection is refused by the
      # schema, correctly — an install with neither a bundled bus nor an external one has no
      # bus at all. They pull from their own registries, so unlike the Hermes images they
      # start fine; they just cost a little wall-clock.
      - name: Install
        run: |
          helm install hermes charts/hermes/ \
            --namespace hermes-bootstrap-gate --create-namespace \
            --set hermes.jwt.secret=citest --set hermes.apiKey.hmacSecret=citest \
            --set global.domain=ci.example.com \
            --set natsProvision.enabled=false \
            --set admin.replicas=0 --set send.replicas=0 --set dispatch.replicas=0 \
            --set inbox.replicas=0 --set user.replicas=0 \
            --set workerEmail.replicas=0 --set workerSms.replicas=0 \
            --set workerInbox.replicas=0 --set workerEvents.replicas=0 \
            --wait --wait-for-jobs --timeout 10m

      - name: A usable key must exist in the Secret
        run: |
          set -euo pipefail
          key=$(kubectl -n hermes-bootstrap-gate get secret hermes-bootstrap \
                  -o jsonpath='{.data.HERMES_API_KEY}' | base64 -d)
          if [ -z "$key" ]; then
            echo "::error::the bootstrap Secret holds no key; a fresh install would be unusable"
            exit 1
          fi

          # Raw keys are hms_key_<id>_<secret> (auth.GenerateAPIKey), so the api_keys id is
          # `key_<id>` -- fields 2 and 3. The secret is field 4 and must never be echoed.
          key_id=$(echo "$key" | cut -d_ -f2-3)
          echo "key id: ${key_id}"

          # The key is worthless unless the database agrees. Compare the id in the Secret with
          # the row, rather than trusting that the Job exited 0.
          rows=$(kubectl -n hermes-bootstrap-gate exec statefulset/hermes-postgresql -- \
                   psql -U hermes -d hermes -tAc \
                   "SELECT count(*) FROM api_keys WHERE id = '${key_id}'")
          if [ "$rows" != "1" ]; then
            echo "::error::the key in the Secret has no api_keys row (found ${rows}); it would not authenticate"
            exit 1
          fi

          # apikeys:manage specifically: without it the bootstrap key cannot mint the narrow
          # key meant to replace it, so it could never be retired.
          perms=$(kubectl -n hermes-bootstrap-gate exec statefulset/hermes-postgresql -- \
                    psql -U hermes -d hermes -tAc \
                    "SELECT permissions FROM api_keys WHERE id = '${key_id}'")
          case "$perms" in
            *apikeys:manage*) ;;
            *) echo "::error::bootstrap key lacks apikeys:manage (got ${perms})"; exit 1 ;;
          esac

      - name: An upgrade must not mint a second key
        run: |
          set -euo pipefail
          before=$(kubectl -n hermes-bootstrap-gate get secret hermes-bootstrap \
                     -o jsonpath='{.data.HERMES_API_KEY}')

          helm upgrade hermes charts/hermes/ \
            --namespace hermes-bootstrap-gate --reuse-values \
            --wait --wait-for-jobs --timeout 10m

          after=$(kubectl -n hermes-bootstrap-gate get secret hermes-bootstrap \
                    -o jsonpath='{.data.HERMES_API_KEY}')
          if [ "$before" != "$after" ]; then
            echo "::error::the key changed across an upgrade; every place it was pasted would break"
            exit 1
          fi

          count=$(kubectl -n hermes-bootstrap-gate exec statefulset/hermes-postgresql -- \
                    psql -U hermes -d hermes -tAc "SELECT count(*) FROM api_keys")
          if [ "$count" != "1" ]; then
            echo "::error::${count} api_keys rows after one upgrade; keys are leaking per revision"
            exit 1
          fi

      - name: Show what actually ran
        if: always()
        run: |
          kubectl -n hermes-bootstrap-gate get pods,jobs
          kubectl -n hermes-bootstrap-gate logs -l app.kubernetes.io/component=bootstrap \
            --tail=50 --prefix || true
