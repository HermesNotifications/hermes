name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/k8s/overlays/*/kustomization.yaml'
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.3"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  test-integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERMES_DATABASE_URL: postgres://hermes:hermes@localhost:5432/hermes?sslmode=disable
      HERMES_NATS_URL: nats://localhost:4222
      HERMES_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine --jetstream --store_dir=/data
          sleep 2

      - name: Build migrate tool
        run: go build -o ./bin/migrate ./cmd/migrate/

      - name: Run database migrations
        run: ./bin/migrate -migrations-path ./migrations

      - name: Run integration and E2E tests
        run: go test ./... -tags=integration -race -timeout=120s -count=1

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all services
        run: |
          go build ./cmd/admin/
          go build ./cmd/dispatch/
          go build ./cmd/worker-events/
          go build ./cmd/worker-email/
          go build ./cmd/worker-sms/
          go build ./cmd/worker-inbox/
          go build ./cmd/inbox/
          go build ./cmd/user/
          go build ./cmd/migrate/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        service:
          - admin
          - dispatch
          - worker-events
          - worker-email
          - worker-sms
          - worker-inbox
          - inbox
          - user
          - migrate
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker build \
            --build-arg SERVICE="$SERVICE" \
            -t "hermes-${SERVICE}:ci" \
            -f deploy/docker/Dockerfile .

      - name: Build Docker image (PR smoke test)
        if: github.event_name == 'pull_request' && matrix.service == 'admin'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker build \
            --build-arg SERVICE="$SERVICE" \
            -t "hermes-${SERVICE}:ci" \
            -f deploy/docker/Dockerfile .

  kustomize-validate:
    name: Validate Kustomize Overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all overlays render cleanly
        run: |
          kubectl kustomize deploy/k8s/overlays/local
          kubectl kustomize deploy/k8s/overlays/staging
          kubectl kustomize deploy/k8s/overlays/production
