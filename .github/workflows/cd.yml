name: CD

# Internal delivery only: SHA-tagged images to this project's private ECR, feeding Kargo and
# ArgoCD. The *public* release -- GHCR images and the Helm chart -- is release.yml, which is
# deliberately independent of AWS so that cutting a release needs no cloud account. See the
# header comment there.

on:
  # Build & push only after CI succeeds on main, so we never publish images for a
  # commit that failed CI. Kargo's automated image-tag commits don't trigger CI
  # (excluded via CI's paths-ignore), so they don't reach CD either.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write    # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # KEEP IN SYNC with release.yml's matrix. scripts/check_helm_render.py asserts the two
        # agree: a service published to ECR but not to GHCR would be invisible to every
        # self-hoster, and one published to GHCR but not ECR would break Kargo.
        service:
          - admin
          - dispatch
          - send
          - worker-events
          - worker-email
          - worker-sms
          - worker-inbox
          - inbox
          - user
          - migrate
          # ADR 0005 phase 4. Run-to-completion like migrate: the only bus identity that may
          # declare a JetStream stream. Services fail closed without it, so it must ship.
          - natsprovision
          # charts/hermes/templates/cleanup-cronjob.yaml references hermes-cleanup, and this
          # matrix did not build it — so `hermes.cleanup.enabled=true` was an ImagePullBackOff.
          # Caught by scripts/check_helm_render.py, which reads this list to decide whether an
          # image under the Hermes registry actually exists.
          - cleanup
          - bootstrap
          # Same reasoning as cleanup above: optional at install time, but the image must exist
          # before prober.enabled can be turned on.
          - prober
    env:
      # The exact commit CI validated. github.sha is the branch tip, which can race ahead of
      # the run that passed, so pin to the run's head_sha.
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hermes-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push Docker image
        env:
          SERVICE: ${{ matrix.service }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE="$SERVICE" \
            -t "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --cache-from "type=gha,scope=cd-${SERVICE}" \
            --cache-to "type=gha,mode=max,scope=cd-${SERVICE}" \
            --push \
            -f deploy/docker/Dockerfile .
