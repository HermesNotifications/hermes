name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      # Don't trigger on Kargo's automated image tag updates
      - 'deploy/k8s/overlays/*/images/kustomization.yaml'

permissions:
  id-token: write    # OIDC for AWS
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # Only run CD if CI passed (reuse CI checks)
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - admin
          - router
          - worker-events
          - worker-email
          - worker-sms
          - worker-inbox
          - inbox
          - user
          - migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hermes-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE="$SERVICE" \
            -t "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --push \
            -f deploy/docker/Dockerfile .
