name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      # Don't trigger on Kargo's automated image tag updates
      - 'deploy/k8s/overlays/*/images/kustomization.yaml'

permissions:
  id-token: write    # OIDC for AWS
  contents: read
  packages: write    # Push to GHCR on version tags

env:
  AWS_REGION: us-east-1

jobs:
  # Only run CD if CI passed (reuse CI checks)
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - admin
          - dispatch
          - send
          - worker-events
          - worker-email
          - worker-sms
          - worker-inbox
          - inbox
          - user
          - migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hermes-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE="$SERVICE" \
            -t "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --push \
            -f deploy/docker/Dockerfile .

      - name: Tag with semver version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/hermes-${SERVICE}:${VERSION}"

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --tag "ghcr.io/hermesnotifications/hermes-${SERVICE}:${VERSION}"
