name: CD

on:
  # Build & push only after CI succeeds on main, so we never publish images for a
  # commit that failed CI. Kargo's automated image-tag commits don't trigger CI
  # (excluded via CI's paths-ignore), so they don't reach CD either.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Version tags are cut from already-merged, CI-passed commits.
  push:
    tags: ["v*"]

permissions:
  id-token: write    # OIDC for AWS
  contents: read
  packages: write    # Push to GHCR on version tags

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    # Tag pushes always proceed; CI-completion runs only proceed on success.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - admin
          - dispatch
          - send
          - worker-events
          - worker-email
          - worker-sms
          - worker-inbox
          - inbox
          - user
          - migrate
          # ADR 0005 phase 4. Run-to-completion like migrate: the only bus identity that may
          # declare a JetStream stream. Services fail closed without it, so it must ship.
          - natsprovision
          # charts/hermes/templates/cleanup-cronjob.yaml references hermes-cleanup, and this
          # matrix did not build it — so `hermes.cleanup.enabled=true` was an ImagePullBackOff.
          # Caught by scripts/check_helm_render.py, which reads this list to decide whether an
          # image under the Hermes registry actually exists.
          - cleanup
    env:
      # The exact commit CI validated. For workflow_run, github.sha is the branch
      # tip (which can race ahead), so we pin to the run's head_sha; for tag
      # pushes there's no workflow_run, so fall back to github.sha.
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hermes-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push Docker image
        env:
          SERVICE: ${{ matrix.service }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE="$SERVICE" \
            -t "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --cache-from "type=gha,scope=cd-${SERVICE}" \
            --cache-to "type=gha,mode=max,scope=cd-${SERVICE}" \
            --push \
            -f deploy/docker/Dockerfile .

      - name: Tag with semver version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/hermes-${SERVICE}:${VERSION}"

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            "${ECR_REGISTRY}/hermes-${SERVICE}:${IMAGE_TAG}" \
            --tag "ghcr.io/hermesnotifications/hermes-${SERVICE}:${VERSION}"
